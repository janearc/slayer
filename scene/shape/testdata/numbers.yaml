# every number the scene/shape tests choose, with what it is and why it was
# chosen. a test asks for each by name, through picked.
numbers:
  - name: fixtures-probe
    value: 1.0e8
    says: a number the fixtures test reads back, to show the book is read
    kind: picked
    by: any number does; this is the distance of the far small sphere
  - name: meshtree-more-leaf-most
    value: 8
    says: the most faces a leaf of a mesh's tree may hold
    kind: picked
    by: the limit the tree's cutting keeps, worked by hand in the tests that ask for it
  - name: meshtree-more-walk-places
    value: 128
    says: the places a walk down a mesh's tree has to keep its way back
    kind: picked
    by: far deeper than any tree of the tests' meshes reaches, so a tree at it is a fault
  - name: meshtree-more-depth-limit
    value: 64
    says: the depth of a mesh's tree from which a node is cut in half by count
    kind: picked
    by: the depth the tests that worked the cuts by hand were worked at
  - name: meshtree-more-overlap-copies
    value: 8
    says: how many copies of one triangle lie almost on one another
    kind: picked
    by: as many as a leaf may hold, so that all of them stay one leaf
  - name: meshtree-more-overlap-divisions
    value: 8
    says: the parts of a unit that each copy is shifted along x from the last, an eighth
    kind: picked
    by: worked by hand in the test's comment, boxes of area 300 and 326.25 together
  - name: meshtree-more-overlap-half-base
    value: 5
    says: half the base of each overlapping triangle, which runs from minus this to this along x
    kind: picked
    by: makes the triangle 10 across, worked by hand in the test's comment
  - name: meshtree-more-overlap-apex
    value: 10
    says: how far up the top corner of each overlapping triangle lies
    kind: picked
    by: makes the triangle 15 up from its base, worked by hand in the test's comment
  - name: meshtree-more-ninth-aside
    value: 1
    says: how far along x the ninth nested square is from the other eight
    kind: picked
    by: a little to the side, so the cut that leaves it alone costs what the test's comment works out
  - name: meshtree-more-far-size
    value: 1
    says: the size of each square in the faces far apart, 2 across
    kind: picked
    by: worked by hand in the test's comment, boxes of area 8
  - name: meshtree-more-far-one-along
    value: 100
    says: how far along x the second of the faces far apart lies
    kind: picked
    by: far enough that cutting costs less than testing the faces, worked by hand in the test's comment
  - name: meshtree-more-far-two-along
    value: 200
    says: how far along x the third of the faces far apart lies
    kind: picked
    by: twice the second's distance, worked by hand in the test's comment
  - name: meshtree-more-cluster-apart
    value: 1000
    says: how far along x the second cluster of faces lies from the first
    kind: picked
    by: far enough that the root splits between the clusters, worked by hand in the test's comment
  - name: meshtree-more-cut-size
    value: 1
    says: the size of each square the cut tests place, 2 across
    kind: picked
    by: worked by hand in the tests' comments, boxes of area 8
  - name: meshtree-more-chain-stride
    value: 37
    says: the step by which the faces of a chain are numbered out of the order of their rank
    kind: picked
    by: shares no factor with the chain's length, so every rank is met once
  - name: meshtree-more-chain-tenth
    value: 10
    says: the divisor that makes the size of each face of a chain a tenth of its distance
    kind: picked
    by: each face ten times the size of the last, as the test's comment says
  - name: meshtree-more-chain-length
    value: 80
    says: how many faces a chain has
    kind: picked
    by: enough that the tree goes past the depth at which it is cut by count
  - name: meshtree-more-halved-each
    value: 8
    says: the faces in each half when a node of sixteen is cut in half by count
    kind: picked
    by: worked by hand in the test's comment, the node at depth 64 holds 16
  - name: meshtree-more-hair-soup-faces
    value: 600
    says: how many faces the soup has whose boxes are checked
    kind: picked
    by: enough faces for a tree several cuts deep
  - name: meshtree-more-hair-cube-cells
    value: 3
    says: how many squares each side of the stretched cube is cut into, along each edge
    kind: picked
    by: enough that the cube has faces to cut between
  - name: meshtree-more-hair-stretch-up
    value: 4
    says: how many times the cube is stretched up
    kind: picked
    by: worked by hand in the test's comment, sides of 2, 8 and 4
  - name: meshtree-more-hair-stretch-deep
    value: 2
    says: how many times the cube is stretched deep
    kind: picked
    by: worked by hand in the test's comment, sides of 2, 8 and 4
  - name: meshtree-more-hair-stretched
    value: 8.0e-9
    says: the hair a box is let out by, worked by hand for the stretched cube
    kind: picked
    by: a billionth of the longest side, 8, as the test's comment says
  - name: meshtree-more-hair-share
    value: 1.0e-9
    says: the share of the longest side of a mesh that a box is let out by
    kind: picked
    by: a billionth, as the test's comment says
  - name: meshtree-more-miss-at-y
    value: 2
    says: the height at which the ray starts, before it is missed by a hair
    kind: picked
    by: worked by hand in the test's comment, the slab is entered at one more than the miss
  - name: meshtree-more-area-width
    value: 2
    says: the width of the box whose area is asked for
    kind: picked
    by: worked by hand in the test's comment, twice 6+15+10
  - name: meshtree-more-area-length
    value: 3
    says: the length of the box whose area is asked for
    kind: picked
    by: worked by hand in the test's comment, twice 6+15+10
  - name: meshtree-more-area-height
    value: 5
    says: the height of the box whose area is asked for
    kind: picked
    by: worked by hand in the test's comment, twice 6+15+10
  - name: meshtree-more-area-surface
    value: 62
    says: the whole surface of the box 2 by 3 by 5
    kind: picked
    by: twice 6+15+10, worked by hand in the test's comment
  - name: meshtree-more-unbuilt-aim
    value: 0.1
    says: where over a mesh that was not built the questions are put, along x and along y
    kind: picked
    by: any point over the face will do; the question is refused before it is read
  - name: meshtree-more-far-out
    value: 1.0e200
    says: how far from a mesh of one face a point is put, so far that a distance squared is endless
    kind: picked
    by: worked by hand in the test's comment, its square is past what a double holds
  - name: meshtree-more-winding-cells
    value: 1
    says: how many squares each side of the cube for the winding test is cut into
    kind: picked
    by: the cube from -1 to 1 whole, as the test's comment works it
  - name: meshtree-more-plan-always-leaf
    value: 2
    says: the most faces that are always one leaf, wherever they lie
    kind: picked
    by: any two faces are a leaf, as the test's comment says
  - name: meshtree-more-plan-bins
    value: 16
    says: the bins the faces of a node fall into along the axis they spread furthest on
    kind: picked
    by: sixteen, as the comment of the brute force says
  - name: meshtree-more-plan-last-bin
    value: 15
    says: the number of the last of the sixteen bins, the one a face at the far end falls into
    kind: picked
    by: the bins are numbered from nought, so the last is one short of their count
  - name: meshtree-more-plan-tie-below
    value: 0.999999999
    says: one less a billionth, below which a leaf is not worth its cost and above which it is allowed
    kind: picked
    by: prices within a billionth of each other are taken as equal
  - name: meshtree-more-plan-tie-above
    value: 1.000000001
    says: one more a billionth, past which a cut is the cheaper and within which a tie is allowed
    kind: picked
    by: prices within a billionth of each other are taken as equal
  - name: meshtree-more-lump-faces
    value: 30
    says: how many small triangles each lump has
    kind: picked
    by: a lump is more than a leaf's worth of faces and few enough to stay small
  - name: meshtree-more-lump-spread
    value: 0.05
    says: how far from its middle the triangles of a lump are strewn
    kind: picked
    by: close, so each lump is a tight cluster
  - name: meshtree-more-lump-size
    value: 0.1
    says: about how big each triangle of a lump is
    kind: picked
    by: about as big as the lump is wide
  - name: meshtree-more-lump-reach
    value: 3
    says: how far from the origin the lumps are strewn, in the cube from minus this to this
    kind: picked
    by: far apart compared with the lumps
  - name: meshtree-more-brute-soup-faces
    value: 3000
    says: how many faces the soup has whose cuts brute force allows
    kind: picked
    by: enough faces for a deep tree
  - name: meshtree-more-brute-thin-faces
    value: 1500
    says: how many faces are strewn thinly
    kind: picked
    by: many small faces through a wide cube
  - name: meshtree-more-brute-thin-spread
    value: 1
    says: how far from the origin the thin faces are strewn
    kind: picked
    by: the cube from -1 to 1
  - name: meshtree-more-brute-thin-size
    value: 0.05
    says: about how big each thin face is
    kind: picked
    by: small beside the cube they are strewn through
  - name: meshtree-more-brute-thick-faces
    value: 400
    says: how many faces are strewn thickly
    kind: picked
    by: fewer, larger faces that overlap as they fall
  - name: meshtree-more-brute-thick-spread
    value: 0.2
    says: how far from the origin the thick faces are strewn
    kind: picked
    by: a small cube, so the faces overlap
  - name: meshtree-more-brute-thick-size
    value: 0.5
    says: about how big each thick face is
    kind: picked
    by: large beside the cube they are strewn through
  - name: meshtree-more-brute-lumps
