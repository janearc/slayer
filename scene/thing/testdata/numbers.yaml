# every number the scene/thing tests choose, with what it is and why it was
# chosen. a test asks for a number by its name. a name starts with the test
# file's stem, so that two files never share one.
numbers:
  - name: ranges-visible-short
    value: 360
    says: the first wavelength of the 1931 observer's table, in nanometres, where the visible starts
    kind: picked
    by: the first row of the observer's table
  - name: ranges-visible-long
    value: 830
    says: the last wavelength of the 1931 observer's table, in nanometres, where the visible ends and is no longer held
    kind: picked
    by: the last row of the observer's table
  - name: ranges-xray-nanometre
    value: 1
    says: a wavelength of one nanometre, which falls in the x-ray range and in no other
    kind: picked
    by: chosen for the test that asks for it
  - name: ranges-mark-visible
    value: 7
    says: a marker stored in a table under the visible, to tell it from the others
    kind: picked
    by: chosen for the test that asks for it
  - name: ranges-mark-xray
    value: 3
    says: a marker stored in a table under the x-ray, to tell it from the others
    kind: picked
    by: chosen for the test that asks for it
  - name: ranges-mark-gamma
    value: 4
    says: a marker stored in a table under gamma, to tell it from the others
    kind: picked
    by: chosen for the test that asks for it
  - name: ranges-mark-radio
    value: 5
    says: a marker stored in a table under radio, to tell it from the others
    kind: picked
    by: chosen for the test that asks for it
  - name: ranges-mark-ultraviolet
    value: 6
    says: a marker stored in a table under the ultraviolet, to tell it from the others
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-awk-tolerance
    value: 1e-9
    says: how near a reflectance may be to a figure worked to nine places by hand
    kind: picked
    by: nine places is how far the figures were worked
  - name: metal-grazing-tolerance
    value: 1e-12
    says: how near to all a conductor's share may be at grazing, where the equations give all to rounding
    kind: picked
    by: a few ulps of the arithmetic
  - name: metal-doc-tolerance
    value: 0.01
    says: how near a metal's face-on reflectance may be to the two-place figure its doc gives
    kind: picked
    by: the doc rounds to hundredths
  - name: metal-white-spread
    value: 0.01
    says: the widest gap between a white mirror's reddest and bluest share, or the least gap by which a colour exceeds it
    kind: picked
    by: a hundredth is what the eye sees as white for a mirror
  - name: metal-sweep-steps
    value: 100
    says: how many even steps a sweep of looks from face on to grazing is cut into
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-dielectric-steps
    value: 20
    says: how many even steps the sweep that compares a conductor of no k with a dielectric is cut into
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-dielectric-tolerance
    value: 1e-12
    says: how near the two forms of Fresnel's equations must agree for a clear surface
    kind: picked
    by: a few ulps of the arithmetic
  - name: metal-glass-index
    value: 1.5
    says: the refractive index of glass the package reads where none is given
    kind: picked
    by: the index a surface or film with none is read as having
  - name: metal-absorbing-k
    value: 2
    says: the k of a conductor that absorbs, well above nought
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-absorbing-margin
    value: 0.3
    says: how much more than glass a conductor of k 2 and glass's n reflects face on
    kind: picked
    by: worked by hand, the difference is about 0.37
  - name: metal-glass-face-on
    value: 0.04
    says: the share glass of index 1.5 reflects face on, ((1.5-1)/(1.5+1)) squared
    kind: picked
    by: worked by hand from the formula
  - name: metal-glass-face-on-tolerance
    value: 1e-15
    says: how near glass's reflectance face on must be to its worked figure
    kind: picked
    by: the arithmetic is one division and a square
  - name: metal-water-index
    value: 1.333
    says: the refractive index of water, from which light is looked at from inside
    kind: picked
    by: the index of water to three places
  - name: metal-critical-cosine
    value: 0.3
    says: a look from inside water that is past its critical angle, whose reflection is all
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-dark-index
    value: 1.7
    says: the index of a film that lets nothing through, and of one that is not glass
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-opaque-absorption
    value: 1e9
    says: the absorption per metre of a film that lets nothing through, in every colour
    kind: picked
    by: far past what any thickness can pass
  - name: metal-dark-thickness
    value: 25e-6
    says: the thickness in metres of the test films, a blanket's layer
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-film-tolerance
    value: 1e-12
    says: how near a film's reflectance must be to the figure it should give
    kind: picked
    by: a few ulps of the arithmetic
  - name: metal-grey-spread
    value: 0.06
    says: the widest gap between a grey metal's reddest and bluest share
    kind: picked
    by: titanium's gap is about 0.059
  - name: metal-colour-spread
    value: 0.5
    says: the least gap between a coloured metal's reddest and bluest share
    kind: picked
    by: gold's gap is about 0.53
  - name: metal-kapton-thickness
    value: 40e-6
    says: the thickness in metres of the Kapton film whose passes are worked by hand
    kind: picked
    by: the thickness the film's absorptions are quoted for
  - name: metal-kapton-index
    value: 1.7
    says: the refractive index of Kapton and of the amber film that is made like it
    kind: picked
    by: the index Kapton is given
  - name: metal-kapton-tolerance
    value: 1e-6
    says: how near a film's passes must be to the figures worked to six places by hand
    kind: picked
    by: six places is how far the figures were worked
  - name: metal-blanket-thickness
    value: 25e-6
    says: the thickness in metres of a spacecraft blanket's Kapton layer
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-rutile-thickness
    value: 5e-9
    says: the thickness in metres of the oxide the test asks Rutile for
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-rutile-index
    value: 2.65
    says: Devore's ordinary index for rutile at 549 nm
    kind: picked
    by: the index Rutile is given
  - name: metal-plain-grey
    value: 0.5
    says: the diffuse colour of a metal with no gloss, which it does not mirror
    kind: picked
    by: chosen for the test that asks for it
  - name: metal-negative-index
    value: -1
    says: an index below nought, which a film reads as glass's
    kind: picked
    by: chosen for the test that asks for it
  - name: keyed-bezier-tolerance
    value: 1e-9
    says: how near an eased share may be to the value worked by hand, for the forty halvings settle to about 1e-12
    kind: picked
    by: three places looser than the halvings settle
  - name: keyed-inside-share
    value: 0.3
    says: a share well inside a run, which no ease takes to either end
    kind: picked
    by: chosen for the test that asks for it
  - name: keyed-halving-step-exponent
    value: -41
    says: the power of two a half of the last halving's width is, where forty halvings of one leave 2 to the -40
    kind: picked
    by: worked from the forty halvings
  - name: keyed-halving-tolerance
    value: 1e-15
    says: how near the share at an exact meet may be to the first order step from the curve at a half
    kind: picked
    by: the next term is of the order of 2 to the -82
  - name: made-tolerance
    value: 1e-12
    says: how near a made look's reflectance must be to the standing constructor's
    kind: picked
    by: a few ulps of the arithmetic
  - name: construction-returned-share
    value: 0.25
    says: the share of x-rays a spectrum under test sends back
    kind: picked
    by: chosen for the test that asks for it
  - name: construction-gamma-nanometres
    value: 2e-4
    says: a wavelength in nanometres that falls in the gamma range
    kind: picked
    by: chosen for the test that asks for it
  - name: construction-xray-nanometres
    value: 0.5
    says: a wavelength in nanometres that falls in the x-ray range
    kind: picked
    by: chosen for the test that asks for it
  - name: ocean-wave-wind
    value: 8
    says: the wind in metres a second of the wave recipe under test
    kind: picked
    by: chosen for the test that asks for it
  - name: ocean-wave-samples
    value: 64
    says: the samples a side of the wave recipe under test
    kind: picked
    by: chosen for the test that asks for it
  - name: ocean-wave-amplitude
    value: 0.4
    says: the amplitude in metres of the wake under test
    kind: picked
    by: chosen for the test that asks for it
  - name: ocean-wave-length
    value: 30
    says: the length in metres of the wake under test
    kind: picked
    by: chosen for the test that asks for it
  - name: ocean-wave-changed
    value: 0
    says: the value a caller writes over a wake's numbers, which must differ from the recipe's
    kind: picked
    by: chosen for the test that asks for it
  - name: made-iron-density
    value: 7.87
    says: the density of iron in grams a cubic centimetre, for a material that has a formula and no optics
    kind: picked
    by: the density of iron to three places
  - name: orbit-worked-tolerance
    value: 1e-9
    says: how near two points or directions must be to count as the same, in the worked orbit tests
    kind: picked
    by: far finer than any value the worked orbit arithmetic is asked for, and far coarser than its rounding
  - name: orbit-worked-angle-tolerance
    value: 1e-12
    says: how near an orbit's angle must be to the angle worked by hand
    kind: picked
    by: angles are compared directly, with no steps between them to widen the rounding
  - name: orbit-worked-phase
    value: 0.5
    says: the phase in radians the angle tests start an orbit at
    kind: picked
    by: not zero and not a turn, so it shows up in the angle
  - name: orbit-worked-short-period
    value: 4
    says: the period in seconds of the orbits worked a quarter turn a second
    kind: picked
    by: a quarter of it is a whole second
  - name: orbit-worked-long-period
    value: 8
    says: the period in seconds of the orbits worked an eighth of a turn a second
    kind: picked
    by: an eighth of it is a whole second
  - name: orbit-worked-wide-radius
    value: 3
    says: the radius of the orbits worked at a radius of three
    kind: picked
    by: worked by hand, a radius no axis length or square root is mistaken for
  - name: orbit-worked-small-radius
    value: 2
    says: the radius of the tilted and locked orbits worked at a radius of two
    kind: picked
    by: worked by hand, so that the start of the tilted orbit is the square root of two
  - name: orbit-worked-tilt-steps
    value: 8
    says: how many whole seconds round the tilted orbit are checked to stay in its plane
    kind: picked
    by: the tilted orbit takes eight seconds to go round
  - name: orbit-worked-axis-along-x
    value: 0.9
    says: how far along x the axis is that is just under the point at which the first axis changes
    kind: picked
    by: worked by hand from the rule that the first axis changes past this
  - name: orbit-worked-axis-y
    value: 0.43588989435406733
    says: the y part of an axis of unit length that is 0.9 along x, the square root of 0.19
    kind: picked
    by: worked by hand, the float64 nearest the square root of 0.19
  - name: orbit-worked-parent-scale
    value: 2
    says: the scale of the parent in the nested and growing tests
    kind: picked
    by: worked by hand with a child scale of three
  - name: orbit-worked-child-scale
    value: 3
    says: the scale of the child in the nested tests
    kind: picked
    by: worked by hand with a parent scale of two
  - name: orbit-worked-nested-scale
    value: 6
    says: the scale of the child in the world, the parent's scale times the child's
    kind: picked
    by: worked by hand from the parent and child scales
  - name: orbit-worked-growth-rate
    value: 3
    says: how much a growing subspace's scale grows each second
    kind: picked
    by: worked by hand, so a quarter second is 0.75
  - name: orbit-worked-carried-seconds
    value: 3
    says: the whole seconds the carried growing subspace is asked at
    kind: picked
    by: the growth rate times two seconds of age is the scale worked by hand
  - name: orbit-worked-carried-scale
    value: 12
    says: the scale of a growing subspace carried by the parent, the parent's scale times the growth
    kind: picked
    by: worked by hand from the parent scale and the growth
  - name: axis-spin-tolerance
    value: 1e-12
    says: how near two points must be to count as the same in the axis spin tests
    kind: picked
    by: the points are one rotation from exact, so rounding is far finer
  - name: axis-spin-rpm
    value: 60
    says: the spin rate in revolutions a minute of the pivot test
    kind: picked
    by: sixty a minute is one a second, so a quarter second is a quarter turn
  - name: axis-spin-reverse-rpm
    value: -60
    says: the negative spin rate in revolutions a minute of the rest test
    kind: picked
    by: a negative rate on a quarter second cancels a phase of a quarter turn
  - name: axis-spin-parent-angle
    value: 0.4
    says: the angle in radians the test parent is turned about y
    kind: picked
    by: not a multiple of a quarter turn, so a wrong order of composing shows
  - name: axis-spin-parent-scale
    value: 2
    says: the scale of the test parent
    kind: picked
    by: not one, so a parent scale that is lost or doubled shows
  - name: axis-spin-rest-height
    value: 5
    says: the height of the parent of the rest test
    kind: picked
    by: worked by hand, the first axis then lands at six
  - name: axis-spin-moving-milliseconds
    value: 250
    says: the milliseconds into the motion at which the spins are asked
    kind: picked
    by: a quarter of a second, a quarter turn at sixty a minute
  - name: axis-spin-long-seconds
    value: 123
    says: the seconds into the motion at which the stopped spin is asked
    kind: picked
    by: far from zero and not a whole minute
  - name: attrs-motion-tolerance
    value: 1e-9
    says: how near a point in orbit must be to the point worked by hand
    kind: picked
    by: far finer than the orbit arithmetic is worked to
  - name: attrs-motion-still-scale
    value: 4
    says: the scale of the still subspace
    kind: picked
    by: not one, so a scale that is lost shows
  - name: attrs-motion-long-hours
    value: 1000
    says: the whole hours into the motion at which the still subspace is asked
    kind: picked
    by: far past any time the other tests ask
  - name: attrs-motion-orbit-radius
    value: 2
    says: the radius of the orbit that carries a thing, a volume and a field
    kind: picked
    by: worked by hand, so that one second on it is two out
  - name: attrs-motion-orbit-seconds
    value: 4
    says: the period in seconds of the orbit that carries a thing, a volume and a field
    kind: picked
    by: a quarter of it is a whole second
  - name: beam-doppler-jet-speed
    value: 0.6
    says: the speed, as a share of light's, of the jet the boost and flow tests ask about
    kind: picked
    by: worked by hand in the test's comment, where gamma is exactly 1.25
  - name: beam-doppler-tolerance
    value: 1e-12
    says: how close a boost or a flow speed must be to the worked value, as a share of it for a boost and in whole for a speed
    kind: picked
    by: far below any rounding in the few operations the worked values pass through
  - name: beam-doppler-huge-radius
    value: 1e300
    says: a slowing radius so large that the radius over a point a ten-billionth out is endless
    kind: picked
    by: chosen so that the slowing outside it has no number
  - name: beam-doppler-near-axis-offset
    value: 1e-10
    says: how far off the axis the point is that the no-speed test asks about, a ten-billionth
    kind: picked
    by: chosen to make the radius over it overflow
  - name: beam-doppler-unit-radius
    value: 1
    says: a slowing radius of one, outside which a round beam slows
    kind: picked
    by: chosen as the plain case in the tests that need a radius and not its value
  - name: beam-doppler-axis-point-up
    value: 5
    says: how far up the axis the still-gas tests ask, in metres of scene
    kind: picked
    by: chosen as a point well off the origin on the axis
  - name: beam-doppler-axis-point-down
    value: -2
    says: how far down the axis the still-gas tests ask, a negative height
    kind: picked
    by: chosen as a point below the origin on the axis
  - name: beam-doppler-round-beam-speed
    value: 0.8
    says: the speed of the round beam whose flow at sixteen out is 0.6 of light's
    kind: picked
    by: worked by hand in the test's comment, 0.8 times the square root of 9 over 16
  - name: beam-doppler-round-beam-radius
    value: 9
    says: the radius at which the round beam of the flow test begins to slow
    kind: picked
    by: worked by hand in the test's comment
  - name: beam-doppler-round-point-east
    value: 16
    says: how far east of the axis the round beam's boost is asked
    kind: picked
    by: worked by hand in the test's comment
  - name: beam-doppler-round-point-north
    value: 3
    says: how far up the axis the round beam's boost is asked, which does not change the flow
    kind: picked
    by: chosen to show that the height along the axis does not matter
  - name: beam-doppler-tipped-axis-length
    value: 3
    says: the length of the tipped axis, three units of x, longer than one unit
    kind: picked
    by: chosen to show that an axis is made one unit long
  - name: beam-doppler-tipped-point
    value: 2
    says: how far along the tipped axis, either way, the flow is asked
    kind: picked
    by: chosen as a point off the origin on the axis
  - name: beam-doppler-round-flow-speed
    value: 0.4
    says: the speed of the round beams whose flow goes round the axis or is still on it
    kind: picked
    by: chosen as a speed well below light's
  - name: audit-width
    value: 2
    says: the width in nanometres of the excited gas whose lines overlap at a band
    kind: picked
    by: chosen to take in the lines near the band
  - name: audit-band
    value: 502.5
    says: the wavelength in nanometres at which the overlapping lines are asked
    kind: picked
    by: chosen between two lines
  - name: audit-repeats
    value: 200
    says: how many times the gas is asked for one answer
    kind: picked
    by: chosen as enough asks to catch a map's changing order
  - name: audit-midway
    value: 501
    says: a wavelength in nanometres midway between the two lines of the tie
    kind: picked
    by: chosen as the midpoint of 500 and 502
  - name: audit-sun-mass
    value: 1.98847e30
    says: the mass of the sun in kilograms, for the orbit that is refused
    kind: picked
    by: a figure of the sun's mass to five places, for the thing to pin to a source
  - name: audit-astronomical-unit
    value: 1.495978707e11
    says: the astronomical unit in metres
    kind: picked
    by: the exact value of the astronomical unit, for the thing to pin to a source
  - name: audit-sedna-aphelion-au
    value: 506
    says: how far in astronomical units Sedna is round the sun, whose orbit is some 11,400 years
    kind: picked
    by: worked by hand in the test's comment
  - name: audit-over-gloss
    value: 2
    says: a gloss past one, which mirrors no more than a gloss of one
    kind: picked
    by: chosen as a whole number past one
  - name: audit-index
    value: 1.5
    says: the refractive index of the two surfaces compared
    kind: picked
    by: chosen as the index of ordinary glass
  - name: wake-foam-origin-east
    value: 12
    says: how far east the foam's origin is
    kind: picked
    by: chosen as a point inside the patch the tests scan
  - name: wake-foam-half-width
    value: 5
    says: the half width of the foam's wake
    kind: picked
    by: chosen as a width a few cells across
  - name: wake-foam-length
    value: 24
    says: the length of the foam's wake
    kind: picked
    by: chosen as a length of several wavelengths
  - name: wake-foam-wavelength
    value: 9.6
    says: the wavelength of the foam's pattern, shorter than its length
    kind: picked
    by: chosen as 0.4 of the length
  - name: wake-foam-reflectance
    value: 0.9
    says: the grey reflectance of the foam
    kind: picked
    by: chosen as a bright foam
  - name: wake-foam-satin
    value: 0.8
    says: the satin of the foam
    kind: picked
    by: chosen as a satin between none and one
  - name: wake-foam-coverage
    value: 0.5
    says: the coverage the foam is authored at, and the bound the coverage test holds it to
    kind: picked
