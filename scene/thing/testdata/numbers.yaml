    by: any cosine past one would do
  - name: mirrors-schlick-cosine-below-zero
    value: -0.5
    says: a cosine below zero, which is held to grazing
    kind: picked
    by: any cosine below zero would do
  - name: mirrors-schlick-anywhere-x
    value: 3
    says: the x of a point at which a surface with no texture is asked its roughness
    kind: picked
    by: any point would do, and this one is away from the world's zero
  - name: mirrors-schlick-anywhere-y
    value: 4
    says: the y of a point at which a surface with no texture is asked its roughness
    kind: picked
    by: any point would do, and this one is away from the world's zero
