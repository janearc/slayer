# The numbers the package's tests choose, read by name: inputs, tolerances and
# values worked by hand. Each row's name starts with the stem of the test file
# that asks for it.
numbers:
  - name: fixtures-loader-probe
    value: 1
    says: a number the fixture loader's own check reads, so the file is never empty
    kind: picked
    by: chosen for the loader's check
  - name: mutants-span-tolerance
    value: 1e-9
    says: how close a span's ends are held to the ends worked by hand
    kind: picked
    by: a billionth, far below any span the cases work out
  - name: mutants-span-hair-side
    value: 1e-6
    says: the sideways part of a direction a hair off the cylinder's axis
    kind: picked
    by: chosen so its square, 1e-12, is the bound a ray along the axis is taken under
  - name: mutants-span-hair-radius
    value: 1e-4
    says: the radius of the cylinder the hair-off ray crosses
    kind: picked
    by: worked by hand with the hair, so the ray leaves at 100
  - name: mutants-span-hair-far
    value: 1000
    says: where the range of the hair-off ray ends
    kind: picked
    by: well past the 100 where the ray leaves
  - name: mutants-span-hair-leave
    value: 100
    says: where the hair-off ray leaves the cylinder
    kind: picked
    by: worked by hand as the radius over the sideways part
  - name: mutants-span-disc-inner
    value: 2
    says: the inner radius of the disc the span cases cut
    kind: picked
    by: chosen for the test that asks for it
  - name: mutants-span-disc-outer
    value: 6
    says: the outer radius of the disc the span cases cut
    kind: picked
    by: chosen so a ray at 6 is on the wall and one at 8 is outside
  - name: mutants-span-disc-thick
    value: 0.4
    says: the thickness of the disc the span cases cut
    kind: picked
    by: chosen so the planes are at 0.2 above and below
  - name: shell-weather-tolerance-density
    value: 1e-12
    says: how close the density across a shell is held to the parabola
    kind: picked
    by: far below the quarter-step the cases work out
  - name: shell-weather-tolerance-spans
    value: 1e-9
    says: how close the ends of a shell's spans are held to those worked by hand
    kind: picked
    by: a billionth, far below any span the cases work out
  - name: shell-weather-mid-shell
    value: 120
    says: the height above the centre of the middle of the shell
    kind: picked
    by: the radius, 100, and half of the 10 to 30 the weather fills
  - name: shell-weather-tick-milliseconds
    value: 1500
    says: the time a shell is ticked by, in milliseconds
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-tick-seconds
    value: 1.5
    says: the seconds the shell reads after the tick
    kind: picked
    by: worked by hand from the 1500 milliseconds
  - name: shell-weather-patches-tick-seconds
    value: 2
    says: the seconds the patchy shell is ticked by to see its patches move
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-patches-sweep-start
    value: -40.0
    says: where the line of points the patches are read along begins in x
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-patches-sweep-end
    value: 40
    says: where the line of points the patches are read along ends in x
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-patches-sweep-step
    value: 2.5
    says: the gap between points on the line the patches are read along
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-spans-far
    value: 1000
    says: where the range the shell's spans are cut to ends
    kind: picked
    by: past every end the cases work out
  - name: shell-weather-fizz-radius
    value: 0.2
    says: the radius of the whole fizz
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-fizz-height
    value: 1
    says: the height of the whole fizz
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-fizz-thick
    value: 2
    says: the thickness of the whole fizz
    kind: picked
    by: chosen for the test that asks for it
  - name: shell-weather-fizz-reach
    value: 0.4
    says: how far the fizz's box reaches either side in x and z
    kind: picked
    by: worked by hand as twice the radius
  - name: shell-weather-fizz-middle
    value: 0.1
    says: the height of the point at the fizz's own middle
    kind: picked
    by: chosen to be inside the whole fizz
