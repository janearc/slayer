# picked-numbers.yml: every number ninjafilm's code and tests use that
# someone chose, with who and when. the code asks for them by name
# through data.Picked and data.Whole. numbers true by definition stay in
# the code, and the comment beside each says it is defined.

numbers:
  - name: simpson-slices
    value: 16
    says: how many pieces Exitance cuts a stretch of wavelengths into for Simpson's rule; even, as the rule needs, and enough that one band of libtheme's comes out within a millionth of the exact integral
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23, carried over from maths/planck.go where it was written as a constant with this reason"

  - name: hash-step-least
    value: 1
    says: the smallest step a property moves a part of a site by, so that the moved site is another site
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: hash-step-most
    value: 1099511627776
    says: the largest step a property moves a part of a site by, 2 to the 40, far from the edge of what a part holds
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: hash-avalanche-least
    value: 24.5
    says: the fewest bits of 53 that one flipped input bit may change on average; half is 26.5, and the mean of 256 flips stays within two of it
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: hash-avalanche-most
    value: 28.5
    says: the most bits of 53 that one flipped input bit may change on average, as far above half as the least is below
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: hash-bins
    value: 8
    says: how many equal bins the unit interval is cut into to see whether hashes fall evenly
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: hash-side
    value: 64
    says: how many sites a side of the square has that is hashed to see whether hashes fall evenly
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: hash-chi-limit
    value: 40
    says: the chi squared, for 7 degrees of freedom, that even hashes pass about once in ten million, so that only an uneven hash fails
    kind: picked
    by: "the ninjafilm bar pass, 2026-10-23"

  - name: shelf-stocks-least
