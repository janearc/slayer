# a film of a set: ten seconds of the moon rising at 24 frames a second,
# through the plain print, written as frames and as a movie. the set
# films through its lens rig, whose shutter and glimpses are the film's:
# a job says no shutter beside a rig, since the rig's open time sets the
# exposure. the 720 preset is 16 by 9, the rig frame's own shape.
$schema: https://github.com/janearc/slayer/schemas/job-v1.json
scene: {set: ../sets/moonlake.yaml}
film: {preset: "720"}
fps: 24
duration: {value: 10, unit: s}
start: {value: 0, unit: s}
# the moon's 23 stops, as improv/moonlake/render.sh develops the set's
# raw: the rig's light is joules a square metre, far under white.
print: {knee: 0.7, top: 8, stops: 23}
outputs:
  frames: ../renders/moonlake-film
  movie: ../renders/moonlake-film.mp4
  note: the lake, a ten-second film through the set's lens rig
limits:
  memory: {value: 16, unit: GiB}
