# A rendered half-portrait PRIMA study; not an orbit or flight simulation.
"$schema": https://github.com/janearc/slayer/schemas/job-v1.json
scene: {set: ../sets/prima-spacecraft.yaml}
renderer: gpu-native
film: {width: 1080, height: 960, rays: 4, wide: 28, exposure: 0.01}
camera: {name: concept}
outputs: {picture: ../out/prima-spacecraft-half-portrait.png}
