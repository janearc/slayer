# a portrait short of the night fire: ten seconds of the front from twenty
# seconds in, framed by its angle down a phone's tall picture, developed
# through lantern pushed three stops (a night scene is too dark at the
# stock's own rating), with a title for the first two seconds and sunrun
# under it all.
$schema: https://github.com/janearc/slayer/schemas/job-v1.json
scene: {set: ../doc/fire-night.yaml}
film: {preset: portrait, rays: 1, tall: 60}
fps: 24
duration: {value: 10, unit: s}
start: {value: 20, unit: s}
stock: {name: lantern, rated: 3}
titles:
  # sixteen rows to the picture: large type, for a phone
  rows: 16
  elements:
    title:
      kind: text
      words: fire at night
      ink: ink
      across: 0.5
      down: 0.12
      align: centre
      until: {value: 2, unit: s}
# sunrun loops, so a film longer than its twenty seconds hears it again.
sound: {tune: ../cheeptune/examples/sunrun.json, voicing: "@leap-dmg"}
# bare names: under a renders home (SLAYER_RENDERS) these go in a dated
# folder of their own, the frames and the movie side by side.
outputs:
  frames: short-fire-night
  movie: short-fire-night.mp4
