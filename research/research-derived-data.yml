# research-derived-data.yml: every number slayer takes from a published
# source, read from that source and never typed from memory (ruled
# 2026-10-18). each names its source by its key in sources.yaml,
# where in it, the page as the file counts pages, and the text printed
# there. sources verify holds every entry to its pinned source before a
# build: the source on the shelf at its hash, the text on its page, and
# the value the text says.

# Puzzlemouth's measured kind means read from a published source. It includes
# fitted model coefficients and botanical descriptions, not only experiments.
# Verification holds bytes and quoted numeric text. Roles, powers and units
# also need review and the independent model/metadata checks in the tests.
