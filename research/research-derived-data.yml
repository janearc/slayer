  # magnetars, read 2026-11-12 for the real one beside zappy. a field or
  # an energy printed with its power of ten is held as its printed
  # mantissa, the unit naming the power, which the scene applies. what
  # is computed from these (shells, distances, ratios) is in scene/named.
  - name: magnetar-radius-low-km
    value: 10
    unit: km
    says: lower end of the neutron-star radius the review takes; the spin-inferred fields assume this end
    kind: measured
    source:
      key: kaspi-beloborodov-2017-magnetars
      where: section 5.2, surface temperature, "a neutron star of radius R = 10 - 13 km"
      page: 23
      text: "10"
      excerpt: "R ≈ 10 − 13 km"
  - name: magnetar-radius-high-km
    value: 13
