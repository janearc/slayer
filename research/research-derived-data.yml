  # Section 2 defines diffusivity in m^2/s. The extra K^-3 in section
  # 7.1 conflicts with equation (1) and is not applied here.
  - name: fuel-diffusion-mantissa
    value: 2.136
    unit: mantissa
    says: printed mantissa of the section 7.1 diffusion coefficient, with its power applied by the model
    kind: measured
    source:
      key: mandel-2008-surface-fire
      where: section 7.1, final calibrated coefficients; proxy for grass, not redwood fuel
      page: 24
      text: "2.1360"
  - name: fuel-heating-mantissa
    value: 1.8793
    unit: mantissa
    says: printed mantissa of the section 7.1 heating coefficient, with its power applied by the model
    kind: measured
    source:
      key: mandel-2008-surface-fire
      where: section 7.1, final calibrated coefficients; proxy for grass, not redwood fuel
      page: 24
      text: "1.8793"
  # The final section 7.1 list gives B with 10^2. Its opening paragraph
  # prints 10^4; the model uses the final calibrated list. The mantissa
  # alone cannot distinguish these two occurrences.
  - name: fuel-activation-mantissa
    value: 5.5849
    unit: mantissa
    says: printed mantissa of the section 7.1 activation coefficient, with its power applied by the model
    kind: measured
    source:
      key: mandel-2008-surface-fire
      where: section 7.1, final calibrated coefficients; proxy for grass, not redwood fuel
      page: 24
      text: "5.5849"
  - name: fuel-cooling-mantissa
    value: 4.8372
    unit: mantissa
    says: printed mantissa of the section 7.1 cooling coefficient, with its power applied by the model
    kind: measured
    source:
      key: mandel-2008-surface-fire
      where: section 7.1, final calibrated coefficients; proxy for grass, not redwood fuel
      page: 24
      text: "4.8372"
  - name: fuel-consumption-mantissa
    value: 1.625
    unit: mantissa
    says: printed mantissa of the section 7.1 consumption coefficient, with its power applied by the model
    kind: measured
    source:
      key: mandel-2008-surface-fire
      where: section 7.1, final calibrated coefficients; proxy for grass, not redwood fuel
      page: 24
      text: "1.6250"
