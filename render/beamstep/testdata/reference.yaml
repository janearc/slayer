  at: {x: 10, y: 0, z: 0}
  toward: {x: 0, y: 1, z: 0}
  strength: {r: 1, g: 1, b: 1}
merged-ray: {at: {x: -2, y: 5, z: 0}, dir: {x: 1, y: 0, z: 0}}
