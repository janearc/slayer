# portofino: the harbour, and the painted houses on the slopes round it.
#
# waves proof (c), the quay: this set with an ocean added, the sea with no
# edge at the terrain's sea level of 0.5 m, a 4 m/s breeze from the
# north-east over a 5 km fetch (picked, as in the drawn portofino's own
# ocean block), and pure seawater.
#
# the ground. copernicus glo-30, tile n44 e009 (1 arc-second, posts about
# 22 m east to west and 31 m north to south here), a surface model: it
# holds the tops of what stands there, roofs and trees, and not the bare
# earth, and it holds the sea at nought. the window is 1400 m across and
# 1200 m down, round 44.3022 north, 9.2118 east, at a 5 m step, bilinear
# between the posts and not smoothed: a 20 m smoothing takes half the
# harbour's water away (22000 square metres of water in the harbour's box,
# 11000 smoothed). the window is placed round the harbour the heights
# show: where they fall to nought and the water is, which sides of it the
# ground climbs, and how steeply, were read first (the report that goes
# with this set prints them).
#
# what the heights say. the water of the harbour is a basin about 260 m
# across, east to west, and 100 m from its head to its mouth, its head at
# 605 m north in the window and its mouth, between a low tongue of land on
# the north and the east headland, at about 725 m north, open to the
# north-east. the ground is 0 to 3 m over a strip along the head, climbs
# to 10 m within 35 to 55 m of the water on the west, and to 40 m within
# about 100 m on the east. over the slopes that fall toward the water the
# rise is 0.4 to 0.5 in a metre on average, and 0.78 at the steepest, on
# the east side of the head. the sea is nought lifted to 0.5 m so the
# model's nought water is not drawn in one plane with the sea.
#
# the sea is the terrain's own `sea`: still water as the earth's curve,
# out to the horizon. the model has no depth under the water, so nothing
# is under it, and the sea has no wave: a harbour is sheltered, but the
# open sea outside is not, and this one is as flat there.
#
# the sun. scene/daylight.Sun, noaa's fractional-year equations, for
# 44.3022 north, 9.2118 east, at 07:30 local summer time (utc+2) on 21
# june 2026: azimuth 73.64, altitude 17.09, geometric, without refraction.
# the sky and the air are the earth's, worked from that. the day and the
# hour are a choice: the sun, low in the east-north-east, lights the
# faces that look east and, grazing, those that look north.
#
# the houses. the kind terrace-portofino, from
# manufacture/cities/cultures/portofino.yaml: fourteen bays to a terrace,
# each bay its own number of storeys, and its colour drawn from that
# culture's palette of red, ochre, yellow, pink and cream, so that no
# bay has the colour of the one beside it. no house is coloured here.
# four stands of the habit `contour` lay rows along the contours of the
# slopes that face the harbour: the south, which is the head, fronts to
# the north; the east flank, fronts to the west; the west flank, fronts
# to the east; and the north ledge, fronts to the south. each stand's
# first row starts at "the foot" of its stand, which is the back corner
# of its first terrace, and is a place picked from the heights (the front
# wall of the first row a few metres from the water's edge). each run is
# turned to the ground's contour where it stands, and each bay is founded
# on the ground under it.
#
# the quay. one box along the head, set where the model's shore is. a box
# is straight, upright and has no heading, so a quay of boxes is only as
# straight as the shore it lies on; the head runs east to west and is the
# one shore of the harbour that does.
#
# the boats. sampan-at-anchor, fishing-boat-at-anchor and ferry-at-anchor
# are the manufactory's, and are not Ligurian boats. they are at anchor,
# bows into a wind from the north-north-east, the same heading for all,
# a choice. a boat stands at the sea's height, 0.5 m.
#
# places of things are metres in the terrain window: east from its west
# edge, north from its south edge. a camera's at and look_at are east from
# the west edge, north as the window's northing less its 1200 m depth, and
# up from the lowest ground in the window, the water's nought.
