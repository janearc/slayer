# the neon street, nine blocks: the one block of sets/neon-street.yaml laid
# three wide and three deep, the viewer in the middle one. each block has
# the same plan as the first (shops, four towers, a lashed street of
# lanterns, the wet road) and is made again from seeds of its own, with the
# four tower recipes taken in a different turn, so no two blocks are the
# same buildings. the middle block keeps the first set's seeds. blocks stand
# 96 m apart east to west and 236 m north to south, which leaves a 12 m
# street between them; those two figures, the seeds and the turn of the
# recipes are picked. the plan of a block is repeated, not generated.
#
# places are metres, as a map's run: x east, y north, z up. the street runs
# north, twelve metres from wall to wall, its walls at x of six either
# side. from the south: the shops, from y of -124 to -78; the towers, from
# -76 to 0; the lashed street, from 4 to 100. every number is a choice of
# this study, picked. the first camera is the one drawn; to draw another,
# put it first.
