# a street of brick, lived in badly: a condominium of brick, at the demo
# detail level, with moss, rust, rain, soot, cracked and flaked brick,
# graffiti and boarded windows laid over it by the world's weathering.
# the buildings say nothing of any of it. the steel is a world half
# beam, an awning over a way in, and the rust runs from it down the brick
# below.
#
# places are metres, as a map's run: x east, y north, z up. the court is
# centred on the origin. every number is a choice of this study, picked by
# eye, and says so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: weathering street
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 16
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    street:
      title: "across the court, at eye height, to the north block's front"
      wide: 60
      location:
        at: [0, -9, 2.2]
      orientation:
        look_at: [0, 13, 5]
  set:
