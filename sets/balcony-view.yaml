# balcony view: the view from a residential balcony about two thirds of
# the way up a tower, standing at the planter wall at eye height, looking
# out over a generated city at dusk going into night. In the foreground
# the balcony: the planter wall, shrubs and a tree to the right, a chair,
# the next balcony along. In the middle three neighbouring towers whose
# skins show (mirror glass, granite, a planted one), and two condominiums
# below. Beyond, a lattice of towers drawn by irregularity, and past them a
# farther one at the hull, thinning to the horizon.
#
# the tower the camera stands on is the seed 5, forty storeys, concrete,
# planted, homes: its storeys are 3.8825 m, so the balcony of the
# twenty fifth storey has its floor at 93.58 m and the eye is 1.7 m over.
#
# places are metres, as a map's run: x east, y north, z up. the tower's
# south face is at y = -18.76. the neighbours' places, the sun, the sky,
# the ground and the camera are choices of this study, picked by eye. the
# levels by distance are the rings of stands: no leveller yet, so the
# near ring is quick and the far one hull, which has no windows.
