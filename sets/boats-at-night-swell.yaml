# the bay at night of sets/boats-at-night.yaml, with a swell on the water so
# that the boats' lamps lay streaks on it. in that set the bay is the ground's
# own `sea`, a flat mirror at nought: it shows a lamp as a point where its
# reflection falls and as nothing else, and the bay reads black. here the
# ground has no `sea`, and the water over the boats is `world.ocean`, which
# says no extent and no samples and so is the sea with no edge, meeting the
# ground wherever the ground is under it. the ocean's
# middle is at up 0, which is the sea's height for the stands too: a stand
# of a floating kind takes its sea from the ground's `sea` or, where it has
# none, from the middle of `world.ocean`, and puts a boat where the ground is
# under it by three metres or more.
#
# the sea: every input is chosen, none from a shelf source: a wind of 7 m/s,
# a fetch of 50 km, deep water (depth 0), waves going toward the east, seed 7,
# time 0. there is no `direct-sun`: that mode wants the one aired sun lamp,
# and this set has `light: none` and the boats' own lamps.
#
# the ocean draws on the CPU only.
#
# places are metres in the terrain's window, east 0 to 3900 from its west
# edge and north 0 to 2900 from its south edge, as in the other night set.
# every figure of the lamps and the boats is in manufacture/boats.yaml,
# recalled or picked.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: a bay at night with a swell, a dozen boats and an alfa
  light: none
  location:
    lat: 37.8025
    lon: -122.4255
  terrain:
