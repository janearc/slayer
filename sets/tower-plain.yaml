# tower plain: a derived block at no irregularity, at dusk into night:
# a rectangle in plan, one segment, mechanical bands of louvres, a crown
# and red beacons, its windows lit at random in warm and cool colours.
# made by the cities package (manufacture/cities), through the manufactory's
# kind tower, from manufacture/cities/cultures/tower.yaml. nothing about
# the building is picked here but its seed and its irregularity, nought.
#
# places are metres, as a map's run: x east, y north, z up. the ground,
# the sun and the cameras are choices of this study, picked by eye, and
# say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower plain
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 40
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # whole, from 750 m off to the south, at eye height
    far:
      title: "the whole tower, from a distance"
      location:
        at: [0, -600, 2]
      orientation:
        look_at: [0, 0, 95]
    # at the foot, looking up its face
    base:
      title: "from the foot, looking up"
      location:
        at: [30, -60, 1.7]
      orientation:
        look_at: [0, 0, 110]
  recipes:
    block:
      kind: tower
      irregularity: 0
  set:
    things:
      tower:
        recipe: block
        seed: 1
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
  world:
    unit: 1
    materials:
      paving:
        colour: {srgb_linear: [0.04, 0.04, 0.045]}
        source: eye
    boxes:
      ground:
        material: paving
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
    suns:
      west:
        toward: [-0.9, -0.3, 0.02]
        colour: {srgb_linear: [0.9, 0.4, 0.22]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.08, 0.05, 0.06]}
      zenith: {srgb_linear: [0.004, 0.008, 0.025]}
      ground: {srgb_linear: [0.01, 0.01, 0.012]}
      source: eye
