# a contact sheet of eight frontages, one unit of a kind each, from eight
# seeds, square-on, in two columns and four rows. made by the kind
# frontage-one (manufacture/retail.go) from manufacture/retail-units.yaml.
# a thing's seed is placement.Seed(scene seed, thing seed), scene seed 1,
# and manufacture.FrontageOne of it says which kind it is: 5 ramen, 4
# dive, 13 izakaya, 14 konbini, 54 pharmacy, 52 arcade, 11 vending, 10
# shuttered. the pavement under the lowest row, the heights of the upper
# rows, which hang in the air, and the camera are choices of this study,
# picked by eye. lit only by the units' own lamps.
#
# places are metres, x east, y north, z up; each frontage's left end is
# its place and it faces south, at the camera.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: retail-sheet-a
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 62
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    sheet:
      title: "eight frontages square-on"
      location:
        at: [14, -34, 10.75]
      orientation:
        look_at: [14, 0, 10.75]
  set:
    things:
      ramen: {kind: frontage-one, seed: 5, complexity: demo, east: 3.4, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
      dive: {kind: frontage-one, seed: 4, complexity: demo, east: 17.4, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
      izakaya: {kind: frontage-one, seed: 13, complexity: demo, east: 1.6, north: 0, height: {value: 6, unit: m}, heading: {value: 0, unit: deg}}
      konbini: {kind: frontage-one, seed: 14, complexity: demo, east: 15.6, north: 0, height: {value: 6, unit: m}, heading: {value: 0, unit: deg}}
      pharmacy: {kind: frontage-one, seed: 54, complexity: demo, east: 1.6, north: 0, height: {value: 12, unit: m}, heading: {value: 0, unit: deg}}
      arcade: {kind: frontage-one, seed: 52, complexity: demo, east: 15.6, north: 0, height: {value: 12, unit: m}, heading: {value: 0, unit: deg}}
      vending: {kind: frontage-one, seed: 11, complexity: demo, east: 3.4, north: 0, height: {value: 18, unit: m}, heading: {value: 0, unit: deg}}
      shuttered: {kind: frontage-one, seed: 10, complexity: demo, east: 17.4, north: 0, height: {value: 18, unit: m}, heading: {value: 0, unit: deg}}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.035, 0.035, 0.04]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [20, 0, -1.01]
        size: [200, 200, 2]
        source: eye
