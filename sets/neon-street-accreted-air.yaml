# the neon street among accreted superblocks, with the damp night air of
# sets/neon-street-nine-air.yaml over it. the rest is
# sets/neon-street-accreted.yaml: the one block of
# sets/neon-street.yaml (shops, four towers, a lashed street of lanterns,
# the wet road) with eight superblocks built close around it, each of the
# accreted habit and each from a seed of its own. two stand on each side of
# the street's block and two across each end of it, so the street runs on
# north and south between them. the lanes between parcels are twelve metres,
# and six behind the towers. the whole is 348 m east to west and 408 m
# north to south.
#
# the superblocks hold the people of sets/superblock-accreted.yaml for
# their ground, 3400 on 120 m by 80 m. their accretions run from 0.7 to 1.
# the parcels, the lanes, the seeds and the accretions are picked.
#
# places are metres, as a map's run: x east, y north, z up. the street runs
# north, twelve metres from wall to wall, its walls at x of six either
# side. the first camera is the one drawn; to draw another, name it.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  volume-illumination: {model: isotropic-single, sky-samples: 2}
  weather:
    night haze:
      kind: prescribed-mist
      extinction: {value: 0.0039, unit: m^-1}
      depth: {value: 300, unit: m}
      coverage: 1
      seed: 1
      asymmetry: 0.7
  atmosphere:
    layers:
      night air:
        weather: night haze
        extent: world
        albedo: 0.9
  name: neon street, accreted, night air
  # the seed slayer draws with when a set names none, said so that the
  # working display, which wants it said, makes the things the render does
  seed: 1
  setting: space
  light: none
  film:
    width: 960
    height: 640
    rays: 2
    wide: 70
    exposure: 4
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    down-the-street:
      title: "at eye height at the south end of the street's block, looking north down its street"
      location:
        at: [1.2, -118, 1.7]
      orientation:
        look_at: [0, 40, 16]
    overhead:
      title: "from straight above the middle of the set"
      wide: 60
      location:
        at: [0, -13, 620]
      orientation:
        look_at: [0, -12, 0]
    above:
      title: "from above and south of the whole set"
      wide: 60
      location:
        at: [0, -560, 360]
      orientation:
        look_at: [0, -12, 10]
    over-the-roofs:
      title: "above the roofs south of the street's block, looking north"
      wide: 81.2
      location:
        at: [0.19, -378.55, 136.82]
      orientation:
        look_at: [-6.32, -161.78, 102.61]
  recipes:
    cyber: {kind: tower, irregularity: 0, pins: {plan: rectangle, retail: true, skin: curtain, cyber: true, storeys: 22, width: {value: 36, unit: m}, taper: false, twist: false, setbacks: false, spire: false}}
    gothic: {kind: tower, irregularity: 0, pins: {plan: rectangle, retail: true, skin: gothic, signs: true, gargoyles: true, storeys: 18, segments: 3, width: {value: 36, unit: m}, taper: false, twist: false, setbacks: true, spire: false}}
    concrete: {kind: tower, irregularity: 0, pins: {plan: rectangle, retail: true, skin: concrete, signs: true, storeys: 16, width: {value: 36, unit: m}, taper: false, twist: false, setbacks: false, spire: false}}
    mirror: {kind: tower, irregularity: 0, pins: {plan: rectangle, retail: true, skin: mirror, signs: true, storeys: 26, width: {value: 36, unit: m}, taper: false, twist: false, setbacks: false, spire: false}}
