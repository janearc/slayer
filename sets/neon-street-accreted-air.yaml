      block north west: {kind: superblock, habit: accreted, seed: 35, complexity: quick, parcel: {width: {value: 168, unit: m}, depth: {value: 80, unit: m}}, ceiling: 14, occupants: 4760, crowding: 1, accretion: 1, parts: {winnebago: 1}, east: -90, north: 152, height: {value: 0, unit: m}}
      block north east: {kind: superblock, habit: accreted, seed: 36, complexity: quick, parcel: {width: {value: 168, unit: m}, depth: {value: 80, unit: m}}, ceiling: 14, occupants: 4760, crowding: 1, accretion: 0.7, parts: {winnebago: 1}, east: 90, north: 152, height: {value: 0, unit: m}}
      block south west: {kind: superblock, habit: accreted, seed: 37, complexity: quick, parcel: {width: {value: 168, unit: m}, depth: {value: 80, unit: m}}, ceiling: 14, occupants: 4760, crowding: 1, accretion: 0.8, parts: {winnebago: 1}, east: -90, north: -176, height: {value: 0, unit: m}}
