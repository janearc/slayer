      road far south: {recipe: wet, seed: 14, complexity: quick, east: 0, north: -180, height: {value: 0, unit: m}}
      road far north: {recipe: wet, seed: 15, complexity: quick, east: 0, north: 170, height: {value: 0, unit: m}}
