# midwest, up close, at the demo detail level: a row of timber-lap and
# vinyl houses with their garages and yards, seen from the street, drawn
# part by part as the portofino detail is, from the same decomposition.
# made by the cities package, through the manufactory's kind
# terrace-midwest.
#
# places are metres, as a map's run: x east, y north, z up. the row runs
# east from the origin with its front to the south. the sun, the colours
# and the cameras are choices of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: midwest detail
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 16
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "windows and a garage door up close"
      location:
        at: [20, -16, 2.5]
      orientation:
        look_at: [20, 0, 2.5]
    street:
      title: "along the street, at eye height"
      location:
        at: [-8, -22, 2]
      orientation:
        look_at: [30, 0, 3]
  set:
    things:
      row:
        kind: terrace-midwest
        seed: 1
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      lawn:
        colour: {srgb_linear: [0.05, 0.1, 0.03]}
        source: eye
    boxes:
      ground:
        material: lawn
        middle: [0, 0, -1]
        size: [3000, 3000, 2]
        source: eye
    suns:
      west:
        toward: [-0.7, -0.6, 0.3]
        colour: {srgb_linear: [2.2, 1.6, 1.0]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.25, 0.2, 0.17]}
      zenith: {srgb_linear: [0.03, 0.05, 0.1]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
