# the neon street as one hundred and forty-four towers, no two the same:
# nine rows of sixteen, laid to fill a frame sixteen wide by nine high seen
# from above. each tower stands on a lot of 36 m with a wet street of 12 m
# on every side, so the alleys run 756 m east to west and 420 m north to
# south. each tower has a plan, skin and window style no other has, a
# height of its own from 14 to 60 storeys, an irregularity of its own from
# 0.2 to 1, and a seed of its own; taper, twist, setbacks, spire, crown,
# gargoyles, planting and the cyber roof are left to the tower's own draw.
# every tower keeps shops in its foot and signs. which lot a tower stands
# on, the heights, the irregularities and the seeds are picked. the
# overhead camera is low enough that the edge towers run out of the frame.
#
# places are metres, as a map's run: x east, y north, z up. the first
# camera is the one drawn; to draw another, name it.
