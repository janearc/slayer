# the signs detail study, sheet two, roof signs: eight roof signs from eight
# seeds, 21 to 28, in two rows of four, seen square-on: each its own make,
# frame, trade, words, size, number of lines, font and colour, from
# manufacture/cities/signdraw.go, drawn from manufacture/cities/cultures/
# sign.yaml. each thing is given a heading, or the hillside turns it by its
# seed.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the signs' own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the rows' places, the street, the lamp and the camera are choices of
# this study.
