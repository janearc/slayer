# a probe of the light, under water: the grey card of
# sets/kelp-probe-air.yaml twelve metres down, the same sun, sky and
# exposure, the water of sets/kelp-forest.yaml between. the camera is
# 0.3 m over the card, so the water between the card and the lens takes
# next to nothing; the card's linear value over the air card's is the share
# of the surface's light that reaches the floor, by channel (red, green,
# blue). no kelp.
# places are metres, x east, y north, z up, mean sea at z=0.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: kelp probe under water
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 200, altitude: 60}
  film:
    width: 64
    height: 36
    rays: 4
    exposure: 214.7
    wide: 20
  world:
    unit: 1
    materials:
      seawater:
        colour: {srgb_linear: [0, 0, 0]}
        clear:
          through: 1
          index: 1.333
          gloss: 1
          rank: 0
          extinction-per-metre: [0.2778, 0.0713, 0.0277]
          scatter:
            coefficient-per-metre: [0.01338, 0.01484, 0.01755]
            phase-g: 0
            steps: 32
            max-distance: {value: 40, unit: m}
        source: "pure water absorption, Pope and Fry 1997; particle scattering, Morel and Maritorena 2001 Case 1 model at a picked 0.5 mg/m3 chlorophyll, counted as loss by its share turned away, one minus the Petzold mean cosine 0.924; see sets/kelp-forest.yaml"
      card:
        colour: {srgb_linear: [0.18, 0.18, 0.18]}
        source: eye
    ocean:
      material: seawater
      middle: [0, 0, 0]
      extent: {value: 512, unit: m}
      samples: 257
      sea:
        wind: {value: 0.5, unit: m/s}
        fetch: {value: 50000, unit: m}
        depth: {value: 0, unit: m}
        toward: {value: 0, unit: rad}
      seed: 11
      time: {value: 0, unit: s}
      source: "picked: a light breeze, no shelf source"
      flat-mean:
        mean-level: {value: 0, unit: m}
        collar-width: {value: 64, unit: m}
        extends-to-infinity: true
      direct-sun: mean-plane
    boxes:
      floor:
        material: card
        middle: [0, 0, -12.05]
        size: [400, 400, 0.1]
        source: eye
  cameras:
    down:
      title: "down at the card from 0.3 m"
      location: {at: [0, -0.1, -11.7]}
      orientation: {look_at: [0, 0, -12]}
      initial-media: [seawater]
