# a dive bar from three metres at eye height, lit only by its own lamps.
# see retail-close-ramen.yaml for what is picked by eye. thing seed 16
# draws a dive one bay wide.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: retail-close-dive
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 80
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "three metres from a dive bar, at eye height"
      location:
        at: [1.8, -3, 1.6]
      orientation:
        look_at: [1.8, 0, 1.5]
  set:
    things:
      frontage:
        kind: frontage-one
        seed: 16
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.035, 0.035, 0.04]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [20, 0, -1.01]
        size: [200, 200, 2]
        source: eye
