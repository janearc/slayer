# a run of street-level retail at night, at eye height from across a narrow
# street: a vending pair, a dive, a ramen counter, a dive, each lit from
# inside so its light spills onto the pavement. made by the manufactory's
# kind frontage (manufacture/retail.go) from manufacture/retail-units.yaml;
# thing seed 33, with the scene seed at its usual one, draws vending, dive,
# ramen, dive, konbini, ramen, shuttered, vending: the seed a frontage is
# made from is placement.Seed(scene seed, 33), and manufacture.FrontageUnits
# of it says the run. a plain building stands on the units. the
# moon, the pavement, the building and the cameras are choices of this
# study, picked by eye, and say so.
#
# places are metres, x east, y north, z up; the frontage's left end is the
# origin and it faces south into the street.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: street-retail
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 62
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # twelve metres across the street at eye height, the first four units.
    row:
      title: "across the street: vending, dive, ramen, dive"
      location:
        at: [9, -12, 1.6]
      orientation:
        look_at: [9, 0, 1.8]
    # across the street at the ramen counter.
    ramen:
      title: "the ramen counter, from the pavement"
      location:
        at: [10.8, -6, 1.6]
      orientation:
        look_at: [10.8, 0, 1.5]
  set:
    things:
      frontage:
        kind: frontage
        seed: 33
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.035, 0.035, 0.04]}
        source: eye
      storeys:
        colour: {srgb_linear: [0.05, 0.05, 0.06]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [20, 0, -1.01]
        size: [200, 200, 2]
        source: eye
      building:
        material: storeys
        middle: [20, 6.9, 21.7]
        size: [44, 14, 36.6]
        source: eye
    suns:
      moon:
        toward: [0.2, 0.6, 0.5]
        colour: {srgb_linear: [0.05, 0.065, 0.12]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.008, 0.012, 0.03]}
      zenith: {srgb_linear: [0.002, 0.004, 0.012]}
      ground: {srgb_linear: [0.004, 0.004, 0.004]}
      source: eye
