# terraces, midwest: two rows of sided houses facing each other across a
# street, each house with a garage beside it, standing apart or as
# duplexes, seen from the street at eye height and from higher up. made
# by the cities package (manufacture/cities), through the manufactory's
# kind terrace-midwest, from manufacture/cities/cultures/midwest.yaml.
# the two rows' seeds, 1 and 2, are in one district, so they share a
# siding colour.
#
# places are metres, as a map's run: x east, y north, z up. the north row
# faces south, as drawn; the south row is turned half a turn to face
# north, and stands at the east end of its run, since turned it runs
# west. the street is the ground between them. the sun, the colours and
# the cameras are choices of this study, picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: terraces midwest
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # eye height, in the street's middle at its west end, looking along
    street:
      title: "along the street, at eye height"
      location:
        at: [-14, 0, 1.7]
      orientation:
        look_at: [60, 0, 2.5]
    # higher up, from the south-west
    above:
      title: "from higher up"
      location:
        at: [-30, -45, 32]
      orientation:
        look_at: [40, 0, 2]
  set:
    things:
      north row:
        kind: terrace-midwest
        seed: 1
        complexity: quick
        east: 0
        north: 17
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
      south row:
        kind: terrace-midwest
        seed: 2
        complexity: quick
        east: 90
        north: -17
        height: {value: 0, unit: m}
        heading: {value: 180, unit: deg}
  world:
    unit: 1
    materials:
      verge:
        colour: {srgb_linear: [0.05, 0.08, 0.03]}
        source: eye
      tarmac:
        colour: {srgb_linear: [0.045, 0.045, 0.05]}
        source: eye
    boxes:
      # grass under everything, upper face at nought
      lawn:
        material: verge
        middle: [0, 0, -1.06]
        size: [3000, 3000, 2]
        source: eye
      # the street, a thin slab on the grass between the fronts
      street:
        material: tarmac
        middle: [45, 0, -0.03]
        size: [3000, 11, 0.1]
        source: eye
    suns:
      west:
        toward: [-0.8, -0.3, 0.2]
        colour: {srgb_linear: [2.2, 1.3, 0.65]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.22, 0.14, 0.12]}
      zenith: {srgb_linear: [0.02, 0.035, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
