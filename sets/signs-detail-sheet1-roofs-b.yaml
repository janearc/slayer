# the signs detail study, sheet one, roof signs b: two roof signs seen
# square-on, a painted board lit by lamps on arms above it, on a lattice
# frame (sign-roof seed 12), and a lit box with a translucent face of panels
# in a frame, on a frame of legs (sign-roof seed 11), each from
# manufacture/cities/signdraw.go, drawn from manufacture/cities/cultures/
# sign.yaml. each thing is given a heading, or the hillside turns it by its
# seed.
