# the signs detail study, a close view of open tube letters: the left end of
# the roof sign of seed 20, from 9 m off, the letters bent to the edge of
# their shape in tube, the posts that hold each tube off its backing, the
# electrodes at the tube's ends and the tube round the board, from
# manufacture/cities/signdraw.go, drawn from manufacture/cities/cultures/
# sign.yaml.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the sign's own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the street, the lamp and the camera are choices of this study.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: signs detail close tube
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "9 m off, at the left end of the letters"
      location:
        at: [-22, -9, 6.5]
      orientation:
        look_at: [-22, 0, 6.5]
  set:
    things:
      tube: {kind: sign-roof, seed: 20, complexity: quick, east: -14, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
  world:
    unit: 1
    lamps:
      plain-dim:
        at: [-22, -9, 12]
        temperature: 5000
        strength: 160
        radius: 0.3
        source: eye
    materials:
      street:
        colour: {srgb_linear: [0.02, 0.02, 0.025]}
        clear: {through: 0.03, index: 1.5, gloss: 1, rank: 0}
        source: eye
    boxes:
      street:
        material: street
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
