        middle: [-30, 99.7, 90]
        size: [30, 0.6, 30]
        source: eye
      w4-windows:
        material: windows
        middle: [-30, 99.7, 40]
        size: [34, 0.6, 50]
        source: eye
      e1-sign:
        material: sign-amber
        middle: [30, -100.3, 50]
        size: [22, 0.6, 20]
        source: eye
      e1-side:
        material: sign-pink
        middle: [14.7, -85, 35]
        size: [0.6, 20, 30]
        source: eye
      e2-sign:
        material: sign-cyan
        middle: [14.7, -20, 90]
        size: [0.6, 30, 40]
        source: eye
      e2-windows:
        material: windows
        middle: [14.7, -20, 40]
        size: [0.6, 32, 50]
        source: eye
      e2-front:
        material: sign-pink
        middle: [32.5, -40.3, 100]
