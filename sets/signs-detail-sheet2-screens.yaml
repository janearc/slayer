# the signs detail study, sheet two, screens: six screens from six seeds,
# 21 to 26, in two rows of three, seen square-on: each its own make, lines,
# words, colours and wear, from manufacture/cities/signdraw.go, drawn from
# manufacture/cities/cultures/sign.yaml. each thing is given a heading, or
# the hillside turns it by its seed.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the signs' own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the rows' places, the street, the lamp and the camera are choices of
# this study.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: signs detail sheet two screens
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 60
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    square:
      title: "square-on, 90 m off, at the height of the two rows' middle"
      location:
        at: [0, -90, 11]
      orientation:
        look_at: [0, 0, 11]
  set:
    things:
      a1: {kind: sign-screen, seed: 21, complexity: quick, east: -32, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
      a2: {kind: sign-screen, seed: 22, complexity: quick, east: 0, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
      a3: {kind: sign-screen, seed: 23, complexity: quick, east: 32, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
      b1: {kind: sign-screen, seed: 24, complexity: quick, east: -32, north: 0, height: {value: 13, unit: m}, heading: {value: 0, unit: deg}}
      b2: {kind: sign-screen, seed: 25, complexity: quick, east: 0, north: 0, height: {value: 13, unit: m}, heading: {value: 0, unit: deg}}
      b3: {kind: sign-screen, seed: 26, complexity: quick, east: 32, north: 0, height: {value: 13, unit: m}, heading: {value: 0, unit: deg}}
  world:
    unit: 1
    lamps:
      plain-dim:
        at: [0, -90, 35]
        temperature: 5000
        strength: 16200
        radius: 0.5
        source: eye
    materials:
      street:
        colour: {srgb_linear: [0.02, 0.02, 0.025]}
        clear: {through: 0.03, index: 1.5, gloss: 1, rank: 0}
        source: eye
    boxes:
      street:
        material: street
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
