# the row of five gargoyles of gargoyle-cornice-rain.yaml, seen from the
# pavement across the street, looking up at the whole of it: the view a
# person in the street has. the light, the sky, the ground and the camera
# are choices of this study, picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: gargoyle-cornice-rain-street
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    street:
      title: "from the street, looking up at the row"
      wide: 52
      location:
        at: [0, -32, 1.7]
      orientation:
        look_at: [0, 0, 17]
  set:
    things:
      cornice:
        kind: gargoyle-cornice-granite
        seed: 11
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.05, 0.05, 0.052]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [0, 0, -1.06]
        size: [3000, 3000, 2]
        source: eye
    suns:
      overcast:
        toward: [-0.35, -0.75, 0.55]
        colour: {srgb_linear: [2.4, 2.35, 2.25]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.32, 0.33, 0.36]}
      zenith: {srgb_linear: [0.14, 0.16, 0.2]}
      ground: {srgb_linear: [0.04, 0.04, 0.04]}
      source: eye
    weathering:
      source: eye
      seed: 3
      age: 60
      ground: 0
      probe: 0.03
      block: 2
      wind: [1, 0, 0]
      agents:
        spout:
          kind: spout
          on: [wall, corbel]
          colour: {srgb_linear: [0.012, 0.011, 0.01]}
          strength: 0.95
          settle: 20
          level: 0.3
          length: 12
          spacing: 0.9
          spread: 0.12
          upwind: 0.2
          grain: 0.6
          share: 0.7
        rain:
          kind: rain
          on: [wall]
          colour: {srgb_linear: [0.02, 0.019, 0.018]}
          strength: 0.3
          settle: 15
          level: 0.2
          length: 3.5
          spacing: 0.7
          share: 0.7
        moss:
          kind: moss
          on: [corbel, gargoyle]
          colour: {srgb_linear: [0.03, 0.07, 0.022]}
          strength: 0.7
          settle: 20
          reach: 40
          share: 0.5
          grain: 0.3
          shade: 0.2
          north: 0.3
          shelter: 1.5
          catch: 1
