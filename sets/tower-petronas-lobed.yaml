# tower petronas lobed: two towers on a lobed plan, an eight-pointed star
# of two turned squares with an arc filling each inner corner, in
# stainless steel with horizontal fins, stepped back four times and joined
# by a skybridge, as the Petronas Towers in Kuala Lumpur are. it is the
# tower generator with a lobed plan, two shafts, a skybridge, the stainless
# skin and eighty eight storeys pinned, no taper or turn. at dusk into
# night. made by the cities package (manufacture/cities) from
# manufacture/cities/cultures/tower.yaml.
#
# places are metres, as a map's run: x east, y north, z up. the shafts
# stand side by side along x. the plaza, the sun, the sky and the cameras
# are choices of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower petronas lobed
  setting: space
  light: none
  film:
    width: 960
    height: 540
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    far:
      title: "both towers, from across the park"
      location:
        at: [60, -680, 4]
      orientation:
        look_at: [0, 0, 170]
  recipes:
    twins:
      kind: tower
      irregularity: 0.3
      pins: {plan: lobed, shafts: 2, span: skybridge, skin: stainless, segments: 4, storeys: 88, width: {value: 56, unit: m}, setbacks: true, taper: false, twist: false, spire: true, stack: false, nest: false, lit-crown: false}
  set:
    things:
      towers: {recipe: twins, seed: 1, complexity: quick, east: 0, north: 0, height: {value: 0, unit: m}}
  world:
    unit: 1
    materials:
      paving:
        colour: {srgb_linear: [0.04, 0.04, 0.045]}
        source: eye
    boxes:
      ground:
        material: paving
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
    suns:
      west:
        toward: [-0.9, -0.3, 0.02]
        colour: {srgb_linear: [1.6, 0.7, 0.4]}
        source: eye
      moon:
        toward: [0.25, -0.9, 0.4]
        colour: {srgb_linear: [0.5, 0.58, 0.8]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.3, 0.14, 0.14]}
      zenith: {srgb_linear: [0.01, 0.025, 0.1]}
      ground: {srgb_linear: [0.01, 0.01, 0.012]}
      source: eye
