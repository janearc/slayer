# the neon street as sixty-four towers, no two the same: eight rows of
# eight, each tower on a lot of 36 m with a street of 12 m on every side,
# so the alleys between them run 372 m straight in both directions. each
# tower has a plan and a skin no other has (eight plans by eight skins), a
# height of its own from 14 to 60 storeys, an irregularity of its own from
# 0.2 to 1, and a seed of its own; taper, twist, setbacks, spire, crown,
# gargoyles, planting and the cyber roof are left to the tower's own draw.
# every tower keeps shops in its foot and signs. every street and alley is
# the wet road. which lot a tower stands on, the heights, the
# irregularities and the seeds are picked.
#
# places are metres, as a map's run: x east, y north, z up. the first
# camera is the one drawn; to draw another, name it.
