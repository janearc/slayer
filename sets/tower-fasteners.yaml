# tower fasteners: two towers drawn as finely as the camera sees them,
# a curtain wall and a granite one, at dusk. Up close the curtain wall
# shows a cap over the head of each mullion with its bolt, and the granite
# shows a bolt at each corner of its panels; both show an anchor plate
# with four bolts at the slab every third window. They are made by the
# tile, a storey high and two windows wide, so only the tiles the camera
# is close to have any: further up the wall, where the camera's bands are
# drawn at the quick level, there are none and the glass keeps its lit
# panes over a wall at its recess.
#
# places are metres, as a map's run: x east, y north, z up. the towers
# stand side by side, their fronts at y of minus fifteen. every number is
# a choice of this study, picked by eye. the first camera is the one
# drawn; to draw another, put it first.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower fasteners
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 16
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "four metres from the curtain wall, at the height of its second storeys"
      wide: 50
