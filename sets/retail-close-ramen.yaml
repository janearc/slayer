# a ramen counter from three metres at eye height, lit only by its own
# lamps: no moon, no sky. made by the kind frontage-one
# (manufacture/retail.go) from manufacture/retail-units.yaml; thing seed 2,
# with the scene seed at its usual one, draws a ramen counter two bays
# wide. the pavement and the camera are choices of this study, picked by
# eye, and say so. a set draws its first camera, so each kind is its own
# file: retail-close-<kind>.yaml.
#
# places are metres, x east, y north, z up; the frontage's left end is the
# origin and it faces south into the street.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: retail-close-ramen
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 80
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "three metres from a ramen counter, at eye height"
      location:
        at: [3.6, -3, 1.6]
      orientation:
        look_at: [3.6, 0, 1.5]
  set:
    things:
      frontage:
        kind: frontage-one
        seed: 2
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.035, 0.035, 0.04]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [20, 0, -1.01]
        size: [200, 200, 2]
        source: eye
