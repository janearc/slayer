# a small proof of the air over a bay: three towers from the futian shore's
# recipes and seeds, one fishing boat at anchor, one laser, flat water and
# a low sun, on the same survey tile as sets/futian-shore.yaml. it is a
# test bench for the airs, drawn small on the processor tracer before the
# city is.
#
# the window is 2000 m across and 1500 m down, its middle 500 m west and
# 150 m south of the futian shore's window middle, so a thing here is 500 m
# less east and 600 m less north than it is there. the towers, the boat
# and the laser stand where they stand in that set. the ground is the
# tile's surface model smoothed as there; the water is the tile's own
# flat nought, a sea at nought.
#
# the sun is that set's: 247.73 degrees, 2.37 up. the air is the earth's,
# worked.
#
# the air in this file is the futian shore's air as it stood: one grey
# mist, 0.0039 a metre, 300 m deep over the ground. it is the picture of
# what the set language had before the airs.
