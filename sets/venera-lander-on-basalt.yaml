# the venera lander standing on basalt: an assembly test, and not venus.
#
# the lander is the new kind, venera-lander, a placeholder of plain
# shapes whose sizes are read from a nasa report on the lander of
# venera 9 to 14 (manufacture/venera-lander.yaml says where).
#
# the ground is the floor of kīlauea iki, the lava lake of 1959: a real
# basalt plain, from the usgs 2019 lidar, standing in for the basalt
# plains the landers came down on. it is the only ground a set can ask
# for today.
#
# what is the earth's here and would not be venus's:
# - the sky. a terrain set's sky is a painted gradient, blue, with no
#   air in it. venus's air is in slayer (scene/gas, gas.Venus) and no
#   set file can name it yet.
# - the light. the sun is the earth's, at a fixed strength; under
#   venus's cloud the ground is lit from the whole sky, with no shadow.
# - the ground's shape and its colour, which hillside fixes.
#
# places are utm metres, zone 5 north, as the other kīlauea sets'. the
# spot is the moonrise set's lookout on the crater floor.
scene:
  name: the venera lander on a basalt plain
  light: sun
  location:
    lat: 19.4165
    lon: -155.2485
  timeofday: 1200
  # picked: high in the south-east, so the plate's shadow falls short
  # and the legs are lit
  sun:
    azimuth: 135
    altitude: 55
  terrain:
    from: usgs-kilauea-2019-dem
    file: unpacked/kil_2019dem/kil_2019dem.tif
    west: 263000
    north: 2148800
    across: 1600
    down: 1000
    step: 4
  # a test frame: small, one ray
  film:
    width: 640
    height: 400
    rays: 1
  cameras:
    beside:
      title: "the lander, from a few metres off, at a person's eye"
      orientation:
        point_to: the lander
        alpha: -4
      location:
        loc_relative:
          object: the lander
          standoff_x: -5
          standoff_y: -4
          standoff_z: 1.6
  set:
    things:
      the lander:
        kind: venera-lander
        seed: 9
        east: 263450
        north: 2148300
