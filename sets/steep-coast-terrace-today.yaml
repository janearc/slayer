# what a terrace does on steep ground today, before the cliff keys: a study
# of the thing as it stands, kept so the picture can be drawn again.
#
# the ground is copernicus glo-30, tile n22 e114 (a surface model: it holds
# the tops of what stands there), a window 1000 m across and 800 m down
# round 22.2140 north, 114.2450 east, on the west face of the peninsula on
# the south-east of hong kong island. this is a proof of the mechanism on a
# steep coast, and it is not portofino. from the sea the model rises about
# 100 m in 170 m there, which the heights of the tile say (read, not
# recalled). its sea is the model's nought, lifted half a metre.
#
# the sun is where scene/daylight.Sun, noaa's fractional-year equations,
# puts it for 22.2135 north, 114.2450 east at 16:00 china standard time
# (utc+8) on 20 november 2026: azimuth 237.97, altitude 19.83, geometric.
#
# two kinds of terrace are put on it. "the row" is one thing, a terrace
# stood at one place by east and north. "the lattice" is a stand of the
# lattice habit, which the session makes for the ground under each
# site. places are metres in the terrain window: east from its west edge,
# north from its south edge. a camera stood off a thing stands off where
# the thing stands on the ground.
