# tower cyberpunk grime: two towers under the cyberpunk layer at the demo
# level, at dusk: air conditioners with their fans' grilles, runs of duct
# with flanges and an elbow down, cables sagging between hooks, boxes
# bolted to the wall with a conduit down from each, over the quick
# level's pipes, vents, boxes and gantries. The world's weathering runs
# grime down the wall from under every one of them, rusts their steel and
# runs the rust below, and the writers go for the wet walls. The towers
# say nothing of the grime: it is the world's.
#
# places are metres, as a map's run: x east, y north, z up. the towers
# stand side by side, their fronts at y of minus fifteen. every number is
# a choice of this study, picked by eye. the first camera is the one
# drawn; to draw the other, put it first.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
