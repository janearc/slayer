# a superblock halfway between planned and grown over: the block of
# superblock-planned.yaml, the same parcel, people and seed, at an accretion
# of a half. the plan still shows, the podium, the slabs, the cores and the
# decks, and over it a few decades of additions: some of the court built
# on, floors added on some roofs, rooms bolted to the walls, walkways and
# cables across the lanes, roofs railed as yards.
#
# each addition comes by a share the accretion gates, so half the accretion
# brings about half of each (manufacture/cities/superblock*.go). nothing is
# placed by hand. the parcel is 120 by 80 metres for three thousand four
# hundred people, at the quick level, as superblock-planned.yaml says.
#
# the weathering's age is not said: it follows the block's accretion, from
# five years planned to forty-five accreted, so at a half it is twenty-five
# and the agents have laid more than on the planned block. motorhomes stand
# in berths on some roofs, parts of the scavenged method.
#
# dusk going into night on flat ground; the sun is on the western horizon.
# places are metres, x east, y north, z up, the parcel's middle at the
# origin. every number of the light is a choice of this study, by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: superblock half
  setting: space
  light: none
  set:
    things:
      block:
        kind: superblock
        habit: accreted
        seed: 7
        complexity: quick
        parcel:
          width: {value: 120, unit: m}
          depth: {value: 80, unit: m}
        ceiling: 14
        occupants: 3400
        crowding: 1
        accretion: 0.5
        parts: {winnebago: 1}
        east: 0
        north: 0
        height: {value: 0, unit: m}
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    corner:
      title: "from the south-west street corner, at eye height"
      wide: 70
      location: {at: [-69, -50, 1.7]}
      orientation: {look_at: [-35, -25, 16]}
    above:
      title: "from 90 m up, south-east of the block"
      location: {at: [90, -120, 90]}
      orientation: {look_at: [0, 0, 10]}
  world:
    unit: 1
    materials:
      ground:
        colour: {srgb_linear: [0.05, 0.05, 0.055]}
        source: eye
    boxes:
      flat:
        material: ground
        middle: [0, 0, -1]
        size: [1200, 1200, 2]
        source: eye
    suns:
      west:
        toward: [-1, 0.2, 0.03]
        colour: {srgb_linear: [1.4, 0.55, 0.3]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.3, 0.15, 0.14]}
      zenith: {srgb_linear: [0.02, 0.04, 0.1]}
      ground: {srgb_linear: [0.02, 0.02, 0.022]}
      source: eye
    weathering:
