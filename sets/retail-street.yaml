# a street of two rows of buildings, each with a podium of shops at its foot,
# at night, lit only by the shops: no moon, no sky. made by the kind
# retail-block (manufacture/retail_ground.go): a building of a kind the data
# names, drawn from the thing's seed, with units of retail drawn from
# manufacture/retail-units.yaml stood against its front. thing seed 2 is a
# terrace and thing seed 14 another; the north one faces south at the
# street and the south one is turned about to face north at it. a thing's
# seed is placement.Seed(scene seed, thing seed), scene seed 1. the street's
# width, the pavement and the camera are choices of this study, picked by
# eye.
#
# places are metres, x east, y north, z up. the shops' fronts stand six
# metres each side of the street's middle, which runs east along y nought:
# a block's front is its building's front plus the podium, 7.2 m, and a
# building's front is the most forward thing it has.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: retail-street
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 70
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    street:
      title: "down the street at eye height, between two rows of shops"
      location:
        at: [12, 1, 1.6]
      orientation:
        look_at: [50, 0, 2.5]
  set:
    things:
      north-row:
        kind: retail-block
        seed: 2
        complexity: quick
        east: 0
        north: 33.4
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
      south-row:
        kind: retail-block
        seed: 14
        complexity: quick
        east: 80.4
        north: -34.4
        height: {value: 0, unit: m}
        heading: {value: 180, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.035, 0.035, 0.04]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [40, 0, -1.01]
        size: [300, 300, 2]
        source: eye
