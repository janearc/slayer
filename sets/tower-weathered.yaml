# tower weathered: four towers along a street at the demo level, with the
# world's weathering laid over them: rain streaks from every ledge, soot
# low down and under cover, rust on steel and running below it, and
# graffiti. Writers mark the street faces at arm's reach, the shutters of
# dark shops most; they climb to the roofs and mark the parapets, the
# water tanks and the backs of the billboards, more thinly; they go for
# the wet cyberpunk tower and an emptied one, and leave the polished
# lobbies of the mirror and granite towers almost bare. The towers say
# nothing of any of it: the weathering is the world's.
#
# places are metres, as a map's run: x east, y north, z up. the towers
# stand in a row along the north side of a street, their fronts at y of
# minus fifteen. every number is a choice of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower weathered
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 16
    exposure: 1
    print:
