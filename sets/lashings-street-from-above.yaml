# lashings, at full density, from above: the street between two rows of
# plain six-storey blocks, seen from over the south end and high, looking
# down onto the cables, lanterns and banners. made by the cities package
# (manufacture/cities, Lashings), through the manufactory's kind
# lashed-street, from manufacture/cities/cultures/lashings.yaml.
#
# places are metres, x east, y north, z up; the street runs north and
# south, 96 m long, centred on the origin. there is no sun and no sky:
# the light is the windows, the lanterns and the banners. the ground, the
# exposure and the cameras are choices of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: lashings-street-from-above
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 4
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # high over the south end, looking down the street and down at it.
    from-above:
      title: "from above, density 1.0"
      location:
        at: [0, -70, 60]
      orientation:
        look_at: [0, 10, 8]
  recipes:
    hung:
      kind: lashed-street
      density: 1.0
  set:
    things:
      the street:
        recipe: hung
        seed: 7
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      road:
        colour: {srgb_linear: [0.02, 0.02, 0.022]}
        source: eye
    boxes:
      ground:
        material: road
        middle: [0, 0, -1]
        size: [400, 400, 2]
        source: eye
