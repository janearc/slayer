# rows of tall painted terraces climbing a steep coast, each row along a
# contour and standing on its own ground, one above the next with a lane
# between: a proof of the mechanism on measured ground. it is not
# portofino, and it is not a model of any town. the houses are the
# manufactory's terrace-portofino; the place is chosen only because it is
# steep and on the shelf (see sets/portofino-cliffs.yaml for the harbour
# this is the study of).
#
# the ground: copernicus glo-30, tile n22 e114, a surface model: it holds
# the tops of what stands there, trees and roofs, and not the bare earth. the
# window is 1000 m across and 800 m down, round 22.2140 north, 114.2450
# east, on the west face of the peninsula on the south-east of hong kong
# island, at a 10 m step. the model's posts are 30 m apart, so the ground
# is a surface laid through them: it is smooth between posts and its slope
# changes at a post, never inside a bay. smoothed by a gaussian 20 m wide
# (its standard deviation, picked), the face rises from the sea to about
# 100 m in about 170 m, and about 0.45 in a metre over the town: the tile's
# heights say this, read, not recalled. the sea is the model's nought,
# lifted half a metre so the two are not drawn in one plane.
#
# the sun: where scene/daylight.Sun, noaa's fractional-year equations,
# puts it for 22.2135 north, 114.2450 east at 16:00 china standard time
# (utc+8) on 20 november 2026: azimuth 237.97, altitude 19.83, geometric,
# without refraction. the sky is the earth's air, worked from that.
#
# the town: one stand of the habit contour, the climb saying its shape.
# "the foot" is where the first row starts, at its north end, 345 m east
# and 520 m north in the window; the rows' fronts look down the slope,
# west, to the sea, so a row runs south along its contour from where it
# starts. four rows of two runs each, a lane 4 m wide between one row and
# the next, and the doors of every bay at the ground in front of it. each
# bay stands on its own ground: its floor is the highest ground along its
# front wall, a plinth of concrete reaches from there down to the lowest
# ground under it, and the hill is cut into behind. a run is a terrace of
# fourteen bays drawn from the portofino culture, straight; each run is
# turned to the contour where it stands.
#
# places of things are metres in the terrain window: east from its west
# edge, north from its south edge. a camera's at and look_at are east from
# the west edge, north as the window's northing less its 800 m depth, and
# up from the lowest ground in the window, the sea's nought here.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
