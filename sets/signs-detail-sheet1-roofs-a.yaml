# the signs detail study, sheet one, roof signs a: two roof signs seen
# square-on, a roof sign of open tube letters on a backing, on a lattice
# frame (sign-roof seed 20), and one of channel letters, on a frame of legs
# (sign-roof seed 3), each from manufacture/cities/signdraw.go, drawn from
# manufacture/cities/cultures/sign.yaml. the frame, the plates and bolts on
# the roof, the transformer and the conduit are parts of each sign. each
# thing is given a heading, or the hillside turns it by its seed.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the signs' own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the street, the lamp and the camera are choices of this study.
