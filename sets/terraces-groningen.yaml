# terraces, groningen: a row of twelve bays on a harbour quay, a gable to
# the water on each, seen from across the water at eye height and from
# higher up. made by the cities package (manufacture/cities), through the
# manufactory's kind terrace-groningen, from the culture in
# manufacture/cities/cultures/groningen.yaml. the culture is named by the
# kind because a set hands the manufactory only a kind and a seed.
#
# places are metres, as a map's run: x east, y north, z up. the row runs
# east from the origin with its front, and its gables, to the south. the
# water is a flat dark blue-grey box standing in for it, not a sea: it
# has no waves and no gloss, since a set's material has no gloss that is
# not a clear one.
# the sun's place, the ground's and the water's colours and the cameras
# are choices of this study, picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: terraces groningen
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 40
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # eye height, 110 m across the water from the middle of the row
    across:
      title: "across the water, at eye height"
      location:
        at: [36, -120, 1.7]
      orientation:
        look_at: [36, 0, 7]
    # forty metres up, further back, looking down on the row
    above:
      title: "from higher up"
      location:
        at: [36, -130, 40]
      orientation:
        look_at: [36, 0, 5]
  set:
    things:
      row:
        kind: terrace-groningen
        seed: 1
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      quay:
        colour: {srgb_linear: [0.1, 0.095, 0.085]}
        source: eye
      water:
        colour: {srgb_linear: [0.05, 0.07, 0.095]}
        source: eye
    boxes:
      # the quay: land from three metres in front of the row, upper face
      # at nought
      land:
        material: quay
        middle: [0, 237, -1]
        size: [3000, 500, 2]
        source: eye
      # the water, a little lower than the quay, from the quay's edge
      # south
      harbour:
        material: water
        middle: [0, -513, -1.3]
        size: [3000, 1000, 2]
        source: eye
    suns:
      west:
        toward: [-0.7, -0.6, 0.22]
        colour: {srgb_linear: [2.2, 1.3, 0.65]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.22, 0.14, 0.12]}
      zenith: {srgb_linear: [0.02, 0.035, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
