# tower lipstick: an elliptical tower in three telescoping tiers, banded
# red granite and ribbon windows, as the Lipstick Building in New York is.
# it is not data: it is the tower generator with an ellipse plan, three
# segments with setbacks, red granite in ribbon windows and thirty four
# storeys pinned, no taper or turn. at dusk into night. made by the cities
# package (manufacture/cities) from manufacture/cities/cultures/tower.yaml.
#
# places are metres, as a map's run: x east, y north, z up. the plaza, the
# sun, the sky and the cameras are choices of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower lipstick
  setting: space
  light: none
  film:
    width: 960
    height: 540
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    street:
      title: "from the plaza, the three tiers"
      location:
        at: [150, -330, 4]
      orientation:
        look_at: [0, 0, 62]
  recipes:
    lipstick:
      kind: tower
      irregularity: 0
      pins: {plan: ellipse, skin: granite, style: ribbon, colour: red, use: office, segments: 3, storeys: 34, width: {value: 44, unit: m}, setbacks: true, taper: false, twist: false, spire: false}
