# san francisco from sutro: the east slope below the tower, at eye height on
# a street among the houses about 250 m up, looking east-northeast over the
# castro and the mission to the financial district, across the bay to
# treasure island and the bay bridge, at dusk into night.
#
# the ground is noaa's cudem topobathy model of the bay, cut twice from the
# one tile: a far window, 11.4 by 9.2 km at a 20 m step, out to treasure
# island and past it, and inside it a near window of 1.4 by 1.2 km at the
# 3 m step the model gives, about the camera. the far window does not draw
# where the near one lies. the bay is filled to the sea at nought.
#
# the tile ends at 37.7498 north, so the window's south edge is at 37.7502.
# places are metres in the far window: east runs 0 to 11400 from the west
# edge, north 0 to 9200 from the south edge; the middle is 37.7916 north and
# 122.395 west. the camera stands near 37.7559 north, 122.4508 west, which
# is 799 east and 635 north: in the middle of a street of the grid, moved
# from the spot first taken, which was inside a block. the grid's turn is
# picked, not measured.
#
# the houses are laid by the grid habit and the san-francisco culture, in
# rectangles that share one street lattice and lay no block twice: within
# about four hundred metres of the camera at the demo level, the middle
# distance at quick, and the far city at hull. the financial district is
# towers on a lattice from the tower generator, left out of the grid: most
# plain, a few tall. the bay bridge is the bridge kind, bare, from the
# embarcadero to yerba buena island, its axis 43.4 degrees east of north.
# the houses stand where the grid puts them, across the open slopes and
# parks too: the grid does not know a park.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: san francisco from sutro
  light: sun
