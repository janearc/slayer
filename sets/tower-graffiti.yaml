# tower graffiti: a cyberpunk tower and a concrete one at dusk, drawn as
# finely as the camera sees them, with the world's graffiti laid over
# their ground floors at the sizes a city has: tags half a metre to a
# metre long, throw-ups of fat bubbles with an outline, a highlight and
# drips, one to three metres across, pieces of more bubbles in two paints
# three to five metres across, and older ones faded under the newer. The
# writers go for the roller shutters of dark shops, a loading door and
# the wet cyberpunk walls most, a concrete wall some, and leave polished
# stone alone. The towers say nothing of any of it: it is the world's.
#
# places are metres, as a map's run: x east, y north, z up. the towers
# stand side by side, their fronts at y of minus fifteen. every number is
# a choice of this study, picked by eye. the first camera is the one
# drawn; to draw another, put it first.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower graffiti
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 16
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "at eye height, six metres from the ground floor of the cyberpunk tower"
      wide: 70
      location:
        at: [-8, -21, 1.6]
      orientation:
        look_at: [-8, -15, 1.4]
    concrete:
