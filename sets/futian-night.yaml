  set:
    things:
      # where the cameras stand and look: a marker 30 m east of the city's
      # middle in its alley 24 m south of the middle; one 560 m east of the
      # middle; and one in the bay 2000 m west of the middle along the
      # alley, under the water.
      the alley eye: {kind: human-scale-2m, seed: 1, east: 2131.9, north: 1909.2}
      the roofs eye: {kind: human-scale-2m, seed: 1, east: 2613.1, north: 2132.5}
      the bay: {kind: human-scale-2m, seed: 1, east: 253.7, north: 1138.9}
      # three markers on the shore that centre the mangrove groups
      the reserve: {kind: human-scale-2m, seed: 1, east: 700, north: 2250}
      the front: {kind: human-scale-2m, seed: 1, east: 1750, north: 1650}
      the south-east shore: {kind: human-scale-2m, seed: 1, east: 2750, north: 1300}
      # the village: 80 by 60 m, 350 m inland of the shore at its northing
      # and 140 m off the city's south-east edge; the heading is the city's
      the village: {recipe: village, seed: 20, complexity: levelled, east: 2200, north: 1600, heading: {value: 337.7, unit: deg}}
      # the city's other buildings, stood about it in its own frame: u runs
      # from the middle toward the bay along bearing 247.73, v across it
      # along bearing 337.7, and a point is east = 2095 - 0.9259 u - 0.3778 v,
      # north = 1920 - 0.3778 u + 0.9259 v. the city's lots end at u = 378
      # and at v = 211 either side. places are choices, said at each.
      # a superblock between the city's front and the shore, at its wide
      # north-west end: u 465, v 165, a parcel 120 by 80 m.
      the front superblock: {kind: superblock, habit: accreted, seed: 7, complexity: quick, parcel: {width: {value: 120, unit: m}, depth: {value: 80, unit: m}}, east: 1602.2, north: 1897.1, heading: {value: 337.7, unit: deg}}
      # a larger one inland of the south-east flank: u 150, v -320, 210 by 120 m
      the flank superblock: {kind: superblock, habit: accreted, seed: 11, complexity: quick, parcel: {width: {value: 210, unit: m}, depth: {value: 120, unit: m}}, east: 2077, north: 1567, heading: {value: 337.7, unit: deg}}
      # two condominiums, flats round a shared court, on the north-west flank: u 320, v 300 and u 200, v 310
      the front condominium: {kind: condominium, seed: 4, complexity: quick, east: 1685.4, north: 2076.9, heading: {value: 337.7, unit: deg}}
      the flank condominium: {kind: condominium, seed: 9, complexity: quick, east: 1792.7, north: 2131.4, heading: {value: 337.7, unit: deg}}
      # two lashed streets, 96 m long, 12 m wide between blocks, hung with
      # cables, lanterns and signs, both running toward the bay (bearing
      # 247.7): u 60, v 270 and u 60, v -270
      the north lashed street: {recipe: lashed, seed: 7, complexity: quick, east: 1937.4, north: 2147.3, heading: {value: 67.7, unit: deg}}
      the south lashed street: {recipe: lashed, seed: 8, complexity: quick, east: 2141.4, north: 1647.3, heading: {value: 67.7, unit: deg}}
      # the city's edge on the water, a made city's and not a survey's:
      # three piers from the shore in front of the city, each a deck on
      # piles with a shed on it, reaching out along the alleys' bearing,
      # at v -150, 0 and 150 and a little inland of the water's edge as the
      # ground reads there (u 400, 462 and 525); and a bridge whose
      # structure is buildings, 700 m, laid on the same bearing from the
      # shore out over the bay, its near end at u 520 and its far end at u
      # 1220, centred at u 870, v 130, to the right of the first camera's
      # line. the far end stands in the water.
      the north pier: {kind: pier, seed: 61, complexity: quick, east: 1552.2, north: 1860.6, heading: {value: 337.7, unit: deg}}
      the middle pier: {kind: pier, seed: 62, complexity: quick, east: 1667.2, north: 1745.5, heading: {value: 337.7, unit: deg}}
      the south pier: {kind: pier, seed: 63, complexity: quick, east: 1781.3, north: 1630, heading: {value: 337.7, unit: deg}}
      the bridge of buildings: {recipe: bay bridge, seed: 3, complexity: quick, east: 1240.3, north: 1711.7, heading: {value: 337.7, unit: deg}}
      # the street along the landward edge of the mangrove belt: five of
      # the wet road's 84 m lengths end to end along the city's seaward
      # front at u 392 (14 m off the last lots), v -168, -84, 0, 84 and 168
      road front 0: {recipe: wet, seed: 6000, complexity: quick, east: 1795.6, north: 1616.3, heading: {value: 337.7, unit: deg}}
      road front 1: {recipe: wet, seed: 6001, complexity: quick, east: 1763.8, north: 1694.1, heading: {value: 337.7, unit: deg}}
