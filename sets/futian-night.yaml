# the hundred and forty-four towers of the neon street, moved to the shore
# of shenzhen bay at dongchong, futian district, shenzhen, at sunset on 20
# november 2026, in haze over wet streets.
#
# the city: the towers, their recipes and seeds, and the wet streets are
# those of sets/neon-street-towers-wide.yaml: nine rows of sixteen on 36 m
# lots with 12 m streets, the alleys 756 m long one way and 420 m the
# other. the city is turned 22.3 degrees anticlockwise about its middle, so
# its long alleys run to 247.7 degrees, where the sun stands; it is not
# otherwise changed. every thing says its heading, since a thing on the
# ground that says none is turned by its seed.
#
# the place: the middle of the city is 22.5238 north, 114.0209 east. the
# shore there runs north-west to south-east, the bay to the south-west.
# the edge of the city's south-west corner lot stands about 6 m from where
# the model's heights first fall under half a metre, toward 225 degrees.
# the terrain window's middle is 22.5200 north, 114.0200 east, 4000 m
# across and 3000 m down at a 10 m step; its west edge, 114.0006 east, is
# inside the tile, which begins at 114. the city's middle is 2095 east and
# 1920 north in the window.
#
# the ground: copernicus glo-30, tile n22 e114, a surface model: it holds
# the tops of what stands there now. under the city's lots it reads 0.4 to
# 31 m, a middle of 5.4 m and a ninetieth of 16.5 m, and neighbouring lots
# differ by a middle of 1.7 m and at most 16.7 m: roofs, trees and roads of
# today. smoothed by a gaussian 60 m wide (its standard deviation), the
# lots stand from 1.5 to 23.4 m, neighbours a middle of 0.7 m apart and at
# most 4.5 m, and the waterline moves 28 m out into the bay. each thing
# stands on the smoothed ground at its middle. the rise from the shore
# inland is the smoothed tops of what stands there, not the ground under
# them; no bare-earth model is on the shelf. 60 m is picked.
#
# the sea: world.ocean, the sea with no edge (it says no extent and no
# samples) laid over the bay with its mean face at 0.5 m on the model's
# datum. the model lays the water flat at nought and has no depth under it,
# so the bay's floor is the ground at nought and the face is half a metre
# over it. picked. the ground says no `sea` of its own: a plane under the
# sea would be a second water. the sea meets the ground where the ground
# is under its face. the water is interface only: the exact-light path
# refuses a named medium with extinction beside the haze.
#
# the swell: a sheltered bay under a stated wind, every number a choice and
# said beside it in the ocean block. the wind is 5 m/s from the north-east,
# the way the winter monsoon blows over this coast (recalled, not looked
# up): off the shore, out over the bay. the fetch is 2000 m, the water
# between the shore and the middle of the view, since a wind off the land
# has only the water it has crossed. the depth is 3 m, the order of the
# bay's mean depth (recalled, not looked up), where the tile says none.
#
# the mangroves: the bay has a mangrove reserve on this shore, the Futian
# reserve, at the north-west of this window (recalled, not looked up; the
# tile does not say what grows). a stand grows only where the smoothed
# ground lies between its `above` and `below`, in metres on the model's
# datum, so the stands go where the tile's own shore is. the sea's face is
# at 0.5. the low native kinds are laid from 0.1 to 1.5 m over it, the tall
# planted sonneratia from 1.5 to 2.5 m: a notion of the shore between mean
# sea level and high water, picked; no tide of this bay is looked up. three
# markers centre the groups: the reserve at the north-west, the front below
# the city and the south-east shore. the tile is a surface model, so where
# real mangroves stand it reads their canopy, and these stand on that.
#
# the boats: a few of each design, each set by its own `position` at the
# sea's mean face. a stand of a floating kind is offered only ground under
# the sea by 3 m, and a surface model has the bay floor at nought under a
# sea at half a metre, so a stand would find no water. the places are
# choices at sensible distances: sampans a few hundred metres off the shore,
# fishing boats a kilometre out, ferries two kilometres out. each shows the
# lights its kind shows. a boat sits at the mean face and does not follow
# the swell, which is a tenth of a metre or so.
#
# the lasers: three beams from the roofs of three towers on the seaward
# front, fanned over the bay. a beam draws only by what the haze scatters
# toward the eye, and has no skin. the roofs are read off pictures of the
# towers, as said at the lasers. the haze is 300 m deep over the ground,
# so a beam shows only while it is under that height. the wavelengths,
# radius, divergence, reach and strength are choices.
#
# the village: an 80 by 60 m parcel of an urban village, walk-ups packed by
# seed, at the south-east edge of the city on ground the tile reads at 3 to
# 4 m, its lanes turned with the city's streets. its place is a choice.
#
# the time of day: this file is the dusk, the sun by its working. the
# `timeofday` key is read and nothing uses it, so the sun block says where
# the sun is, and the file cannot say a night.
#
# the sun: a choice of this set, which is a made city and not a survey of
# one: low over the water at the end of the city's long alleys, so that
# the first camera, which looks along them, has it in front, 2.37 degrees
# over the horizon at azimuth 247.73. the numbers are the ones
# scene/daylight.Sun, noaa's fractional-year equations, gives for 22.5238
# north, 114.0209 east at 17:25 china standard time (utc+8) on 20 november
# 2026, geometric and without refraction, so the sun block says them
# outright and the `timeofday` below is the hour they come from; the set's
# reader keeps `timeofday` and nothing uses it yet. the city's long alleys
# are turned to run along that bearing, so it is a choice that they do.
#
# the air: smog under a lid, thin air over it, fog in the streets, smoke
# from the boats and the cooking fires, steam from the vents and a deck of
# cloud; each is said, with where its numbers come from, in the weather
# block below.
#
# the film is the towers set's but for its exposure, which is left to
# slayer to meter under the sun and the sky.
#
# places of things are metres in the terrain window: east from its west
# edge, north from its south edge. a camera's at and look_at are east from
# the west edge, north as the window's northing less its 3000 m depth, and
# up from the lowest ground in the window, the water's nought here. a
# camera that stands off a thing stands off where the thing stands on the
# ground. the first camera is the one drawn; to draw another, name it.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  # the night: the set at sunset with no sun, light: none as the other
  # night sets have it, so the city is lit by its own lamps, lasers and
  # windows. this copy draws the
  # city at night; everything else is the sunset set's.
  name: neon street towers on the futian shore at night
  seed: 1
  light: none
  location:
    lat: 22.5238
    lon: 114.0209
  timeofday: 1725
  terrain:
    from: copernicus-glo30-n22-e114
    lat: 22.52
    lon: 114.02
    across: 4000
    down: 3000
    step: 10
    smooth: 60
  # the air. this city is a fiction and so is its weather: how much of each
  # air there is, how high and where it lies, how patchy it is and how many
  # plumes rise into it are this fiction's choices, said beside each, and
  # none is a day of the real shore's. what is not chosen is how each air
  # meets light, and those numbers are read:
  # - the smog's particles: albedo 0.89 and asymmetry 0.63 at 550 nm, the
  #   Continental model of Levy, Remer, Mattoo, Vermote and Kaufman 2007,
  #   Table 1; Angstrom exponent 1.4, Rome 2001 to 2005, "mostly local
  #   pollution", Kaufman and others, Table 1 (both as airs/earth.yaml
  #   reads them).
  # - nitrogen dioxide: 0.33 inverse megametres a part in a thousand million
  #   at 550 nm, the revised IMPROVE equation (Pitchford and others 2007, as
  #   the IMPROVE algorithm page of vista.cira.colostate.edu gives it); its
  #   blue and red are picks, said in session/atmosphere.go.
  # - soot's mass extinction, 10 square metres a gram, and organic smoke's,
  #   2.8: the same equation's elemental carbon and small organic mass.
  # - fine smoke's Angstrom exponent near two and fog's near nought (scene/
  #   medium/aerosol.go); droplets' asymmetry 0.85, the lobe Jendersie and
  #   d'Eon 2023 draw cloud with (improv/cloudsea/cloudsea.yaml).
  # - the plumes' rise and spread: Briggs 1975 and Martin 1976, in scene/
  #   medium/bent.go.
  #
  # this is the middle strength of three. the lighter air is the smog's,
  # the air over the lid's and the street fog's extinction, and the smog's
  # nitrogen dioxide, at half of what is written; the heavier at twice. the
  # plumes and the clouds are the same in all three.
  weather:
    # the wind is the sea's: 5 m/s from the north-east, off the shore.
    wind:
      from: {value: 45, unit: deg}
      speed: {value: 5, unit: m/s}
    # the smog: particles 0.001 a metre at 550 nm where it is thickest, a
    # visibility of 3.9 km by Koschmieder's 3.912 over it, with 600 parts in
    # a thousand million of nitrogen dioxide through them; whole to 170 m
    # and thinning to nothing at its lid, 250 m, so the roofs of the tallest
    # towers and their beams stand in the thinning top of it. chosen.
    smog:
      kind: prescribed-mist
      extinction: {value: 0.001, unit: m^-1}
      depth: {value: 250, unit: m}
      edge: {value: 80, unit: m}
      coverage: 1
      seed: 3
      asymmetry: 0.63
      angstrom: 1.4
      nitrogen-dioxide: {value: 600, unit: ppb}
    # the air over the lid: the smog's particles, a twentieth as thick, and
    # thinning to nothing by 1000 m. chosen.
    over the lid:
      kind: prescribed-mist
      extinction: {value: 0.00005, unit: m^-1}
      depth: {value: 1000, unit: m}
      coverage: 1
      seed: 4
      asymmetry: 0.63
      angstrom: 1.4
    # the street fog, the air the signs and lamps light: droplets 0.004 a
    # metre, a visibility of a kilometre, 40 m deep and whole to 25 m, in
    # patches 120 m across over four fifths of the streets. chosen.
    street fog:
      kind: prescribed-mist
      extinction: {value: 0.004, unit: m^-1}
      depth: {value: 40, unit: m}
      edge: {value: 15, unit: m}
      coverage: 0.8
      size: {value: 120, unit: m}
      seed: 5
      asymmetry: 0.85
      angstrom: 0
    # the clouds: a deck from 1800 to 3400 m, 0.006 a metre inside a body,
    # in bodies 900 m across over more than half the sky where it is
    # thickest. chosen. a seventh of the 0.04 first proved, since the
    # tracer scatters once: a body many optical depths through draws black
    # where a real one is grey with light scattered many times inside it.
    high cloud:
      kind: prescribed-cloud
      extinction: {value: 0.006, unit: m^-1}
      base: {value: 1800, unit: m}
      top: {value: 3400, unit: m}
      coverage: 0.55
      size: {value: 900, unit: m}
      seed: 9
      asymmetry: 0.85
  atmosphere:
    layers:
      # the smog lies level from the datum to its lid and out 4 km past the
      # window, thickest over the middle of the city and a tenth of that
      # 2.5 km off it, so the far bay toward the sun is clearer.
      smog:
        weather: smog
        extent: terrain
        albedo: 0.89
        base: {value: 0, unit: m}
        beyond: {value: 4000, unit: m}
        toward: {object: the alley eye, reach: {value: 2500, unit: m}, least: 0.1}
      over the lid:
        weather: over the lid
        extent: terrain
        albedo: 0.89
        base: {value: 0, unit: m}
        beyond: {value: 4000, unit: m}
      # the fog follows the ground, thick in the streets and nearly gone
      # 800 m off the middle of the city. its albedo is one, chosen: water
      # takes almost nothing of the visible across a droplet.
      street fog:
        weather: street fog
        extent: terrain
        albedo: 1
        toward: {object: the alley eye, reach: {value: 800, unit: m}, least: 0.03}
      # the cloud deck is thickest over the land east of the city and gone
      # 9 km off it, so the sky toward the low sun is open under it.
      cloud deck:
        weather: high cloud
        extent: terrain
        albedo: 1
        beyond: {value: 10000, unit: m}
        toward: {object: the roofs eye, reach: {value: 9000, unit: m}, least: 0}
  # the plumes, carried by the wind above. every amount is chosen. the
  # boats are stands, hundreds of them, and a plume is tied to one named
  # thing, so the boats' stacks and funnels have no plume here.
  plumes:
    # the village's cooking: 8 big flues in its 80 by 60 m, 3 m up, 0.4 m
    # across, 450 K at 2 m/s, 1.5 g of smoke a second each, mostly organic:
    # albedo 0.9, chosen. few and big, since each mouth costs every ray of
    # the picture on the processor tracer.
    village cooking:
      from: {object: the village, east: {value: 0, unit: m}, up: {value: 3, unit: m}, south: {value: 0, unit: m}}
      count: 8
      spread: {value: 45, unit: m}
      seed: 21
      mouth: {value: 0.4, unit: m}
      exit: {value: 2, unit: m/s}
      temperature: {value: 450, unit: K}
      air-temperature: {value: 293, unit: K}
      rate: {value: 1.5, unit: g/s}
      mass-extinction: {value: 2.8, unit: m^2/g}
      albedo: 0.9
      asymmetry: 0.63
      angstrom: 1.8
      reach: {value: 600, unit: m}
      lid: {value: 250, unit: m}
      source: "IMPROVE's small organic mass for the mass extinction; the rest chosen"
    # the street stalls: 12 more in the streets of shops, within 380 m of
    # the middle of the city.
    street cooking:
      from: {object: the alley eye, east: {value: 0, unit: m}, up: {value: 3, unit: m}, south: {value: 0, unit: m}}
      count: 12
      spread: {value: 380, unit: m}
      seed: 22
      mouth: {value: 0.4, unit: m}
      exit: {value: 2, unit: m/s}
      temperature: {value: 450, unit: K}
      air-temperature: {value: 293, unit: K}
      rate: {value: 1.5, unit: g/s}
      mass-extinction: {value: 2.8, unit: m^2/g}
      albedo: 0.9
      asymmetry: 0.63
      angstrom: 1.8
      reach: {value: 600, unit: m}
      lid: {value: 250, unit: m}
      source: "IMPROVE's small organic mass for the mass extinction; the rest chosen"
    # the steam: 16 vents in the streets, 0.6 m across, steam at 373 K at
    # 3 m/s, 80 g of water a second each, gone 60 m down the wind as it
    # dries. a droplet of 5 um radius, by the extinction of a large sphere,
    # twice its area, meets 3 x 2 / (4 x 1e6 g m^-3 x 5e-6 m) = 0.3 square
    # metres a gram (worked; the factor two is not read here).
    street steam:
      from: {object: the alley eye, east: {value: 0, unit: m}, up: {value: 0.5, unit: m}, south: {value: 0, unit: m}}
      count: 16
      spread: {value: 380, unit: m}
      seed: 23
      mouth: {value: 0.6, unit: m}
      exit: {value: 3, unit: m/s}
      temperature: {value: 373, unit: K}
      air-temperature: {value: 293, unit: K}
      rate: {value: 80, unit: g/s}
      mass-extinction: {value: 0.3, unit: m^2/g}
      albedo: 1
      asymmetry: 0.85
      angstrom: 0
      reach: {value: 60, unit: m}
      lid: {value: 250, unit: m}
      source: "worked for 5 um droplets; the amounts chosen"
  # three beams fanned over the bay from the roofs of three towers on the
  # seaward front. each exit is 3 m over the highest thing on its roof, so
  # that the launch tube lies on the roof and the beam is not shut in by
  # it: a beam from inside a roof is shadowed by it and does not draw. the
  # roofs were read off a level picture of each tower built from its own
  # recipe and seed, to about a metre: 228 m on tower 100, 236 m on tower
  # 113 and 229 m on tower 033, over each tower's own ground. the aims,
  # radius, divergence, reach, wavelengths and strengths are all choices.
  # offsets are east, up and south of the tower's origin.
  lasers:
    # a fan of fifteen beams from the roof of tower 113, one launcher.
    # the set language says a beam at a time, so the fan is written out;
    # a `fan` form (a centre pointing, a spread, a count and a range of
    # wavelengths) would say it in one block. the pointings: azimuth
    # 3.2 degrees apart about 247.73 (the way the alleys and the sun lie),
    # so the fan spans 44.8 degrees; altitude -3 at the middle beam,
    # rising by 8 degrees times the square of the beam's place from the
    # middle (as a share of the seven either side), so the outer beams
    # rise 5 degrees and the fan arches. the wavelengths step by 17.5 nm
    # from 405 to 650, violet at the left (south), red at the right, the
    # order of the spectrum. radius, divergence, reach and strength are as
    # the three beams were: choices. the low middle beams stay in the haze
    # for kilometres; the outer ones climb out of it.
    fan 00: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 225.3, altitude: 5}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 405, unit: nm}, display-strength: 10000000000}
    fan 01: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 228.5, altitude: 2.9}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 423, unit: nm}, display-strength: 10000000000}
    fan 02: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 231.7, altitude: 1.1}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 440, unit: nm}, display-strength: 10000000000}
    fan 03: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 234.9, altitude: -0.4}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 458, unit: nm}, display-strength: 10000000000}
    fan 04: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 238.1, altitude: -1.5}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 475, unit: nm}, display-strength: 10000000000}
    fan 05: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 241.3, altitude: -2.3}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 493, unit: nm}, display-strength: 10000000000}
    fan 06: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 244.5, altitude: -2.8}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 510, unit: nm}, display-strength: 10000000000}
    fan 07: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 247.7, altitude: -3}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 528, unit: nm}, display-strength: 10000000000}
    fan 08: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 250.9, altitude: -2.8}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 545, unit: nm}, display-strength: 10000000000}
    fan 09: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 254.1, altitude: -2.3}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 563, unit: nm}, display-strength: 10000000000}
    fan 10: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 257.3, altitude: -1.5}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 580, unit: nm}, display-strength: 10000000000}
    fan 11: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 260.5, altitude: -0.4}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 598, unit: nm}, display-strength: 10000000000}
    fan 12: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 263.7, altitude: 1.1}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 615, unit: nm}, display-strength: 10000000000}
    fan 13: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 266.9, altitude: 2.9}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 633, unit: nm}, display-strength: 10000000000}
    fan 14: {origin: {object: tower 113, east: {value: 0, unit: m}, up: {value: 240, unit: m}, south: {value: 0, unit: m}}, launcher: true, pointing: {azimuth: 270.1, altitude: 5}, radius: {value: 0.25, unit: m}, reach: {value: 2500, unit: m}, divergence: {value: 0.03, unit: deg}, wavelength: {value: 650, unit: nm}, display-strength: 10000000000}
  film:
    width: 960
    height: 540
    rays: 2
    wide: 70
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # the first camera is the one drawn: from the city, over its roofs, out
    # to the bay and the low sun. it stands 320 m up over the ground 560 m
    # east of the middle of the city and looks along the bearing of the sun
    # (the bay marker lies on 247.2 degrees from it, the sun on 247.73),
    # tipped 15 degrees down.
    above:
      title: "from 320 m over the ground east of the city, over the roofs to the bay and the low sun"
      orientation:
        point_to: the bay
        alpha: -15
      location:
        loc_relative:
          object: the roofs eye
          standoff_x: 0
          standoff_y: 0
          standoff_z: 320
    # still (a), out from the city over the mangrove belt to the sun on the
    # water and the boats: 190 m up over the cross street between the two
    # front rows of towers, in the alley that runs at v -25 (u 336), looking
    # along the alleys' bearing, 247.7 degrees, tipped 5 degrees down. the
    # sun, 2.37 degrees over the horizon on that bearing, stands 7.5 degrees
    # over the middle of the frame. the bridge of buildings lies to the
    # right of its line.
    outlook:
      title: "out from the city, 190 m up over its seaward front, along the alleys over the mangroves to the sun on the water and the boats"
      location:
        at: [1793.3, -1230, 190]
      orientation:
        look_at: [437.8, -1783.1, 60]
    # (a) from further back: 320 m up over the ground 560 m behind the
    # city (u -560, v 0), along the same bearing, tipped 5 degrees down, so
    # that the city's roofs are the foreground and the fan of beams, which
    # leaves tower 113 at u 264, is 820 m away and ahead of it.
    rear:
      title: "out over the city from 320 m up behind it, along the alleys over the roofs, the mangroves, the sun on the water and the boats"
      location:
        at: [2613.1, -867.5, 320]
      orientation:
        look_at: [761.7, -1624.1, 145]
    # still (b), along the street at the landward edge of the belt, at eye
    # height, the mangroves on the left and the city's front on the right.
    promenade:
      title: "at eye height on the street along the mangrove belt, looking north-west along it with the trees on the left and the city on the right"
      location:
        at: [1803.9, -1414.8, 4]
      orientation:
        look_at: [1652.7, -1044.4, 6]
