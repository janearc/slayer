    ocean:
      material: seawater
      # a sea with no edge: the wave bands of the wind summed at every
      # point of the plane, so the water runs to the horizon and its waves
      # do too, with no square to end. the processor tracer draws it and
      # the exact-light path on the gpu refuses it. its mean face is 0.5 m,
      # as the sheet's was. glint is the sun's highlight from the slope the
      # bands do not resolve, so the bright path of the sun lies on the
      # water under the sun (Cox and Munk's total for the wind).
      unbounded: true
      middle: [1300, 1400, 0.5]
