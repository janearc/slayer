    # metres on the model's datum, the sea's mean face at 0.5.
    stands:
      # the boats: sampans, fishing boats and ferries, at anchor and under
      # way, each of the three designs the manufactory floats and each with
      # the lamps its kind shows (a green and a red side light and a white
      # stern light under way; one white light all round at anchor). a
      # stand of a kind that floats stands where the ground is under the
      # sea by its least water: this bay's ground is nought, the sea's face
      # 0.5 m over it, so 0.45 m puts a boat anywhere the ground is under
      # 0.05 m, and the mangroves, which stand where it is over 0.1 m, are
      # clear of them. each boat is drawn afresh, and turned any way. near
      # stands lie within 900 m of the near water marker, thick; far stands
      # within 2800 m of it, which is all the bay the window holds. the
      # counts, the mixture and the seeds are choices; the near boats are
      # made at the finest level, the far ones at `quick`.
