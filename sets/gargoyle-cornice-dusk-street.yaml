# a row of five gargoyles on a granite cornice wall, at dusk, with rain
# streaked down the wall under them by the world's weathering. each
# gargoyle is a creature of the catalogue, carved in stone as a part: the
# allosaurus, the orca and the squid, drawn for its place along the wall by
# the seed. made by the manufactory's kind gargoyle-cornice-granite, from
# manufacture/cities/cultures/gargoyle.yaml. for concrete, name
# gargoyle-cornice-concrete.
#
# places are metres, x east, y north, z up. the wall's face looks south, to
# negative y, and its middle is the origin. the sun, the ground and the
# cameras are choices of this study, picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: gargoyle-cornice-dusk
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # from the pavement across the street, looking up at the whole row.
    street:
      title: "from the street, looking up at the row"
      wide: 56
      location:
        at: [2, -27, 1.7]
      orientation:
        look_at: [0, 0, 11.5]
  set:
    things:
      cornice:
        kind: gargoyle-cornice-granite
        seed: 11
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.05, 0.05, 0.052]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [0, 0, -1.06]
        size: [3000, 3000, 2]
        source: eye
    suns:
      dusk:
        toward: [-0.62, -0.75, 0.16]
        colour: {srgb_linear: [2.6, 1.35, 0.6]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.34, 0.16, 0.11]}
      zenith: {srgb_linear: [0.02, 0.03, 0.09]}
      ground: {srgb_linear: [0.03, 0.028, 0.022]}
      source: eye
    weathering:
      source: eye
      seed: 3
      age: 60
      ground: 0
      probe: 0.03
      block: 2
      wind: [1, 0, 0]
      agents:
        rain:
          kind: rain
          on: [wall]
          colour: {srgb_linear: [0.02, 0.019, 0.018]}
          strength: 0.8
          settle: 15
          level: 0.2
          length: 3.5
          spacing: 0.5
          share: 0.8
        soot:
          kind: soot
          on: [wall]
          colour: {srgb_linear: [0.012, 0.011, 0.01]}
          strength: 0.6
          settle: 25
          reach: 5
          share: 0.4
          grain: 0.8
          shelter: 2.5
          catch: 0.5
