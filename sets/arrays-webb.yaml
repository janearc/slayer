# Webb's solar array from under the shield, on the sun's side. The set's
# axes are east x, north y, up z; Webb's own are x, up y, and aft z, so
# its aft is south here and its sun side is down. One camera, so a
# picture before a change and a picture after it can be set side by side.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Webb's solar array, from the sun's side
  seed: 17
  setting: space
  light: sun
  # from below the shield, so the sun side is lit
  sun: {azimuth: 200, altitude: -40}
  set:
    things:
      webb:
        kind: webb
        seed: 5
        complexity: quick
        east: 0
        north: 0
  film:
    width: 1600
    height: 900
    rays: 2
    exposure: 0.01
    wide: 45
  cameras:
    array:
      title: the five panels from the sun's side
      location: {at: [7, -11, -9]}
      orientation: {look_at: [1.3, -4, -1.2]}
  world:
    unit: 1
    sky:
      horizon: {srgb_linear: [0, 0, 0]}
      zenith: {srgb_linear: [0, 0, 0]}
      ground: {srgb_linear: [0, 0, 0]}
      source: eye
