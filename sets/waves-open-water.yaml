"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
# proof (a): low over open water toward a low sun. the sea with no edge, a
# 7 m/s wind over a long fetch, its glint Cox and Munk's; the sun 4 degrees
# up in the west, the camera 2 m over the mean looking at it. every number
# here is picked for the proof; no measurement stands behind them.
scene:
  name: open water toward a low sun
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 270, altitude: 4}
  film:
    width: 1600
    height: 900
    rays: 2
    exposure: 1102
    wide: 40
  world:
    unit: 1
    materials:
      seawater:
        clear:
          through: 1
          index: 1.333
          gloss: 1
          rank: 0
          extinction-per-metre: [0.2656, 0.0584, 0.0141]
        source: "pure seawater, as honopu.yaml has it: Pope and Fry 1997, Morel 1974, from oceantex"
    ocean:
      material: seawater
      unbounded: true
      middle: [0, 0, 0]
      sea:
        wind: {value: 7, unit: m/s}
        fetch: {value: 500000, unit: m}
        depth: {value: 0, unit: m}
        toward: {value: 0, unit: rad}
      seed: 7
      time: {value: 0, unit: s}
      source: "picked: a 7 m/s wind toward the east, fully grown deep sea"
      glint: {model: cox-munk}
  cameras:
    low:
      title: "2 m over the sea, west into the low sun"
      location: {at: [0, 0, 2]}
      orientation: {look_at: [-500, 0, -15]}
