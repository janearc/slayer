# the signs detail study, sheet one, awnings: two awnings seen square-on,
# raised to the height a person walks under, a canopy of striped cloth on
# ribs, stays and plates, a valance with the words of a trade painted on it
# and warm lamps under its edge (sign-awning seed 3), and one whose letters
# are lit channel letters (sign-awning seed 12), from manufacture/cities/
# signdraw.go, drawn from manufacture/cities/cultures/sign.yaml. the wall
# they hang from is not drawn.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the signs' own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the street, the lamp and the camera are choices of this study.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: signs detail sheet one awnings
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 60
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    square:
      title: "square-on, 27 m off, at the height of the awnings"
      location:
        at: [0, -27, 3.5]
      orientation:
        look_at: [0, 0, 3.5]
  set:
    things:
      painted: {kind: sign-awning, seed: 3, complexity: quick, east: -7, north: 0, height: {value: 2.8, unit: m}, heading: {value: 0, unit: deg}}
      lit: {kind: sign-awning, seed: 12, complexity: quick, east: 7, north: 0, height: {value: 2.8, unit: m}, heading: {value: 0, unit: deg}}
  world:
    unit: 1
    lamps:
      plain-dim:
        at: [0, -27, 14]
        temperature: 5000
        strength: 1450
        radius: 0.5
        source: eye
    materials:
