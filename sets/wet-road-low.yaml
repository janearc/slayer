# low over a puddle at night: the street, panels and wetness of
# wet-road-puddled, with the camera twenty-five centimetres above the road,
# a metre and a half behind a puddle that lies a little right of the
# middle, three metres south of the street's middle (the puddle's place is
# from the seed, found by making the street and reading its water). a
# puddle is flat, so it mirrors the panels whole, and sharply; the road
# round it mirrors them smeared.
#
# places are metres, as a map's run: x east, y north, z up. every number
# is a choice of this study, picked by eye, and says so.
