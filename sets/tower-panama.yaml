# tower panama: a cluster of slender twisting towers packed close on a
# shore, as the glass towers of Panama City are, with floors that rotate
# as they rise, as the F&F Tower's do. every tower is a rounded plan
# twenty two metres across, mirror glass, cut into blocks of four storeys
# each turned three degrees on the one below; the heights and the tints
# differ. at dusk into night. made by the cities package
# (manufacture/cities) from manufacture/cities/cultures/tower.yaml.
#
# places are metres, as a map's run: x east, y north, z up. the sea is
# south of y = 0 and the land north of it. the towers' places, the sea,
# the sun, the sky and the camera are choices of this study, picked by
# eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower panama
  setting: space
  light: none
  film:
    width: 960
    height: 540
    rays: 2
    wide: 50
    exposure: 1
    print:
