# tower cyberpunk: a street canyon of plain towers wearing the cyberpunk
# layer, looked up at from the street at night. each tower is a plain block
# of concrete, mirror glass or granite with the layer over its skin:
# greebles stuck to the walls, stacked signs and screens that are also
# lights, bands of light up the corners, wet surfaces and searchlights on
# the roofs. the searchlights are lit heads only: no haze is drawn, so no
# beam shows. made by the cities package (manufacture/cities) from
# manufacture/cities/cultures/tower.yaml.
#
# places are metres, as a map's run: x east, y north, z up. two rows of
# towers face each other across a street fifty metres wide. the street,
# the moon, the sky and the camera are choices of this study, picked by
# eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower cyberpunk
  setting: space
  light: none
  film:
    width: 960
    height: 540
    rays: 2
    wide: 62
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    street:
      title: "in the street, looking up the canyon"
      location:
        at: [4, -150, 1.7]
      orientation:
        look_at: [0, 120, 85]
  recipes:
    concrete: {kind: tower, irregularity: 0, pins: {plan: rectangle, skin: concrete, cyber: true, storeys: 56, width: {value: 38, unit: m}, taper: false, twist: false, setbacks: false, spire: false}}
    mirror: {kind: tower, irregularity: 0, pins: {plan: rectangle, skin: mirror, cyber: true, storeys: 70, width: {value: 38, unit: m}, taper: false, twist: false, setbacks: false, spire: false}}
    granite: {kind: tower, irregularity: 0, pins: {plan: rectangle, skin: granite, colour: grey, cyber: true, storeys: 62, width: {value: 38, unit: m}, taper: false, twist: false, setbacks: false, spire: false}}
