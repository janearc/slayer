# the neon street: one street at night that every part of the shot stands
# in. a block of towers carrying signs on their roofs and sides, a street
# of buildings lashed together with rows of lanterns across it, shops at
# the foot of the buildings, and the road wet with rain.
#
# first assembly. each part is the kind its own study drew, set down on one
# street; nothing here is tuned. what the shot wants and this does not have
# yet: light in the air, so the sky is black; the moon; shops in the foot of
# the towers themselves, where here they stand in plain blocks south of
# them.
#
# places are metres, as a map's run: x east, y north, z up. the street runs
# north, twelve metres from wall to wall, its walls at x of six either
# side. from the south: the shops, from y of -124 to -78; the towers, from
# -76 to 0; the lashed street, from 4 to 100. every number is a choice of
# this study, picked. the first camera is the one drawn; to draw another,
# put it first.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: neon street
  # the seed slayer draws with when a set names none, said so that the
  # working display, which wants it said, makes the things the render does
  seed: 1
  setting: space
  light: none
  film:
    width: 960
    height: 640
    rays: 2
    wide: 70
    exposure: 4
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    above:
      title: "from above the south end, the whole street laid out"
      wide: 60
      location:
        at: [0, -190, 120]
      orientation:
        look_at: [0, 0, 10]
    down-the-street:
