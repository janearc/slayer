      rim g:
        kind: spruce
        seed: 27
        east: 264843
        north: 2147802
      # improv: more along the rim across the moon's bearing, 24 to 48 m
      # either side of the far tree, to stand against the disc
      rim h:
        kind: spruce
        seed: 28
        east: 264816.2
        north: 2147760.8
      rim i:
        kind: spruce
        seed: 29
        east: 264818.8
        north: 2147768.4
      rim j:
        kind: spruce
        seed: 30
        east: 264821.4
        north: 2147775.9
      rim k:
        kind: spruce
        seed: 31
        east: 264824.1
        north: 2147783.4
      rim l:
        kind: spruce
        seed: 32
        east: 264839.9
        north: 2147828.6
      rim m:
        kind: spruce
        seed: 33
        east: 264842.6
        north: 2147836.1
      rim n:
        kind: spruce
        seed: 34
        east: 264845.2
        north: 2147843.6
      rim o:
        kind: spruce
        seed: 35
        east: 264847.8
        north: 2147851.2
    stands:
      # improv: 400, not 150, and none alight
      the east rim:
        kind: spruce
        count: 400
