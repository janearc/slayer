# lashings, at 0.6: a 12 m street between two rows of plain six-storey
# blocks, at night, hung with a good many cables, lanterns and banners.
# made by the cities package (manufacture/cities, Lashings), through the
# manufactory's kind lashed-street, from
# manufacture/cities/cultures/lashings.yaml.
#
# places are metres, x east, y north, z up; the street runs north and
# south, 96 m long, centred on the origin. there is no sun and no sky:
# the light is the windows, the lanterns and the banners. the ground, the
# exposure and the cameras are choices of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: lashings-street-06
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 4
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # at the south end of the street at eye height, looking up it.
    down-the-street:
      title: "down the street at eye height, density 0.6"
      location:
        at: [0, -46, 1.7]
      orientation:
        look_at: [0, 48, 12]
  recipes:
    hung:
      kind: lashed-street
      density: 0.6
  set:
    things:
      the street:
        recipe: hung
        seed: 7
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      road:
        colour: {srgb_linear: [0.02, 0.02, 0.022]}
        source: eye
    boxes:
      ground:
        material: road
        middle: [0, 0, -1]
        size: [400, 400, 2]
        source: eye
