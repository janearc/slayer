# portofino: the harbour, and the painted houses on the slopes round it.
#
# the ground. copernicus glo-30, tile n44 e009 (1 arc-second, posts about
# 22 m east to west and 31 m north to south here), a surface model: it
# holds the tops of what stands there, roofs and trees, and not the bare
# earth, and it holds the sea at nought. the window is 2400 m across and
# 1700 m down at a 5 m step, bilinear between the posts and not smoothed: a
# 20 m smoothing takes half the harbour's water away (22000 square metres
# of water in the harbour's box, 11000 smoothed). the harbour is 1300 m
# from the window's west edge and 600 m from its south edge, at 44.3022
# north, 9.2118 east; the window's middle is 44.30445 north, 9.21055 east,
# worked from that: 1200 m east and 850 m north of the window's south-west
# corner, which puts the harbour 100 m east of the middle and 250 m south
# of it. the ground is cut in a wall at the window's edge, and the camera
# `high` sees it, since a camera high enough sees any edge a window has.
# the window is placed round the harbour the heights show: the water is
# where they fall to nought, and the ground climbs on the sides the next
# paragraph names.
#
# what the heights say. the water of the harbour is a basin about 260 m
# across, east to west, and 100 m from its head to its mouth, its head at
# 605 m north in the window and its mouth, between a low tongue of land on
# the north and the east headland, at about 725 m north, open to the
# north-east. the ground is 0 to 3 m over a strip along the head, climbs
# to 10 m within 35 to 55 m of the water on the west, and to 40 m within
# about 100 m on the east. over the slopes that fall toward the water the
# rise is 0.4 to 0.5 in a metre on average, and 0.78 at the steepest, on
# the east side of the head.
#
# the sea. world.ocean, one static instant of the wave cascades laid over
# the harbour and the sea off it, with its mean face at 0.5 m on the
# model's datum: the model holds the water at nought and has no depth under
# it, so the floor is the ground at nought and the face is half a metre
# over it, picked. it is the sea with no edge: the ocean says no extent
# and no samples, so its waves run to the horizon. the ground's own `sea`
# is the same level, 0.5 m, since the cover is laid from it and the two
# are one water. the language has one ocean to a set, one wind and one
# fetch over the whole plane, so the basin of the harbour, which a
# headland shelters, and the open sea off its mouth have the same waves
# here; they cannot differ.
#
# the wind: 4 m/s from the north-east, a light breeze, up the harbour's
# mouth; every number is a choice and says so beside it in the ocean block,
# and no measurement stands behind them. the fetch is the distance over
# water, along the wind's line, to the first land the tile shows: from
# just outside the harbour's mouth it is 4950 m along 30 degrees from
# north and 5980 m along 60, so 5000 m is taken for the wind from 45. the
# depth is 0, which is deep water, since the tile gives no bed under the
# water and a sea of 4 m/s waves is deep in 10 m of it.
#
# made ground and cover. `made` lays ground finer than the 5 m window
# where the camera resolves finer, its roughness the survey's own read
# over seven and thirteen samples, 35 and 65 m at this step; this survey
# is 30 m posts drawn bilinear at 5 m, so the roughness it reads is the
# model's, smoothed, and less than the ground's. no flutes or beds are
# asked. the seed is picked. the cover is rock under all and green over
# it where gentle and above the shore, by the reasons sets/honopu.yaml
# gives for its grass: soil stands to about 35 to 40 degrees (0.7 to
# 0.84), picked on that; the foot, 4 m over the sea, is picked. the
# cover's sea is the terrain's own `sea`. the colours are the swatches',
# unmeasured.
#
# the sun. scene/daylight.Sun, noaa's fractional-year equations, for
# 44.3022 north, 9.2118 east, at 07:30 local summer time (utc+2) on 21
# june 2026: azimuth 73.64, altitude 17.09, geometric, without refraction.
# the set says the date, the clock and its offset from utc, and the reader
# works the sun from them. the sky and the air are the earth's, worked from
# that. the day and the
# hour are a choice: the sun, low in the east-north-east, lights the
# faces that look east and, grazing, those that look north.
#
# the houses. the kind terrace-portofino, from
# manufacture/cities/cultures/portofino.yaml: fourteen bays to a terrace,
# each bay its own number of storeys, and its colour drawn from that
# culture's palette of red, ochre, yellow, pink and cream, so that no
# bay has the colour of the one beside it. no house is coloured here.
# four stands of the habit `contour` lay rows along the contours of the
# slopes that face the harbour: the south, which is the head, fronts to
# the north; the east flank, fronts to the west; the west flank, fronts
# to the east; and the north ledge, fronts to the south. each stand's
# first row starts at "the foot" of its stand, which is the back corner
# of its first terrace, and is a place picked from the heights (the front
# wall of the first row a few metres from the water's edge). each run is
# turned to the ground's contour where it stands, and each bay is founded
# on the ground under it.
#
# the quay. seventeen boxes, each a chord of the harbour's shore, 6 m
# across, its near edge on the shore and its length that of its chord and
# 3 m more, so that two meet at a bend. each has a heading, so the run
# follows the shore where the shore is not along east and west. the shore
# is where the model's heights first rise to the sea's face, 0.5 m, read
# along rays from the harbour's middle, and each chord is joined by eye
# from those points: the 5 m posts hold the shore within about 15 m. the
# top of every box is 1.5 m over the nought of the model, 1 m over the sea.
#
# the boats. sampan-at-anchor and fishing-boat-at-anchor are the
# manufactory's small boats, and are not Ligurian boats: five sampans of 5
# to 8 m and two steel fishing boats of 15 to 25 m, in the basin, each laid
# on the water at least 15 m from the shore the tile shows. they are at
# anchor, bows into the wind, which is from the north-east: 45 degrees
# clockwise from north, the same for all. a boat stands at the sea's mean
# height, 0.5 m. no ferry: it is much longer than the basin's other boats,
# so it is not a small boat.
#
# places of things are metres in the terrain window: east from its west
# edge, north from its south edge. a camera's at and look_at are east from
# the west edge, north as the window's northing less its 1700 m depth, and
# up from the lowest ground in the window, the water's nought.
