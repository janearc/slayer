      # the promontory's own trees, sown by rule: holm oak and tree heath,
      # which the marine reserve's coastal handbook names together in the
      # holm oak wood that comes near the sea (manufacture/plants/seasonal/profiles.yaml
      # cites it). each stand grows from its seed over the ground 150 to
      # 1200 m from the head of the harbour, above 30 m, so the town's rows
      # below are left bare, and no steeper than its steepest, rise over run.
      # the heath, a shrub of the maquis, is let onto steeper and higher
      # ground than the oak. the floor, the distances and the steepness are
      # picked. the ground is a surface model that already holds the tops of
      # the trees that stand there, so these stand on that canopy, not under it.
      #
      # how many. a forty-year holm oak coppice in sicily holds 1496 holm oak
      # stools a hectare, 10.4 m tall on average, under a crown cover of 97%
      # (iforest 11: 344-351, doi 10.3832/ifor2424-011, table 1, plot a4). a stool
      # there is a few slim shoots; a holm oak here is one tree whose crown is
      # about 11 m across (the study's draw, measured by eye), 95 square
      # metres, so 97% cover is about 100 of them a hectare. the ground these
      # stands may grow on, inside the window, over 30 m and gentle enough, is
      # not measured; it is guessed at about 150 hectares, so 15000 oaks. the
      # heath fills under and between them, a third as many again, picked.
