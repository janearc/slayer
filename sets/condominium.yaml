# a condominium: two to four buildings of four or five storeys of stacked
# flats round a shared paved court, each with a stair core standing a
# little proud of its front, seen from the south at eye height and from
# higher up. made by the cities package (manufacture/cities), through
# the manufactory's kind condominium, from
# manufacture/cities/cultures/condominium.yaml.
#
# places are metres, as a map's run: x east, y north, z up. the court is
# centred on the origin. the sun, the ground and the cameras are choices
# of this study, picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: condominium
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # eye height, 70 m west of the court, looking in across it. the
    # buildings stand on the north, south and east sides of the court
    # for seed 4, so the west is its open side. south of it is the back
    # of the south building, which has no openings.
    ground:
      title: "from the west, at eye height, into the court"
      location:
        at: [-70, -8, 1.7]
      orientation:
        look_at: [10, 0, 8]
    # higher up, from the south-west, looking into the court
    above:
      title: "from higher up"
      location:
        at: [-60, -75, 45]
      orientation:
        look_at: [0, 0, 6]
  set:
    things:
      block:
        kind: condominium
        seed: 4
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      lawn:
        colour: {srgb_linear: [0.05, 0.075, 0.03]}
        source: eye
    boxes:
      ground:
        material: lawn
        middle: [0, 0, -1.06]
        size: [3000, 3000, 2]
        source: eye
    suns:
      west:
        toward: [-0.7, -0.6, 0.22]
        colour: {srgb_linear: [2.2, 1.3, 0.65]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.22, 0.14, 0.12]}
      zenith: {srgb_linear: [0.02, 0.035, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
