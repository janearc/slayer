# tower closeups: eight towers, one of each skin and one plain tower under
# the cyberpunk layer, each looked at close at dusk from two places: a
# facade from about twenty five metres away at mid-height, as from a
# neighbouring building, four storeys or so across the frame; and the foot
# of the tower from the street, looking along its base. The towers are the
# lineup's: forty storeys, a plain rectangle, same seed. The study is for
# seeing what each skin lacks up close: it fixes nothing.
#
# places are metres, as a map's run: x east, y north, z up. the towers
# stand a hundred and fifty metres apart along x. the sun, the sky and the
# cameras are choices of this study, picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tower closeups
  setting: space
  light: none
  film:
    width: 960
    height: 540
    rays: 2
    wide: 60
    exposure: 1
    print:
