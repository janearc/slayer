# a wet road at night: a twelve metre street of dark walls, with red, cyan
# and warm white panels glowing on them, as wet as rain leaves it. the
# road has a film of water over it, which mirrors the panels in long
# smears toward the camera, and, in its low places, puddles, which mirror
# them sharply. the panels are plain emitters: signs are another study.
#
# nothing lights the street but the panels. each is a glow box that is seen,
# and mirrored, and a lamp beside it that lights the walls and the ground
# near it, since a glow does not light its neighbours. a lamp is a black
# body, so the cyan panel's lamp is a hot white one, and the cyan itself
# comes from the glow.
#
# places are metres, as a map's run: x east, y north, z up. the street
# is centred on the origin and runs north and south. every number is a
# choice of this study, picked by eye, and says so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
