# the same frontage as street-retail.yaml, the camera close on the dive
# bar and the vending pair beside it. a set draws its first camera, so
# each view is its own file. see street-retail.yaml for what is picked by
# eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: street-retail-dive
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 62
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    dive:
      title: "the dive and the vending pair, from the pavement"
      location:
        at: [3.6, -6, 1.6]
      orientation:
        look_at: [3.6, 0, 1.5]
  set:
    things:
      frontage:
        kind: frontage
        seed: 33
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      pavement:
        colour: {srgb_linear: [0.035, 0.035, 0.04]}
        source: eye
      storeys:
        colour: {srgb_linear: [0.05, 0.05, 0.06]}
        source: eye
    boxes:
      ground:
        material: pavement
        middle: [20, 0, -1.01]
        size: [200, 200, 2]
        source: eye
      building:
        material: storeys
        middle: [20, 6.9, 21.7]
        size: [44, 14, 36.6]
        source: eye
    suns:
      moon:
        toward: [0.2, 0.6, 0.5]
        colour: {srgb_linear: [0.05, 0.065, 0.12]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.008, 0.012, 0.03]}
      zenith: {srgb_linear: [0.002, 0.004, 0.012]}
      ground: {srgb_linear: [0.004, 0.004, 0.004]}
      source: eye
