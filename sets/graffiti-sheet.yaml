# graffiti sheet: twenty-four plain walls hung in a grid, six across and
# four down, seen square-on like a contact sheet, each with its own writer
# or writers so that one wall is one example. Every wall has a material
# of its own, sheet-wall-NN-kind, and a writer's `on` is that name's
# number alone, so it writes on that wall and no other (a name holds a
# number once, and the numbers are two digits). Row one is tags, half a
# metre to a metre and a half; row two throw-ups, a metre and a half to
# three and a half; row three pieces, three and a half to six; row four
# walls with older, faded marks under newer ones.
#
# a writer's cells are laid along the world, one grain long and a
# squash of that tall, so each wall is cut to whole cells of its writer:
# its left edge stands on a multiple of the grain and its bottom on a
# multiple of the cell's height. The walls hang in the air; each
# writer's low and high are the wall's own heights above the ground at
# nought. Light is one even white sun from behind the camera and a
# plain sky, so the paint is what is seen. Walls are colours only: the
# stock has no brick or shutter texture, so a shutter is a dark metal
# colour. Places are metres, x east, y north, z up. Every number is a
# choice of this study, picked by eye. The first camera is the one
# drawn; row-one to row-four sets draw one row each, closer.
