# Borrowed Light: an authored, synthetic studio study, not a measured place.
# Coordinates are east, north, up in metres. The distant narrow spotlight is
# a conical point source; its attenuation and width change along its length.
# A spherical dust field scatters once, and a sphere crosses the cone in two
# seconds. The receiver and occluder are diffuse, not measured materials.
scene:
  name: borrowed-light-opening-study
  volume-illumination: {model: isotropic-single, sky-samples: 2}
  film:
    width: 360
    height: 320
    rays: 1
    wide: 55
    exposure: 1
    print: {knee: 0.8, top: 8, source: eye}
  cameras:
    observer:
      title: opening light study
      location:
        at: [0, -8, 1.5]
      orientation:
        look_at: [0, 0, -0.3]
  world:
    materials:
      black-object:
        colour: {srgb_linear: [0.08, 0.08, 0.08]}
        source: eye
      dark-receiver:
        colour: {srgb_linear: [0.12, 0.12, 0.12]}
        source: eye
    spheres:
      occluder:
        material: black-object
        middle: [0, 0, 0]
        radius: 0.32
        motion: crossing
        source: eye
    motions:
      crossing:
        seconds: 2
        ease: linear
        hold: true
        frames:
          - {percent: 0, at: [0, 0, 0.9]}
          - {percent: 50, at: [0, 0, 0]}
          - {percent: 100, at: [0, 0, -0.9]}
    boxes:
      receiver:
        material: dark-receiver
        middle: [0, 0, -2.05]
        size: [20, 20, 0.1]
        source: eye
    wisps:
      dust:
        colour: {srgb_linear: [0.8, 0.8, 0.8]}
        middle: [0, 0, 0]
        radius: 8
        thick: 0.16
        seed: 41
        scale: 8
        amount: 0.000001
        source: eye
    spots:
      shaft:
        at: [-9, 0, 6]
        aim: [9, 0, -6]
        cone: 0.8
        soft: 0.3
        temperature: 6000
        strength: 10000
        source: eye
