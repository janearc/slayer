# mangrove shore: a few hundred mangroves standing in the tidal band of a
# shore, the low native kinds seaward and the tall planted sonneratia behind
# them. the ground is noaa's cudem topobathy model of the bay at san
# francisco, as sets/sf-north-waterfront.yaml has it, with the bay filled to
# the sea at nought. the shore there is not a mangrove shore: this set tests
# the standing of mangroves in a height band above the sea, on ground that
# has one, and nothing more. the light is that set's, as it is.
#
# a stand grows only where the ground lies between its above and below, in
# metres on the model's datum, on which the sea is nought. the native stands
# lie between a tenth of a metre and a metre over the sea; the sonneratia
# between a metre and one and eight tenths. both bands are picked, from the
# study's notion of a shore between mean sea level and high water, and are
# not the tide's at shenzhen bay or anywhere. a stand's within keeps it to
# the shore north of the marina marker, out to 600 m, so the few hundred
# stand close enough to be seen as a strip. a stand makes four distinct
# trees and repeats them, so each kind has several stands, each of its own
# seed, and no two stands of a kind make the same trees.
#
# places are metres in the window: east runs 0 to 3900 from the west edge
# and north 0 to 2900 from the south edge.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: mangrove shore
  light: sun
  air: earth
  location:
    lat: 37.8025
    lon: -122.4255
  timeofday: 1650
  sun:
    azimuth: 245
