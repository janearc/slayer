    plant-kandelia-obovata: {plant: {family: seasonal, file: ../manufacture/plants/seasonal/profiles.yaml, species: kandelia-obovata}}
    plant-sonneratia-apetala: {plant: {family: seasonal, file: ../manufacture/plants/seasonal/profiles.yaml, species: sonneratia-apetala}}
