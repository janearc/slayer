# one steel fishing boat, large in frame, by day, at the fullest detail: from
# the quay side, from above, at its bow quarter for the number painted there,
# and from astern for its name. the air, the sun and the sea are those of
# sets/boats-by-day-fishing.yaml, which are those of sets/alfa-san-onofre.yaml;
# the sea's `direct-sun: mean-plane` is left out, as there, because a boat
# carries its lights.
#
# places are metres, x east, y north, z up. the boat's origin is at its
# waterline, so it stands at up 0, the sea's height, heading north, a choice.
# its port side faces the camera `quay`, 30 m west of it. the frames are set
# by a typical length, 20 m, and the boat's own may be a little more or less.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: one fishing boat by day
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 236.2, altitude: 13.4}
  film:
    width: 1280
    height: 720
    rays: 2
    exposure: 1102
    wide: 40
  world:
    unit: 1
    materials:
      seawater:
        colour: {srgb_linear: [0.01, 0.04, 0.06]}
        clear:
          through: 1
          index: 1.333
          gloss: 1
          rank: 0
          extinction-per-metre: [0.5, 0.1, 0.06]
        source: "synthetic extinction, not measured water; colour by eye"
    ocean:
      material: seawater
      middle: [-1500, 0, 0]
      sea:
        wind: {value: 7, unit: m/s}
        fetch: {value: 50000, unit: m}
        depth: {value: 0, unit: m}
        toward: {value: 0, unit: rad}
      seed: 7
      time: {value: 0, unit: s}
      source: "chosen: a moderate breeze off San Onofre, no shelf source"
  set:
    things:
      fishing boat: {kind: fishing-boat, seed: 3, complexity: demo, position: {east: {value: -1500, unit: m}, north: {value: 0, unit: m}, up: {value: 0, unit: m}}, heading: {value: 0, unit: deg}}
  cameras:
    quay:
      title: "from the quay side, 30 m off its port side and 4.5 m up"
      location: {at: [-1530, 0, 4.5]}
      orientation: {look_at: [-1500, 0, 2.2]}
    above:
      title: "from above and to its port, 26 m up"
      location: {at: [-1514, -3, 26]}
      orientation: {look_at: [-1500, 0, 1.5]}
    number:
      title: "at its bow quarter, where its number is painted"
      location: {at: [-1512, 14, 3.5]}
      orientation: {look_at: [-1500, 6, 1.2]}
    stern:
      title: "from astern, for its name"
      location: {at: [-1500, -26, 4]}
      orientation: {look_at: [-1500, -10, 1.8]}
