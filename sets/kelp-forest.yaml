# a kelp forest, under the surface: one hundred and forty-four giant kelp
# plants by seed standing on the floor twelve metres down, their canopy laid
# along the surface; an orca and a bay seal. three cameras: one low in the
# forest looking up through the plants to the surface, one at the animals,
# one along the forest's floor. the air a seal lets go is in
# sets/kelp-forest-bubbles.yaml: the tracer refuses mean-plane direct sun
# beside any other transparent boundary, and a bubble is one.
#
# the frame. places are metres, x east, y north, z up, mean sea at z=0.
# the floor is at z=-12, the file's depth for kelp (manufacture/algae/kelp/kelp.yaml),
# so a plant in the moderate-water forest reaches the surface from a
# thing set at up -12. the forest is 12 plants a side about the origin.
#
# the water. one clear medium, no tint: its colour is what its coefficients
# take out of the light by wavelength. the extinction is the sum of pure
# water's absorption and the part of its particles' scattering that turns
# light away, at the three wavelengths the tracer keeps (610, 550, 465 nm),
# per metre:
#   absorption of pure water, Pope and Fry 1997, Applied Optics 36, 8710,
#   read at omlc.org/spectra/water/data/pope97.txt: 0.2644, 0.0565, 0.01011
#   scattering of particles, b = 0.3 Chl^0.62 (550 / wavelength), the
#   Case 1 model of Morel and Maritorena 2001 as set out in the Ocean
#   Optics Web Book (oceanopticsbook.info, classic Case 1 IOP model), with
#   a chlorophyll of 0.5 mg per cubic metre, a coastal figure that is
#   picked: 0.1760, 0.1952, 0.2309
#   the share of it that is lost to the beam is one minus the mean cosine
#   of the phase function, the delta scaling of a forward-peaked phase
#   function (Joseph, Wiscombe and Weinman 1976: the formula is recalled,
#   the paper was not readable), because light scattered a few degrees keeps
#   going the way it was going. the mean cosine of the Petzold
#   average-particle phase function is 0.924 (read, Ocean Optics Web Book,
#   Petzold phase functions page), so the share lost is 0.076:
#   0.01338, 0.01484, 0.01755
#   sum with the absorption: 0.2778, 0.0713, 0.0277
#   (a diffuse attenuation, Kd, close to absorption over the mean cosine of
#   the downwelling light is what the Ocean Optics Web Book says; read.)
# what is left out, for want of a table to read: the absorption of the
# particles and of dissolved matter (needs the chlorophyll-specific
# absorption spectrum of Prieur and Sathyendranath 1981, only plotted in
# the page read), and the scattering of pure water.
#
# the scattering that is lost to the beam is given back to the look: the
# medium's `scatter` block carries the same 0.01338, 0.01484, 0.01755 with a
# phase of 0 (Rayleigh: nearly isotropic, the delta-scaled part is the
# turned-away light), and the sea says `diffuse-sky-samples: 8` and a
# `flat-mean` sea to infinity, which the sky's in-scatter needs, with the
# wind low (0.5 m/s) because the sun path's marcher refuses a rough finite
# sea at some samples. the honest pair, total extinction 0.4404, 0.2517,
# 0.2410 with the particles' b and a phase of 0.924, leaves the card at the
# floor at 0.3, 2.9 and 2.9 percent (measured): a surface is lit by the
# direct beam only, and the tracer returns scattered light to the look and
# not to a surface. so the scaled pair stays, and the two differ by a factor
# of 7 in red, 11 in green and 18 in blue at the floor. the sun's wave
# normals are not used (mean plane), so the floor takes no dapple from the
# waves.
#
# the light. a distant sun of the air's own spectrum, from an azimuth and
# altitude picked here, not worked from a clock. `direct-sun: mean-plane`
# refracts it into the water. the film's exposure is a camera setting and
# is set for the water: the meter gives 214.7 for a grey card in the sun
# in air (a card 0.18 level under this sun and sky), and sets/kelp-probe-air
# and sets/kelp-probe-water measure the same card twelve metres down at
# 2.2 percent of that in red and 32.5 and 51.1 percent in green and blue
# (these coefficients; the first, whole-scattering ones gave 0.3, 2.9 and
# 3.1), so a card on the floor wants about 214.7 / 0.33, 650.
#
# the fish are another worker's: they come at the merge, and their place is
# the open water between the forest's floor and its canopy, in the free
# volume around (0, 0, -6).
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: kelp forest
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 200, altitude: 60}
  film:
    width: 640
    height: 360
    rays: 1
    exposure: 650
    wide: 70
  world:
    unit: 1
    materials:
      seawater:
        colour: {srgb_linear: [0, 0, 0]}
        clear:
          through: 1
          index: 1.333
          gloss: 1
          rank: 0
          extinction-per-metre: [0.2778, 0.0713, 0.0277]
          scatter:
            coefficient-per-metre: [0.01338, 0.01484, 0.01755]
            phase-g: 0
            steps: 24
            max-distance: {value: 40, unit: m}
        source: "pure water absorption, Pope and Fry 1997; particle scattering, Morel and Maritorena 2001 Case 1 model at a picked 0.5 mg/m3 chlorophyll, counted as loss by its share turned away, one minus the Petzold mean cosine 0.924"
      sand:
        colour: {srgb_linear: [0.30, 0.25, 0.17]}
        source: eye
    ocean:
      material: seawater
      middle: [0, 0, 0]
      extent: {value: 512, unit: m}
      samples: 257
      sea:
        wind: {value: 0.5, unit: m/s}
        fetch: {value: 50000, unit: m}
        depth: {value: 0, unit: m}
        toward: {value: 0, unit: rad}
      seed: 11
      time: {value: 0, unit: s}
      source: "picked: a light breeze, no shelf source"
      flat-mean:
        mean-level: {value: 0, unit: m}
        collar-width: {value: 64, unit: m}
        extends-to-infinity: true
      direct-sun: mean-plane
      diffuse-sky-samples: 8
    boxes:
      floor:
        material: sand
        middle: [0, 0, -12.05]
        size: [400, 400, 0.1]
        source: eye
  recipes:
    profile-kelp: {alga: {family: kelp, file: ../manufacture/algae/kelp/kelp.yaml, species: macrocystis-pyrifera, condition: moderate, forest: true}}
    profile-orca: {animal: {family: whale, file: ../manufacture/animals/vertebrates/mammals/whales/profiles.yaml, species: orca, pose: swim}}
    profile-harbor-bay: {animal: {family: pinniped, file: ../manufacture/animals/vertebrates/mammals/pinnipeds/profiles.yaml, species: harbor-seal, study: bay}}
  set:
    things:
      forest:
        recipe: profile-kelp
        seed: 1
        position:
          east: {value: 0, unit: m}
          north: {value: 0, unit: m}
          up: {value: -12, unit: m}
      orca:
        recipe: profile-orca
        seed: 1
        position:
          east: {value: 10, unit: m}
          north: {value: 6, unit: m}
          up: {value: -6, unit: m}
        heading: {value: 120, unit: deg}
      seal:
        recipe: profile-harbor-bay
        seed: 1
        position:
          east: {value: -7, unit: m}
          north: {value: -2, unit: m}
          up: {value: -9, unit: m}
        heading: {value: 60, unit: deg}
  cameras:
    up:
      title: "low in the forest, looking up through the plants to the surface"
      location: {at: [-4, -16, -11]}
      orientation: {look_at: [0, 2, -2]}
      initial-media: [seawater]
    edge:
      title: "from the open water beside the forest, up at the window and the kelp's edge"
      location: {at: [-29, 0, -11]}
      orientation: {look_at: [-22, 0, -2]}
      initial-media: [seawater]
    animals:
      title: "from the forest's edge, at the orca and the seal"
      location: {at: [2, -24, -8]}
      orientation: {look_at: [2, 2, -7.5]}
      initial-media: [seawater]
    floor:
      title: "along the forest's floor"
      location: {at: [-20, -14, -11]}
      orientation: {look_at: [14, 6, -10.5]}
      initial-media: [seawater]
