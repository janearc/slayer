# the north waterfront of san francisco, from the marina to telegraph hill:
# lyon street east to the hill, the bay south to california street, 3.9 by 2.9
# km, at dusk. the ground is noaa's cudem topobathy model of the bay (1/9
# arc-second, about 3 m on the ground, the land and the floor of the bay under
# it), cut to a 3 m step, with the bay filled to the sea at nought. the
# buildings are laid by the grid habit: blocks of about 125 by 85 m between
# streets 18 m wide, the grid turned 2.5 degrees off true north, and on each
# long side of every block a row of fifteen lots fronting its street, each
# lot of an era of its own. every row stands on the ground under it, on a
# plinth to the lowest of it. condominiums stand about two discs where the
# grid leaves the ground to them. the piers are the cities package's pier
# kind, stood at the shore of the wharf.
#
# places are metres in the window: east runs 0 to 3900 from the west edge and
# north 0 to 2900 from the south edge. its middle, 37.8025 north and
# 122.4255 west, is 1950 east and 1450 north. the markers stand where the
# quarters are, taken from their streets on a map; a marker is a person's
# height and is there only for a camera to look at and a disc to be laid
# about. the grid stands fill boxes of the window that meet along the streets
# that bound the quarters, so that no block is in two of them: the marina,
# cow hollow and pacific heights west of van ness, russian hill and polk
# between it and mason street, and north beach and telegraph hill east of
# that. the grid's turn is picked, not measured from the terrain.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: san francisco north waterfront
  light: sun
  air: earth
  location:
    lat: 37.8025
    lon: -122.4255
  timeofday: 1650
  # picked: on the horizon in the west-south-west, as the sun stands at
  # dusk in november. it is not worked from the date.
  sun:
    azimuth: 245
    altitude: 3
  terrain:
    from: noaa-cudem-sf-ncei19-n38x00-w122x50-2022
    lat: 37.8025
    lon: -122.4255
    across: 3900
    down: 2900
    step: 3
    # the sea, at nought on the model's datum, fills the bay
    sea: {value: 0, unit: m}
  film:
    width: 720
    height: 480
    rays: 2
  cameras:
    bay:
      title: "from the bay, a pier on piles and the waterfront behind it"
      orientation:
        point_to: pier 39
