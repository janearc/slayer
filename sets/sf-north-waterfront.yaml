      location:
        loc_relative:
          object: pier 39
          standoff_x: -330
          standoff_y: 230
          standoff_z: 38
    plan:
      title: "the whole area from the south and high above, looking north"
      # a place is east, north and up of the window's north west corner's
      # own frame: the terrain's frame runs south from its north edge, so
      # a northing here is the window's less its 2900 m depth
      orientation:
        look_at: [1950, -1600, 0]
      location:
        at: [1950, -3700, 1100]
    street:
      title: "down a pacific heights street at eye height, toward the bay"
      orientation:
