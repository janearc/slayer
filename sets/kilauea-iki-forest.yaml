# kīlauea iki at night, a thousand trees on its rims and a dozen of them
# alight, seen across the crater from its north rim. the ground is the
# usgs's 2019 lidar model; the trees are spruces standing in for ʻōhiʻa,
# the ferns a temperate fern standing in for ʻamaʻu, until the
# manufactory grows them. a test of a forest's scale, not yet of fire's
# spread: each fire is lit and none catches from another.
scene:
  name: kilauea iki forest alight
  light: moon
  location:
    lat: 19.4165
    lon: -155.2485
  timeofday: 2200
  terrain:
    from: usgs-kilauea-2019-dem
    file: unpacked/kil_2019dem/kil_2019dem.tif
    west: 263000
    north: 2149000
    across: 1800
    down: 1300
    step: 4
  film:
    width: 960
    height: 600
    rays: 2
    exposure: 100000
  cameras:
    across:
      title: "across the crater from the north rim"
      orientation:
        point_to: the far tree
        alpha: -4
      location:
        loc_relative:
          object: the lookout
          standoff_x: 0
          standoff_y: 0
          standoff_z: 3
  set:
    things:
      the lookout:
        kind: cobble
        seed: 5
        east: 263850
        north: 2148720
      the far tree:
        kind: spruce
        seed: 3
        east: 264450
        north: 2148100
        alight: true
        stands_in_for: "ʻōhiʻa lehua, until the manufactory grows it"
    stands:
      ferns on the walls:
        kind: fern
        count: 800
        seed: 7
        above: 1110
        stands_in_for: "ʻamaʻu, with a temperate fern's numbers"
      the forest:
        kind: spruce
        count: 1000
        seed: 11
        above: 1150
        alight: 12
        stands_in_for: "ʻōhiʻa lehua, until the manufactory grows it"
