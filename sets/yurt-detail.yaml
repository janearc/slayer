# the yurt, decomposed: a ger on flat ground at dusk. the camera close is
# 10 m off and above, from the south-west, and sees the canvas cover with
# its ropes and bands, the felt below its skirt, the painted door standing
# open and the crown ring with the stovepipe. the camera inside stands in
# front of the door and looks in at the stove, rug, beds and chest. drawn at
# the demo level by the cities package (manufacture/cities/yurtfine.go).
#
# places are metres, as a map's run: x east, y north, z up. the yurt's
# measures and colours are in manufacture/cities/yurt.yaml, each picked. the
# sun's place, the ground's colour and the camera are choices of this
# study, picked by eye, and say so.
#
# not true yet, and so wrong in the picture: the felt and canvas do not let
# the lamp's light through, since slayer has no diffuse transmission.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: yurt detail
  # the scene stands things on a world's own ground, not a terrain's,
  # which is how a set says it has none
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 40
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # 10 m off to the south-west and 4.6 m up, looking down at the door
    # and the roof to the crown
    close:
      title: "from the south-west, close, at dusk"
      location:
        at: [-4, -9.5, 4.6]
      orientation:
        look_at: [0, -1.2, 1.5]
    # 3 m south of the door at eye height, looking in through the open door
    # at the stove, the rug, the beds and the chest
    inside:
      title: "through the open door, at dusk"
      location:
        at: [0.3, -6.2, 1.4]
      orientation:
        look_at: [0, 0, 0.9]
  set:
    things:
      ger:
        kind: yurt
        seed: 1
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
  world:
    unit: 1
    materials:
      steppe:
        colour: {srgb_linear: [0.1, 0.09, 0.05]}
        source: eye
    boxes:
      # the ground, its upper face at nought
      ground:
        material: steppe
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
    # dusk, by eye: a low warm sun in the west, a dim sky that is
    # lightest at the horizon. the sun a set may hold on the ground
    # needs a terrain, and this study has none.
    suns:
      west:
        toward: [-1, -0.3, 0.12]
        colour: {srgb_linear: [2.2, 1.2, 0.55]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.22, 0.14, 0.12]}
      zenith: {srgb_linear: [0.02, 0.035, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
    lamps:
      # inside the wall, hung off the stove's pipe: a 2700 K bulb
      inside:
        at: [0.9, 0.5, 1.7]
        temperature: 2700
        strength: 0.8
        radius: 0.05
        source: eye
