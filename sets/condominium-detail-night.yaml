# a condominium at the demo detail level, at night: the lit dwellings
# glow, the dark ones do not, seen from across the street and from
# higher up. made by the cities package, through the manufactory's kind
# condominium, from manufacture/cities/cultures/condominium.yaml.
#
# places are metres, x east, y north, z up, the court centred on the
# origin. the moon, the ground and the cameras are choices of this study,
# picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: condominium-detail-night
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 8
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # across the street, west of the court, looking in.
    street:
      title: "from across the street, at night"
      location:
        at: [-58, -30, 50]
      orientation:
        look_at: [10, 4, 16]
    # from the north-west and the south-west, high, looking along the
    # court at the fronts that step back.
    terraces-north:
      title: "down into the court, the stepped fronts"
      location:
        at: [-28, -22, 72]
      orientation:
        look_at: [2, 2, 8]
    # inside the court, looking at the east building's front.
    close:
      title: "up close, from the court, at night"
      location:
        at: [-2, -3, 5]
      orientation:
        look_at: [15, 1, 8]
  set:
    things:
      block:
        kind: condominium
        seed: 256
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      lawn:
        colour: {srgb_linear: [0.03, 0.045, 0.03]}
        source: eye
    boxes:
      ground:
        material: lawn
        middle: [0, 0, -1.06]
        size: [3000, 3000, 2]
        source: eye
    suns:
      moon:
        toward: [-0.5, -0.4, 0.55]
        colour: {srgb_linear: [0.14, 0.18, 0.3]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.008, 0.012, 0.03]}
      zenith: {srgb_linear: [0.002, 0.004, 0.012]}
      ground: {srgb_linear: [0.004, 0.004, 0.004]}
      source: eye
