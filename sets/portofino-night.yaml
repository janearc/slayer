# portofino at night, at the demo detail level: the same row as
# portofino-detail, with the sun gone and a dim cold light in its place, so
# that what is lit is the lamps in the rooms, seen through clear glass
# past the curtains. made by the cities package, through the
# manufactory's kind terrace-portofino.
#
# places are metres, as a map's run: x east, y north, z up. the row runs
# east from the origin with its front to the south. the water has no
# gloss. the light, the colours and the cameras are choices of this study,
# picked by eye.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: portofino night
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 16
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    close:
      title: "four windows at night, up close"
      location:
        at: [40, -25, 7.6]
      orientation:
        look_at: [40, 0, 7.6]
    street:
      title: "along the quay at night"
      location:
        at: [-8, -22, 2]
      orientation:
        look_at: [40, 0, 7]
  set:
    things:
      row:
        kind: terrace-portofino
        seed: 3
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      quay:
        colour: {srgb_linear: [0.14, 0.125, 0.1]}
        source: eye
      water:
        colour: {srgb_linear: [0.05, 0.09, 0.12]}
        source: eye
    boxes:
      land:
        material: quay
        middle: [0, 236, -1]
        size: [3000, 500, 2]
        source: eye
      harbour:
        material: water
        middle: [0, -514, -1.3]
        size: [3000, 1000, 2]
        source: eye
    suns:
      moon:
        toward: [-0.5, -0.7, 0.4]
        colour: {srgb_linear: [0.012, 0.018, 0.035]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.02, 0.025, 0.04]}
      zenith: {srgb_linear: [0.002, 0.004, 0.012]}
      ground: {srgb_linear: [0.005, 0.005, 0.006]}
      source: eye
