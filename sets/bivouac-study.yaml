# the bivouac study: one bivy sack on flat ground at dusk, with its guy
# lines and stakes, a pack and a pair of boots beside it, seen from 5 m off
# at eye height from the south-west. made by the cities package
# (manufacture/cities/bivouac.go) through the manufactory's kind bivouac, at
# the demo level.
#
# places are metres, as a map's run: x east, y north, z up. the bivouac's
# size and colours are in manufacture/cities/bivouac.yaml, each picked. the
# sun's place, the ground's colour and the camera are choices of this
# study, picked by eye, and say so.
#
# not true yet, and so wrong in the picture: the sack has no one in it, and
# is a smooth arch with no sag or creases in its cloth.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: bivouac study
  # the scene stands things on a world's own ground, not a terrain's,
  # which is how a set says it has none
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 40
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # 5 m off to the south-west at 1.1 m up, looking at the sack's middle
    close:
      title: "from the south-west, close, at dusk"
      location:
        at: [-3.2, -3.4, 1.1]
      orientation:
        look_at: [0, 0, 0.25]
  set:
    things:
      bivy:
        kind: bivouac
        seed: 1
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
  world:
    unit: 1
    materials:
      ground:
        colour: {srgb_linear: [0.1, 0.09, 0.05]}
        source: eye
    boxes:
      # the ground, its upper face at nought
      ground:
        material: ground
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
    # dusk, by eye: a low warm sun in the west, a dim sky that is
    # lightest at the horizon. the sun a set may hold on the ground
    # needs a terrain, and this study has none.
    suns:
      west:
        toward: [-1, -0.3, 0.12]
        colour: {srgb_linear: [2.2, 1.2, 0.55]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.22, 0.14, 0.12]}
      zenith: {srgb_linear: [0.02, 0.035, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
