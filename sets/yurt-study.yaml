# the yurt study: a ger on flat ground at dusk, with one warm lamp inside,
# seen from 15 m off at eye height. the first thing drawn by the cities
# package (manufacture/cities), made through the manufactory's kind yurt.
#
# places are metres, as a map's run: x east, y north, z up. the yurt's
# size and colours are in manufacture/cities/yurt.yaml, each picked. the
# sun's place, the ground's colour, the lamp and the camera are choices
# of this study, picked by eye, and say so.
#
# not true yet, and so wrong in the picture: the felt does not let the
# lamp's light through, since slayer has no diffuse transmission, only
# clear refraction, so the lamp lights the inside and nothing shows of
# it; and the lattice wall is a plain cylinder, with no lattice.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: yurt study
  # the scene stands things on a world's own ground, not a terrain's,
  # which is how a set says it has none
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 40
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # eye height, 15 m south of the yurt, looking at the middle of its
    # wall
    front:
      title: "from the south, at eye height"
      location:
        at: [0, -15, 1.6]
      orientation:
        look_at: [0, 0, 1.4]
  set:
    things:
      ger:
        kind: yurt
        seed: 1
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
  world:
    unit: 1
    materials:
      steppe:
        colour: {srgb_linear: [0.1, 0.09, 0.05]}
        source: eye
    boxes:
      # the ground, its upper face at nought
      ground:
        material: steppe
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
    # dusk, by eye: a low warm sun in the west, a dim sky that is
    # lightest at the horizon. the sun a set may hold on the ground
    # needs a terrain, and this study has none.
    suns:
      west:
        toward: [-1, -0.3, 0.12]
        colour: {srgb_linear: [2.2, 1.2, 0.55]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.22, 0.14, 0.12]}
      zenith: {srgb_linear: [0.02, 0.035, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
    lamps:
      # inside the wall, a little over a metre up: a 2700 K bulb
      inside:
        at: [0, 0, 1.2]
        temperature: 2700
        strength: 0.5
        radius: 0.05
        source: eye
