# The white-tailed tropicbird of the bird maker gliding alone, from a
# little above and behind the quarter, so the streamers and the black
# wing tips show. Lit by the worked sun and sky; the sun's place is
# picked.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: tropicbird gliding
  seed: 7
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 200, altitude: 35}
  set:
    things:
      tropicbird:
        kind: bird-white-tailed-tropicbird-gliding
        seed: 7
        heading: {value: 0, unit: deg}
        position: {east: {value: 0, unit: m}, north: {value: 0, unit: m}, up: {value: 3, unit: m}}
  film:
    width: 480
    height: 300
    rays: 4
    wide: 39
  cameras:
    above:
      title: "south-west and above, on the back and the streamers"
      location: {at: [-1.2, -1.3, 3.9]}
      orientation: {look_at: [-0.15, 0, 3.0]}
