# An adult cow orca as one closed skin bound to its skeleton, swimming
# in an authored scene-time loop of turns at its lumbar and caudal
# joints. Sources: doc/model/bioform/orca/SOURCES.md. Shape and
# markings not traced there are chosen, and say so in the code.
# Cameras: side, quarter (three-quarter) and close (the head's skin).
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Orca clean 05 deformation study
  seed: 17
  setting: space
  light: none
  recipes:
    profile-orca: {animal: {family: whale, file: ../../manufacture/animals/vertebrates/mammals/whales/profiles.yaml, species: orca, pose: swim}}
  set:
    things:
      orca:
        recipe: profile-orca
        seed: 17
        east: 0
        north: 0
  film:
    width: 1600
    height: 1000
    rays: 4
    exposure: 1.15
    wide: 39
  cameras:
    side:
      location: {at: [0, -11, 1.1]}
      orientation: {look_at: [0, 0, 0]}
    quarter:
      location: {at: [5, -10, 4]}
      orientation: {look_at: [0, 0, 0]}
    close:
      location: {at: [2.5, -2.6, .7]}
      orientation: {look_at: [1.85, 0, 0.12]}
  world:
    unit: 1
    sky:
      horizon: {srgb_linear: [0.10, 0.14, 0.17]}
      zenith: {srgb_linear: [0.18, 0.23, 0.28]}
      ground: {srgb_linear: [0.05, 0.07, 0.08]}
      source: eye
    suns:
      study-light:
        toward: [0.3, 0.82, 0.49]
        colour: {srgb_linear: [1.35, 1.32, 1.26]}
        source: eye
    floods:
      fill:
        colour: {srgb_linear: [0.42, 0.50, 0.55]}
        strength: 1
        source: eye
