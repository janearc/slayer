# The bull walrus's skeleton alone, at rest lying on land, in a studio:
# skull with its tusks and jaw, seven neck, fourteen chest, six loin,
# three sacral and nine tail vertebrae, a rib pair to each chest vertebra,
# the breastbone, and four flippers built as hands of bones, the hind ones
# turned forward under the body. Cameras: side, quarter, top, head.
# Sources: the comments in manufacture/walrus_skeleton*.go.
