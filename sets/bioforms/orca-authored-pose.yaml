# A checked orca profile driven by a clip authored in this set.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Orca authored pose
  seed: 17
  setting: space
  light: none
  recipes:
    lift:
      animal: {family: whale, file: "@builtin", species: orca, representation: skin}
      pose-clip:
        timing: smooth
        keys:
          - at: {value: 0, unit: s}
          - at: {value: 1.5, unit: s}
            root-offset: [0.6, 0.15, 0]
            root-turns: [0, 0, 4]
            turns:
              L10: [0, 0, -1.0]
              L11: [0, 0, -1.5]
              L12: [0, 0, -2.0]
              Ca1: [0, 0, -2.5]
              Ca2: [0, 0, -2.5]
          - at: {value: 3, unit: s}
            root-offset: [1.2, 0, 0]
  set:
    things:
      orca: {recipe: lift, seed: 17, east: 0, north: 0}
  film: {width: 800, height: 500, rays: 2, wide: 40, exposure: 1.15}
  cameras:
    side:
      location: {at: [0.5, -11, 1.1]}
      orientation: {look_at: [0.5, 0, 0]}
  world:
    unit: 1
    sky:
      horizon: {srgb_linear: [0.10, 0.14, 0.17]}
      zenith: {srgb_linear: [0.06, 0.07, 0.08]}
      ground: {srgb_linear: [0.07, 0.08, 0.09]}
      source: eye
    suns:
      key:
        toward: [0.30, -0.82, 0.49]
        colour: {srgb_linear: [1.35, 1.32, 1.26]}
        source: eye
    floods:
      fill:
        colour: {srgb_linear: [0.42, 0.44, 0.48]}
        strength: 1
        source: eye
