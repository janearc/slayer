# The four fish in their skins, each in two poses: at a phase of its
# stroke (the kind by the species' name), and gliding (the kind with
# -glide). Proportions, markings and their sources are in
# manufacture/animals/vertebrates/fishes/fish.yaml.
#
# the frame. places are metres, x east, y north, z up. the swimming fish
# stand twenty metres apart along the east; each gliding one stands
# twenty-five metres east and thirty south of its swimming one, so no
# camera sees the other pose. all in open air, lit by the sun through
# the air; the sun is typed as azimuth and altitude, chosen. a side
# camera stands south of its fish, a quarter camera south-east and
# above.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: four fish in their skins
  seed: 11
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 160, altitude: 40}
  recipes:
    profile-pacific-bluefin-tuna-swim: {animal: {family: fish, file: ../../manufacture/animals/vertebrates/fishes/fish.yaml, species: pacific-bluefin-tuna, pose: swim}}
