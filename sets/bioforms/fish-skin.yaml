    profile-california-yellowtail-glide: {animal: {family: fish, file: ../../manufacture/animals/vertebrates/fishes/fish.yaml, species: california-yellowtail, pose: glide}}
    profile-california-barracuda-glide: {animal: {family: fish, file: ../../manufacture/animals/vertebrates/fishes/fish.yaml, species: california-barracuda, pose: glide}}
    profile-pacific-sardine-glide: {animal: {family: fish, file: ../../manufacture/animals/vertebrates/fishes/fish.yaml, species: pacific-sardine, pose: glide}}
