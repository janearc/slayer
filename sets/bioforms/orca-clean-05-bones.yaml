# The skeleton of the adult cow orca of orca-clean-05, alone and at
# rest: skull, column by region, ribs and sternum, the flippers' bones,
# the pelvic vestiges. Counts are traced in the code to the sources of
# doc/model/bioform/orca/SOURCES.md.
# Cameras: side, quarter (three-quarter) and hand (the right flipper).
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Orca clean 05 skeleton study
  seed: 17
  setting: space
  light: none
  recipes:
    profile-orca: {animal: {family: whale, file: ../../manufacture/animals/vertebrates/mammals/whales/profiles.yaml, species: orca, representation: bones}}
  set:
    things:
      bones:
        recipe: profile-orca
        seed: 17
        east: 0
        north: 0
  film:
    width: 1600
    height: 1000
    rays: 4
    exposure: 1.15
    wide: 39
  cameras:
    side:
      location: {at: [0, -11, 1.1]}
      orientation: {look_at: [0, 0, 0]}
    quarter:
      location: {at: [5, -10, 4]}
      orientation: {look_at: [0, 0, 0]}
    hand:
      location: {at: [2.4, -2.6, -1.3]}
      orientation: {look_at: [1.35, -0.6, -0.5]}
  world:
    unit: 1
    sky:
      horizon: {srgb_linear: [0.10, 0.14, 0.17]}
      zenith: {srgb_linear: [0.18, 0.23, 0.28]}
      ground: {srgb_linear: [0.05, 0.07, 0.08]}
      source: eye
    suns:
      study-light:
        toward: [0.3, 0.82, 0.49]
        colour: {srgb_linear: [1.35, 1.32, 1.26]}
        source: eye
    floods:
      fill:
        colour: {srgb_linear: [0.42, 0.50, 0.55]}
        strength: 1
        source: eye
