# The grey heron of bird-grey-heron-standing.yaml close, on its folded
# right wing, to see how the flight feathers lie along the flank.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: grey heron folded wing, close
  seed: 7
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 200, altitude: 35}
  set:
    things:
      bird:
        kind: bird-grey-heron-standing
        seed: 7
        heading: {value: 0, unit: deg}
        position:
          east: {value: 0, unit: m}
          north: {value: 0, unit: m}
          up: {value: 0, unit: m}
  film:
    width: 480
    height: 300
    rays: 4
    wide: 39
  cameras:
    wing:
      title: "from the south, a metre and a half off, on the wing"
      location: {at: [0.05, -1.5, 0.5]}
      orientation: {look_at: [0.05, 0, 0.45]}
