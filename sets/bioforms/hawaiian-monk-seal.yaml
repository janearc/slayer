# Hawaiian monk seal asleep on a sand bar: the lofted seal's second
# form, with its own stations, length and plain coat, over the same
# skeleton as the harbor seal.
#
# the frame. places are metres, x east, y north, z up, the sand at z = 0.
# the seal's nose points east. the sand is one flat box, its colour
# chosen; no beach was surveyed. the sun is low in the south-west,
# through the earth's air, and the sky is that air's.
#
# cameras: side (from the south, the seal's right flank), above
# (straight down, north up), quarter (three-quarter, from ahead).
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Hawaiian monk seal hauled out
  seed: 407
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 236.2, altitude: 24}
  world:
    unit: 1
    materials:
      sand:
        colour: {srgb_linear: [0.40, 0.37, 0.31]}
        source: eye
    boxes:
      sand bar:
        material: sand
        middle: [0, 0, -0.5]
        size: [600, 600, 1]
        source: "chosen: a flat sand bar, its top at z = 0, no survey"
  recipes:
    profile-monk-hauled: {animal: {family: pinniped, file: ../../manufacture/animals/vertebrates/mammals/pinnipeds/profiles.yaml, species: hawaiian-monk-seal, pose: hauled}}
  set:
    things:
      seal: {recipe: profile-monk-hauled, seed: 407, position: {east: {value: 0, unit: m}, north: {value: 0, unit: m}, up: {value: 0, unit: m}}, heading: {value: 0, unit: deg}}
  film:
    width: 1600
    height: 1000
    rays: 2
    exposure: 780
    wide: 39
  cameras:
    side:
      location: {at: [-0.12, -4.9, 0.65]}
      orientation: {look_at: [-0.12, 0, 0.25]}
    above:
      location: {at: [-0.12, -0.01, 5.1]}
      orientation: {look_at: [-0.12, 0, 0]}
    quarter:
      location: {at: [3.5, -3.2, 1.6]}
      orientation: {look_at: [-0.06, 0, 0.24]}
