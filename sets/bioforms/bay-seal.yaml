# Original bay seal at its phase-zero bottling pose, in a static study.
# Sources and provenance: doc/model/bioform/bay-seal/README.md
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Original bay seal static study
  seed: 407
  setting: space
  light: none
  recipes:
    profile-harbor-bay: {animal: {family: pinniped, file: ../../manufacture/animals/vertebrates/mammals/pinnipeds/profiles.yaml, species: harbor-seal, study: bay}}
  set:
    things:
      seal:
        recipe: profile-harbor-bay
        seed: 407
        east: 0
        north: 0
  film:
    width: 800
    height: 500
    rays: 2
    exposure: 1.15
    wide: 39
  cameras:
    side:
      location: {at: [0, -3.5, 0.5]}
      orientation: {look_at: [0, 0, 0]}
    face:
      location: {at: [2.7, -1.1, 0.4]}
      orientation: {look_at: [0.35, 0, 0]}
  world:
    unit: 1
    sky:
      horizon: {srgb_linear: [0.10, 0.14, 0.17]}
      zenith: {srgb_linear: [0.18, 0.23, 0.28]}
      ground: {srgb_linear: [0.05, 0.07, 0.08]}
      source: eye
    suns:
      study-light:
        toward: [0.3, 0.82, 0.49]
        colour: {srgb_linear: [1.65, 1.47, 1.23]}
        source: eye
    floods:
      fill:
        colour: {srgb_linear: [0.15, 0.19, 0.21]}
        strength: 1
        source: eye
