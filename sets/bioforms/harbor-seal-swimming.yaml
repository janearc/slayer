# Harbor seal built on its skeleton, in the swimming stroke, alone in a
# study lit by the sun through the earth's air, as the sea set is. The
# cameras: side, above, and quarter (three-quarter, from ahead).
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Harbor seal swimming study
  seed: 407
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 236.2, altitude: 24}
  world:
    unit: 1
  recipes:
    profile-harbor-swimming: {animal: {family: pinniped, file: ../../manufacture/animals/vertebrates/mammals/pinnipeds/profiles.yaml, species: harbor-seal, pose: swimming}}
  set:
    things:
      seal: {recipe: profile-harbor-swimming, seed: 407, position: {east: {value: 0, unit: m}, north: {value: 0, unit: m}, up: {value: 1.2, unit: m}}, heading: {value: 0, unit: deg}}
  film:
    width: 1600
    height: 1000
    rays: 2
    exposure: 1102
    wide: 39
  cameras:
    side:
      location: {at: [-0.1, -4.0, 1.3]}
      orientation: {look_at: [-0.1, 0, 1.2]}
    above:
      location: {at: [-0.1, -0.01, 5.3]}
      orientation: {look_at: [-0.1, 0, 1.2]}
    quarter:
      location: {at: [2.9, -2.6, 2.2]}
      orientation: {look_at: [-0.05, 0, 1.2]}
