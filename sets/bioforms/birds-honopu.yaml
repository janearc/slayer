# The two birds of the sea cliffs, from the bird maker, gliding: the
# great frigatebird with its deep forked tail and the white-tailed
# tropicbird with its two long streamers, a few metres apart and seen
# from a little below. Lit by the worked sun and sky; the sun's place is
# picked.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: frigatebird and tropicbird gliding
  seed: 7
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 200, altitude: 35}
  recipes:
    profile-great-frigatebird-gliding: {animal: {family: bird, file: ../../manufacture/animals/vertebrates/dinosaurs/theropods/birds/birds.yaml, species: great-frigatebird, pose: gliding}}
    profile-white-tailed-tropicbird-gliding: {animal: {family: bird, file: ../../manufacture/animals/vertebrates/dinosaurs/theropods/birds/birds.yaml, species: white-tailed-tropicbird, pose: gliding}}
  set:
    things:
      frigatebird:
        recipe: profile-great-frigatebird-gliding
        seed: 7
        heading: {value: 0, unit: deg}
        position: {east: {value: -0.9, unit: m}, north: {value: 0, unit: m}, up: {value: 3, unit: m}}
      tropicbird:
        recipe: profile-white-tailed-tropicbird-gliding
        seed: 7
        heading: {value: 0, unit: deg}
        position: {east: {value: 1.4, unit: m}, north: {value: 0.6, unit: m}, up: {value: 3.2, unit: m}}
  film:
    width: 480
    height: 300
    rays: 4
    wide: 39
  cameras:
    below:
      title: "south, a little below the birds"
      location: {at: [0.25, -5.2, 2.2]}
      orientation: {look_at: [0.25, 0, 3.1]}
