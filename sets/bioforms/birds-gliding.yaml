# The gull and the tern of the bird maker gliding, wings spread, feet
# tucked, two metres up and two apart, seen from a little below and to
# the front quarter. Lit by the worked sun and sky; the sun's place is
# picked.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: birds gliding
  seed: 7
  light: sun
  air: earth
  groundless-air:
    coordinate-origin: earth-mean-radius
    reference-altitude: {value: 0, unit: m}
    boundary: earth-standard-land
  sun: {azimuth: 200, altitude: 35}
  set:
    things:
      gull:
        kind: bird-yellow-legged-gull-gliding
        seed: 7
        heading: {value: 0, unit: deg}
        position: {east: {value: -1, unit: m}, north: {value: 0, unit: m}, up: {value: 2, unit: m}}
      tern:
        kind: bird-white-tern-gliding
        seed: 7
        heading: {value: 0, unit: deg}
        position: {east: {value: 1, unit: m}, north: {value: 0, unit: m}, up: {value: 2, unit: m}}
  film:
    width: 480
    height: 300
    rays: 4
    wide: 39
  cameras:
    quarter:
      title: "south-east, a little below the wings"
      location: {at: [3.0, -4.5, 1.2]}
      orientation: {look_at: [0, 0, 2]}
