# the signs detail study, sheet two, blade signs and awnings: six blade
# signs from six seeds, 21 to 26, each turned a quarter so that a face is
# square to the camera, hung in a row above four awnings from four seeds,
# 21 to 24, raised to the height a person walks under, seen square-on, from
# manufacture/cities/signdraw.go, drawn from manufacture/cities/cultures/
# sign.yaml. the walls they hang from are not drawn. each thing is given a
# heading, or the hillside turns it by its seed.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the signs' own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the rows' places, the street, the lamp and the camera are choices of
# this study.
