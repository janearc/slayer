# a condominium at the demo detail level, at dusk: the households of its
# dwellings drawn at the dwelling scope, with their curtains and blinds,
# balconies and what is kept on them, lit or dark. seen up close from
# inside the court and from across the street. made by the cities package
# (manufacture/cities), through the manufactory's kind condominium, from
# manufacture/cities/cultures/condominium.yaml.
#
# places are metres, x east, y north, z up, the court centred on the
# origin. the sun, the ground and the cameras are choices of this study,
# picked by eye, and say so.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: condominium-detail-dusk
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 50
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    # inside the court, at a balcony's height, looking across at the east
    # building's front.
    close:
      title: "up close, from the court"
      location:
        at: [-12, -10, 10]
      orientation:
        look_at: [15, 2, 16]
    # from the middle of the court, looking up at the fronts that step
    # back, north and south.
    steps-north:
      title: "up at the stepped front to the north"
      location:
        at: [2, 9.5, 2]
      orientation:
        look_at: [0, -14, 24]
    steps-south:
      title: "up at the stepped front to the south"
      location:
        at: [0, 1, 2.5]
      orientation:
        look_at: [0, 14, 22]
    # high over the south-west corner, looking across the roofs.
    roofs:
      title: "over the roofs and decks"
      location:
        at: [-40, -34, 62]
      orientation:
        look_at: [2, 2, 22]
    # straight down on the block, to see what stands on its roofs.
    dome:
      title: "straight down on the roofs"
      location:
        at: [0, -0.1, 95]
      orientation:
        look_at: [0, 0, 0]
    # across the street, west of the court, looking in.
    street:
      title: "from across the street"
      location:
        at: [-48, -10, 2]
      orientation:
        look_at: [10, 0, 9]
  set:
    things:
      block:
        kind: condominium
        seed: 256
        complexity: demo
        east: 0
        north: 0
        height: {value: 0, unit: m}
        heading: {value: 0, unit: deg}
  world:
    unit: 1
    materials:
      lawn:
        colour: {srgb_linear: [0.04, 0.06, 0.03]}
        source: eye
    boxes:
      ground:
        material: lawn
        middle: [0, 0, -1.06]
        size: [3000, 3000, 2]
        source: eye
    suns:
      west:
        toward: [-0.7, -0.6, 0.22]
        colour: {srgb_linear: [2.4, 1.3, 0.6]}
        source: eye
    sky:
      horizon: {srgb_linear: [0.3, 0.14, 0.1]}
      zenith: {srgb_linear: [0.02, 0.03, 0.08]}
      ground: {srgb_linear: [0.03, 0.028, 0.02]}
      source: eye
