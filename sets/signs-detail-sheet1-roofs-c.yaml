# the signs detail study, sheet one, a roof sign and a screen: a roof sign
# of channel letters on a board with a border of bulbs, on a frame of legs
# (sign-roof seed 24), and a screen of lit tiles with seams, held off its
# wall on posts, one tile dead (sign-screen seed 8), each from
# manufacture/cities/signdraw.go, drawn from manufacture/cities/cultures/
# sign.yaml. each thing is given a heading, or the hillside turns it by its
# seed.
#
# places are metres, as a map's run: x east, y north, z up. there is no sun
# and no sky: the light is the signs' own, and one plain dim lamp, a choice
# of this study, picked by eye, so that the parts that are not lit can be
# seen. the street, the lamp and the camera are choices of this study.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: signs detail sheet one roof and screen
  setting: space
  light: none
  film:
    width: 720
    height: 480
    rays: 2
    wide: 60
    exposure: 1
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    square:
      title: "square-on, 57 m off, at the height of the signs' middles"
      location:
        at: [0, -57, 6]
      orientation:
        look_at: [0, 0, 6]
  set:
    things:
      bulb: {kind: sign-roof, seed: 24, complexity: quick, east: -18, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
      screen: {kind: sign-screen, seed: 8, complexity: quick, east: 20, north: 0, height: {value: 0, unit: m}, heading: {value: 0, unit: deg}}
  world:
    unit: 1
    lamps:
      plain-dim:
        at: [0, -57, 22]
        temperature: 5000
        strength: 6500
        radius: 0.5
        source: eye
    materials:
      street:
        colour: {srgb_linear: [0.02, 0.02, 0.025]}
        clear: {through: 0.03, index: 1.5, gloss: 1, rank: 0}
        source: eye
    boxes:
      street:
        material: street
        middle: [0, 0, -1]
        size: [20000, 20000, 2]
        source: eye
