# a stretch of a bay at night, from the height of its shore, with twelve
# boats and an Alfa among them, lit by nothing but their own lamps:
# `light: none`, no sun, no moon, no sky. the lamps are the boats' own, as
# manufacture/boats.yaml has them: a boat under way shows a red light on its
# port side, a green one to starboard and a white one at its stern, and, a
# power vessel, a white one at its masthead; a boat at anchor shows one white
# light all round; a sampan's lantern, a fishing boat's floodlights and a
# ferry's cabin lamps burn in either state.
#
# the ground is noaa's cudem topobathy model of san francisco bay, the same
# tile and window as sets/sf-north-waterfront.yaml, 3.9 by 2.9 km, cut at a
# 6 m step, with the bay filled to the sea at nought. nothing is built on
# the land: this study is of the water. places are metres in the window,
# east 0 to 3900 from its west edge and north 0 to 2900 from its south
# edge. the camera stands 12 m over the marker `the shore`, at 3100 east
# and 2180 north, which sets the marker the waterfront set calls the wharf,
# and looks north over the bay to the marker `the view`, a person's height,
# at 3050 east and 2650 north, which is on the sea floor under the middle
# of the boats.
#
# ten of the boats stand where their stands lay them: each stand is a
# scatter over a rectangle of the map, by its seed, and the stage puts a boat
# that floats on the sea where the ground is under it by three metres or
# more, at the sea's height, so no boat is on land or on the sea floor. a
# boat is turned any way, and each is drawn afresh. two more, a fishing boat
# and a sampan, are things set by the Alfa, so that their lamps light it.
# the Alfa is placed as its own set places it: its keel 6.24 m under the sea,
# which is 0, heading 300, a choice. the stands keep 30 m clear of it. every
# figure of the lamps and the boats is in manufacture/boats.yaml, recalled or
# picked.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: a bay at night, a dozen boats and an alfa
  light: none
  location:
    lat: 37.8025
    lon: -122.4255
  terrain:
    from: noaa-cudem-sf-ncei19-n38x00-w122x50-2022
    lat: 37.8025
    lon: -122.4255
    across: 3900
    down: 2900
    step: 6
    sea: {value: 0, unit: m}
  film:
    width: 1280
    height: 720
    rays: 2
    exposure: 16
    wide: 30
    print:
      knee: 0.7
      top: 8
      source: eye
  cameras:
    shore:
      title: "from 30 m over the shore, north over the bay to the boats"
      orientation:
        point_to: the view
        alpha: 0
      location:
        loc_relative:
          object: the shore
          standoff_x: 3
          standoff_y: 3
          standoff_z: 30
    close:
      title: "from the water 60 m south-west of the Alfa, 8 m up"
      orientation:
        point_to: the water
        alpha: 0
      location:
        loc_relative:
          object: the water
          standoff_x: -45
          standoff_y: -55
          standoff_z: 8
    bows:
      title: "from the water 35 m ahead of the fishing boat by the Alfa, 5 m up, at its bow"
      orientation:
        point_to: the trawler
        alpha: 0
      location:
        loc_relative:
          object: the trawler
          standoff_x: -22
          standoff_y: -26
          standoff_z: 5
  set:
    things:
      the trawler:
        kind: human-scale-2m
        seed: 1
        position:
          east: {value: 3088, unit: m}
          north: {value: 2660, unit: m}
          up: {value: 2, unit: m}
      the shore:
        kind: human-scale-2m
        seed: 1
        east: 3100
        north: 2180
      the view:
        kind: human-scale-2m
        seed: 1
        east: 3050
        north: 2650
      the water:
        kind: human-scale-2m
        seed: 1
        position:
          east: {value: 3050, unit: m}
          north: {value: 2650, unit: m}
          up: {value: 0, unit: m}
      alfa:
        kind: alfa
        seed: 1
        position:
          east: {value: 3050, unit: m}
          north: {value: 2650, unit: m}
          up: {value: -6.24, unit: m}
        heading: {value: 300, unit: deg}
      fishing boat by the alfa:
        kind: fishing-boat
        seed: 31
        complexity: quick
        position:
          east: {value: 3088, unit: m}
          north: {value: 2660, unit: m}
          up: {value: 0, unit: m}
        heading: {value: 215, unit: deg}
      sampan by the alfa:
        kind: sampan
        seed: 32
        complexity: quick
        position:
          east: {value: 3032, unit: m}
          north: {value: 2630, unit: m}
          up: {value: 0, unit: m}
        heading: {value: 200, unit: deg}
    stands:
