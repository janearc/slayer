choppy.scale:
  value: 1
  unit: "dimensionless"
  from: "none"
  url: "https://jtessen.people.clemson.edu/reports/papers_files/waterslides2001.pdf"
  fetched: "2026-11-09"
  read: "fetch"
  kind: "glue"
