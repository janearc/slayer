# sources.yaml: every number oceantex uses, by name.
#
# The code holds no measured or chosen numbers of its own. It reads each
# one from here by name (num("cox-munk.along.slope")), and a test fails if
# the code asks for a name that is not here or leaves one here unused.
# What stays in the code is arithmetic: pi, the 2 in a Gaussian, the
# halves and squares of Fresnel's equations, unit conversions.
#
# Fields:
#   value / values   the number, or a list of them
#   unit             what it measures
#   from             the publication the number belongs to
#   url              the page I actually read it on
#   fetched          the day I read it
#   read             fetch  = I fetched that url and read the number there
#                    search = I read it in a web-search excerpt of that url
#                    clone  = I cloned the repository and read the file
#   kind             sourced    = from the publication named
#                    definition = exact by definition or convention
#                    glue       = authored model choice, including imports
#   note             anything a checker should know
#
# Fetches go through a tool that summarises the page, so a "fetch" is a
# reading of the page, not a byte-for-byte copy. Where the tool said the
# text was garbled or reconstructed, the note says so.

# ---------------------------------------------------------------- gravity

