# A chosen two-metre reference beside the existing manufactured MCRN Larson.
# The mannequin is our CC0 decoder fixture, not scanned human anatomy.
# Coordinates are east, north, up, in metres. Lighting and colours are authored.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: A visitor beside the MCRN Larson
  seed: 5
  setting: space
  light: none
  set:
    things:
      larson:
        kind: mcrn-larson-landed
        seed: 5
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
  film:
    width: 640
    height: 360
    rays: 2
    wide: 40
    exposure: 1
  cameras:
    arrival:
      location: {at: [18, -24, 12]}
      orientation: {look_at: [1, 0, 2]}
  world:
    unit: 1
    materials:
      mannequin:
        colour: {srgb_linear: [0.52, 0.42, 0.28]}
        source: eye
      pad:
        colour: {srgb_linear: [0.055, 0.07, 0.095]}
        source: eye
    boxes:
      landing-pad:
        material: pad
        middle: [0, 0, -0.12]
        size: [28, 28, 0.24]
        source: eye
    imports:
      visitor:
        file: two-metre-human.gltf
        height: {value: 2, unit: m}
        at: [7, 1, 0]
        heading: {value: 0, unit: deg}
        materials: {material/0/human-fixture-slot: mannequin}
        source: "Self-authored CC0 mannequin; chosen geometric height"
        license: CC0-1.0
    sky:
      horizon: {srgb_linear: [0.022, 0.027, 0.05]}
      zenith: {srgb_linear: [0.004, 0.007, 0.02]}
      ground: {srgb_linear: [0.01, 0.013, 0.022]}
      source: eye
    suns:
      key:
        toward: [-4, -5, 7]
        colour: {srgb_linear: [8, 7, 5.5]}
        source: eye
      rim:
        toward: [8, 4, 4]
        colour: {srgb_linear: [0.8, 1.1, 1.8]}
        source: eye
