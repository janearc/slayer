# A small camp to explore. Positions are east, north, up in metres.
# The plant book is built in. The standing visitor uses the adjacent GLB.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Larson camp
  seed: 5
  setting: space
  light: none
  recipes:
    spruce:
      plant: {family: conifer, file: '@builtin', species: spruce}
    flames:
      kind: fire
      flame:
        radius: {value: 0.35, unit: m}
        height: {value: 1.2, unit: m}
        absorption: {value: 1, unit: m^-1}
        temperature: {value: 1750, unit: K}
        edge-temperature: {value: 900, unit: K}
      light-cells: 3
  set:
    things:
      larson:
        kind: mcrn-larson
        seed: 5
        complexity: quick
        east: 15
        north: 15
        height: {value: 5, unit: m}
      tree:
        recipe: spruce
        seed: 5
        complexity: quick
        east: 2
        north: 17
        height: {value: 0, unit: m}
      campfire:
        kind: campfire
        seed: 5
        complexity: quick
        east: 22
        north: 11
        height: {value: 0, unit: m}
      flame:
        recipe: flames
        seed: 5
        east: 22
        north: 11
        height: {value: 0, unit: m}
  film:
    width: 640
    height: 400
    rays: 1
    wide: 40
    exposure: 1
  cameras:
    arrival:
      location: {at: [35, -12, 16]}
      orientation: {look_at: [15, 15, 4]}
  world:
    unit: 1
    materials:
      bronze:
        colour: {srgb_linear: [0.52, 0.34, 0.19]}
        source: eye
      pad:
        colour: {srgb_linear: [0.055, 0.07, 0.095]}
        source: eye
    boxes:
      landing-pad:
        material: pad
        middle: [15, 15, -0.12]
        size: [36, 36, 0.24]
        source: eye
    imports:
      visitor:
        file: larson-camp-visitor.glb
        height: {value: 2, unit: m}
        at: [23.5, 12, 0]
        heading: {value: 0, unit: deg}
        materials: {material/0/visitor: bronze}
        source: "Meshcapade and Max Planck Institute for Intelligent Systems SMPL-X sample (Pavlakos et al. 2019). Slayer triangulated, posed, and exported the sample, and normalized it to two metres. Attribution and licence: https://smpl.is.tue.mpg.de/bodylicense.html"
        license: CC-BY-4.0
    sky:
      horizon: {srgb_linear: [0.022, 0.027, 0.05]}
      zenith: {srgb_linear: [0.004, 0.007, 0.02]}
      ground: {srgb_linear: [0.01, 0.013, 0.022]}
      source: eye
    suns:
      key:
        toward: [-4, -5, 7]
        colour: {srgb_linear: [8, 7, 5.5]}
        source: eye
      rim:
        toward: [8, 4, 4]
        colour: {srgb_linear: [0.8, 1.1, 1.8]}
        source: eye
