# Ferruccio first play: native Larson and authored two-metre scale human.
# Coordinates are east, north, up in metres; height is elevation in space.
# The ship uses seed 5 and the quick geometry budget.
# The posed visitor is normalized to exactly 2 m.
# Pad, colours, camera and studio lights are authored display choices.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: Larson playground
  seed: 5
  setting: space
  light: none
  set:
    things:
      larson:
        kind: mcrn-larson-landed
        seed: 5
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
  film:
    width: 640
    height: 400
    rays: 1
    wide: 40
    exposure: 1
  cameras:
    arrival:
      location: {at: [18, -24, 12]}
      orientation: {look_at: [1, 0, 2]}
  world:
    unit: 1
    materials:
      bronze:
        colour: {srgb_linear: [0.52, 0.34, 0.19]}
        source: eye
      pad:
        colour: {srgb_linear: [0.055, 0.07, 0.095]}
        source: eye
    boxes:
      landing-pad:
        material: pad
        middle: [0, 0, -0.12]
        size: [28, 28, 0.24]
        source: eye
    imports:
      visitor:
        file: larson-camp-visitor.glb
        height: {value: 2, unit: m}
        at: [7, 1, 0]
        heading: {value: 0, unit: deg}
        materials: {material/0/visitor: bronze}
        source: "Meshcapade and Max Planck Institute for Intelligent Systems SMPL-X sample (Pavlakos et al. 2019). Slayer triangulated, posed, and exported the sample, and normalized it to two metres. Attribution and licence: https://smpl.is.tue.mpg.de/bodylicense.html"
        license: CC-BY-4.0
    sky:
      horizon: {srgb_linear: [0.022, 0.027, 0.05]}
      zenith: {srgb_linear: [0.004, 0.007, 0.02]}
      ground: {srgb_linear: [0.01, 0.013, 0.022]}
      source: eye
    suns:
      key:
        toward: [-4, -5, 7]
        colour: {srgb_linear: [8, 7, 5.5]}
        source: eye
      rim:
        toward: [8, 4, 4]
        colour: {srgb_linear: [0.8, 1.1, 1.8]}
        source: eye
