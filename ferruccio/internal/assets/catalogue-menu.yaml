# Authored descriptions of the current factory, 2026-11-07.
# Listed detail support is held to actual construction by command tests.
entries:
  - kind: city-clustered-green-10000
    group: City buildings
    about: Clustered city districts with native tree rows, groves and meadow clearings.
    notes: >-
      Exactly ten thousand buildings, native valley-oak leaf-cell prototypes shared
      across park groves and street rows, curved park paths and planted vacant
      lots. Authored metre-scale scenery with connected elevated highways.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 55
  - kind: city-clustered-night-10000
    group: City buildings
    about: A native green city with discrete occupied and unlit facade windows.
    notes: >-
      Warm and cool panes vary by building and window. Six actual downward
      fixtures illuminate ramp streets and park paths; surface emission does
      not claim indirect road lighting. Native tree prototypes remain shared.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 55
