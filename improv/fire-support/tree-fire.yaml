# fire support, 2026-11-10: the tree fire, the recipe the passing
# front sets on each tree of the grove in doc/fire-night.yaml, here on
# one spruce, for the catalogue's still. The recipe is copied
# whole; the stage is the wood-fire study's ground at night.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v1.json
scene:
  name: the tree fire on one spruce
  renderer: gpu-native
  seed: 7
  light: none
  location: {lat: 19.4165, lon: -155.2485}
  timeofday: 1900
  terrain:
    from: usgs-kilauea-2019-dem
    file: unpacked/kil_2019dem/kil_2019dem.tif
    west: 263740
    north: 2148820
    across: 144
    down: 144
    step: 1
  recipes:
    plant-spruce: {plant: {family: conifer, file: ../../manufacture/plants/conifers/conifer-profiles.yaml, species: spruce}}
    tree fire:
      kind: fire
      flame:
        radius: {value: 0.8, unit: m}
        height: {value: 20, unit: m}
        absorption: {value: 0.25, unit: m^-1}
        temperature: {value: 1800, unit: K}
        edge-temperature: {value: 950, unit: K}
        intermittency-start: 0.06
        temperature-profile: hot-tongues
      sparks:
        rate: {value: 3, unit: s^-1}
        lifetime: {value: 3, unit: s}
        radius: {value: 0.025, unit: m}
        release-height: {value: 10, unit: m}
        launch-speed: {value: 8, unit: m/s}
        spread: {value: 3, unit: m/s}
        updraft: {value: 6, unit: m/s}
        drag-time: {value: 0.8, unit: s}
        gravity: {value: 9.80665, unit: m/s^2}
        temperature: {value: 1650, unit: K}
        end-temperature: {value: 900, unit: K}
      light-cells: 3
      smoke:
        heat-release: {value: 20000, unit: kW}
        convective-fraction: 0.71
        soot-yield: 0.0024
        combustion: {value: 21, unit: MJ/kg}
        mass-extinction: {value: 10.6, unit: m^2/g}
        air-temperature: {value: 288, unit: K}
        air-density: {value: 1.2, unit: kg/m^3}
        height: {value: 65, unit: m}
        albedo: 0.3
  set:
    things:
      the tree:
        recipe: plant-spruce
        seed: 3
        east: 263812
        north: 2148748
      the fire:
        recipe: tree fire
        seed: 5
        east: 263812
        north: 2148748
  film:
    width: 1920
    height: 1200
    rays: 2
    exposure: 200
  cameras:
    back from the tree:
      location:
        loc_relative:
          object: the tree
          standoff_x: 6
          standoff_y: -24
          standoff_z: 1.6
      orientation:
        point_to: the tree
        alpha: 24
