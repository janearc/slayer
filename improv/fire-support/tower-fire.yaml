# fire support, 2026-11-10: moonlake's tower fire, bursting from a stage
# tower's top deck as improv/moonlake/passes writes it now: 8 sources
# over 5 m, 24 m flames, standing 20.9 m up on the flame units. On
# the wood-fire study ground at night, for the catalogue's still.
# No $schema line, as sets/moonlake.yaml has none: the v1 and v2 schemas'
# kind lists have no stage lights, scaffold or tower yet.
scene:
  name: moonlake's tower fire on a stage tower
  renderer: gpu-native
  seed: 7
  light: none
  location: {lat: 19.4165, lon: -155.2485}
  timeofday: 1900
  terrain:
    from: usgs-kilauea-2019-dem
    file: unpacked/kil_2019dem/kil_2019dem.tif
    west: 263700
    north: 2148860
    across: 224
    down: 224
    step: 2
  recipes:
    the moonlake fire:
      kind: fire
      layout:
        pattern: cluster
        count: 8
        radius: {value: 2.5, unit: m}
        height-variation: 0.5
      flame:
        radius: {value: 2, unit: m}
        height: {value: 24, unit: m}
        absorption: {value: 0.12, unit: m^-1}
        temperature: {value: 1900, unit: K}
        edge-temperature: {value: 1100, unit: K}
        intermittency-start: 0.06
        temperature-profile: hot-tongues
      sparks:
        rate: {value: 400, unit: s^-1}
        lifetime: {value: 4, unit: s}
        radius: {value: 0.12, unit: m}
        release-height: {value: 16, unit: m}
        launch-speed: {value: 25, unit: m/s}
        spread: {value: 8, unit: m/s}
        updraft: {value: 20, unit: m/s}
        drag-time: {value: 0.8, unit: s}
        gravity: {value: 9.80665, unit: m/s^2}
        temperature: {value: 1650, unit: K}
        end-temperature: {value: 900, unit: K}
      light-cells: 4
  set:
    things:
      the tower:
        kind: stage-tower
        seed: 91
        east: 263812
        north: 2148748
        heading: {value: 340, unit: deg}
      the fire:
        recipe: the moonlake fire
        seed: 84
        east: 263812
        north: 2148748
        height: {value: 20.9, unit: m}
  film:
    width: 1920
    height: 1200
    rays: 2
    exposure: 100
  cameras:
    before the tower:
      location:
        loc_relative:
          object: the tower
          standoff_x: 14
          standoff_y: -38
          standoff_z: 3
      orientation:
        point_to: the tower
        alpha: 30
