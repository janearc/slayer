# Diagnostic model study; authored studio lighting, not the final grade.
# Authored catalogue display controls, 2026-11-07.
# Distances scale with each specimen's bounding radius. No measured lighting.
width: 480
height: 320
rays: 2
seed: 5
details: [demo]
wide: 50
camera: {x: 1.4, y: 0.8, z: -2}
distance: 2.8
sample-limit: 2000000
face-limit: 1500000
pixel-aspect: 1
light-exposure: 0.001
minimum-coverage: 0.0001
sky:
  # A uniform backdrop keeps the camera's roll from revealing a sky seam.
  horizon: {r: 0.012, g: 0.02, b: 0.045}
  zenith: {r: 0.006, g: 0.01, b: 0.025}
  ground: {r: 0.003, g: 0.004, b: 0.008}
sources:
  - toward: {x: -1, y: 2, z: -2}
    strength: {r: 0.07, g: 0.12, b: 0.25}
  - toward: {x: 2, y: 1, z: 1}
    strength: {r: 0.025, g: 0.04, b: 0.08}
tone: {exposure: 1, knee: 0.7, top: 8, bloom: 0}
studio: true
cutaway: false
local-lights:
  - at: {x: -7, y: 20, z: -4}
    strength: {r: 180, g: 90, b: 25}
  - at: {x: 7, y: 20, z: -4}
    strength: {r: 180, g: 90, b: 25}
