# Authored test examples, chosen for the memory design.
# These are byte-ledger fixtures, not measured host memory or runtime policy.
# Full-width values are decimal uint64 values, never floating-point numbers.
unreserved_capacity:
  - name: empty ledger
    limit: 12
    reserved: 0
    requested: 4
  - name: some already reserved
    limit: 12
    reserved: 3
    requested: 4
  - name: one byte remains
    limit: 12
    reserved: 10
    requested: 1
  - name: smallest reservation
    limit: 2
    reserved: 0
    requested: 1
kept_reservations:
  - name: existing reservation consumes the gap
    limit: 12
    reserved: 9
    requested: 4
  - name: existing reservation leaves no room
    limit: 12
    reserved: 12
    requested: 1
  - name: largest possible reservation
    limit: 18446744073709551615
    reserved: 18446744073709551615
    requested: 1
  - name: request alone exceeds the limit
    limit: 2
    reserved: 0
    requested: 3
exact_fits:
