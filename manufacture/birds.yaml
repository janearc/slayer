# The birds, one row a species, for the one bird maker in bird.go.
#
# Every figure says where it came from in its basis. read is a figure
# read on the page its source names. picked is chosen to look right, as
# a bird of that sort is seen, and has no source. A range is where a
# seed picks from: a bigger bird is bigger in every length, so no two
# are alike.
#
# Lengths are metres: length is bill tip to tail tip, wingspan tip to
# tip, bill the exposed bill, tarsus the bare tarsus. head, neck and
# tail are shares of the length less the bill; the trunk takes the
# rest. depth and width are shares of the trunk. arm is the wing's
# bones, a share of the half span outside the body; humerus and forearm
# are shares of the arm, the hand the rest. tibia, femur and toe (the
# middle toe) are shares of the tarsus. secondary is a secondary's
# length, a share of the longest primary. bill-depth and bill-width are
# the bill's base, and spatula the spoon's width, shares of the bill.
# stance is the trunk's rise standing, neck-bend the turn of each neck
# joint, bill-tilt the bill below level standing, all in radians.
#
# A colour is a diffuse reflectance, red, green and blue, from nought
# to one. Its words are the source's for that region; the numbers are
# always picked from those words. A region no page described says so.
#
# The quotes from Wikipedia and the Hong Kong Bird Watching Society were
# read through a fetching tool's summary of each page, not from the
# page's own text; see the report.
read: >-
  English Wikipedia species pages; the Hong Kong Bird Watching Society's
  avifauna pages; the Cook Islands Biodiversity Database of the Bishop
  Museum; Italian Wikipedia for the gull's range. Each figure names its
  page.
