# The fish: four species of a kelp coast, each a row. One maker,
# fish.go, reads every row; a species more is a row more.
#
# A fish's own space: metres, y up, x along the body, the snout toward
# plus x, the fork of the tail toward minus x, the middle of the length
# at x nought and the body's axis at y nought, the left side toward
# plus z. Shares are of the fork length, from the snout, unless a name
# says otherwise.
#
# Every figure has a basis. read is a figure taken from the page its
# source names, as written there. derived is worked from figures read,
# and its source gives the working. picked is chosen to look right; its
# source, where it has one, says what was read that the choice keeps
# within. A figure is a range a seed picks from, so no two fish of a
# species are alike; a count is picked as a whole number.
#
# The pages read:
#   FishBase species summaries, fishbase.se/summary/<Genus-species>.html,
#     for Thunnus orientalis, Seriola dorsalis, Sphyraena argentea and
#     Sardinops sagax.
#   FishBase morphology summaries, nrm-fishbaselinux01.nrm.se/physiology/
#     <Genus_species>, for Thunnus thynnus (main reference Collette and
#     Nauen 1983) and Sphyraena argentea (main reference Hart 1973).
#     The Pacific bluefin's own morphology page gives no fin counts, so
#     its counts are its Atlantic congener's, and say so.
#   Wikipedia, "Seriola dorsalis" (its body text cites Feder, Turner and
#     Limbaugh 1974, Fish Bulletin 160; its lengths the California
#     Department of Fish and Wildlife 2022 status report).
#   Wikipedia, "Pacific barracuda" (its body text cites MarineBio and the
#     Encyclopedia of Life).
#   Wikipedia, "Shoaling and schooling", for how closely a school packs.
read: >-
  FishBase species and morphology summaries; Wikipedia's Seriola
  dorsalis, Pacific barracuda, and Shoaling and schooling pages. Each
  figure names its own.

