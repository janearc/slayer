read: >-
  Schroeder, Bayandor and Samareh, "Impact and Crashworthiness
  Characteristics of Venera Type Landers for Future Venus Missions"
  (NASA Technical Reports Server, 20170002533; brought home through
  celestial-data's ntrs-fetch and read 2026-11-15). Page 2: the lander
  entered "encapsulated in a 2.4 m spherical heat shield", and "The
  payload module was roughly one meter in diameter, 80 cm diameter
  pressure vessel with the remaining thickness contributed to by the
  insulation". Page 3: "There were 18 legs that connected the payload
  module to the impact ring". Page 16: "The Venera 9 and 10 landers mass
  were 660 kg each". Its Figure 17, page 21, gives, for the model its authors
  made of the lander as flown, "Payload Height 0.65 m", "Impact Ring
  Radius 0.9 m" and "Drag Plate Radius 2.15 m". The plate rode inside
  the 2.4 m shell, so it cannot be 4.3 m across: 2.15 m is taken here as
  how far across it is, which is this file's reading and not the
  report's words. The payload height, "the distance the payload module
  initially was above the impact ring", is taken as from the ring's
  middle to the module's middle: also this file's reading. The ring's
  tube, the legs' thickness, the plate's thickness, and the can's width
  and height are picked, by eye from the report's Figure 1, page 2, a
  photograph of Venera 9's lander; the can was 0.9 m across until the
  aerial went on it, and is 0.8 m since, for in Figure 1 it is a little
  over a third as wide as the plate. The can's core, its cap and the ten
  turns of the aerial, drawn as flat ribs, are picked by eye from Figure
  1 and from the museum models on a reference sheet of pictures of the
  lander gathered 2026-11-15. The plate's dish, the lip and rim round
  its edge, the collar under its middle (its hub) and its twelve stays
  are picked by eye from Figure 1, where the lip shows, and from that
  sheet, where the stays show under the plate. Page 10: "the original
  Venera lander, utilized a Tri-leg configuration with 18 total legs";
  that the legs stand three to a foot, six feet round the ring, is this
  file's reading of the name and of Figure 15(c), page 19, and the
  brackets at the feet and the bosses where the legs meet the module
  are picked by eye from Figure 1. The ring's width, wider than it is
  tall as the flat band of Figure 1, is picked; so are the ninety
  triangular teeth round its outer edge and their size, by eye from
  Venera 13's own photographs on the reference sheet, where the teeth
  stand along the ring's top. Page 3: "the impact ring had holes
  perforating the outer surface of the metallic shell"; their number
  (72) and size are picked by eye from Figure 1, where they show as a
  row round the ring's wall. The dark skirt of upright slats under the
  module, its width, height and thirty-six slats, is picked by eye from
  Figure 1. The plate's seams, two rings and one straight seam over each
  stay, and the bolt rings, round the plate's lip, along both edges of
  the band where Figure 1 shows rows of rivets round the body, and round
  the can's cap, are picked by eye from Figure 1 and the reference
  sheet, with the bolts' size and counts. The cable round the module
  above its fittings and the cables from the round fittings up over the
  module's shoulder are picked. The two pipes that come down from under
  the plate and bend in to the module, and the two booms rising from the
  ring with white egg-shaped heads, are picked by eye from Figure 1,
  which shows both; what the booms carried is not in the report or the
  sheet. On the can, the sixteen upright stiffeners on its core that
  show between the aerial's turns, the aerial's lead winding down to the
  plate, and the four lugs on the cap's flange are picked by eye from
  Figure 1. Round the module, the
  band where the museum models carry their lettering (its height and
  how proud it stands), the two camera housings and their windows, and
  the twelve fittings round the equator, every other one a box, with
  their sizes, are picked by eye from that sheet. Outside, the
  instruments as Venera 13's photographs show them after landing: the
  spring-loaded arm, a ladder-like scale of two rails and nine rungs
  lying flat on the ground, deployed out from the ring's wall and
  pointing away from the lander, with a pad at its far end; the two white lens
  caps, curved shells lying beyond the ring; and a colour chart of four
  patches on posts on the ring. Every size and place of these is picked
  by eye from those photographs, and the chart's patches are picked
  colours, not read ones. Every coat's colour is
  picked from that sheet: a warm grey body with a darker band, the plate a brown-orange
  with its stays darker, the arm and the lens caps white as they show
  in Venera 13's photographs, the aerial lighter than the can it is wound
  on, as Figure 1 shows it. NSSDCA's own records of these landers were
  asked for the same day and did not come.
