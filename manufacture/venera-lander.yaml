  count: 18
  strut: 0.03
  boss: 0.03
  foot: {wide: 0.12, tall: 0.05, deep: 0.14}
module:
  across: 1.0
  vessel: 0.8
  height: 0.65
  band: 0.14
  proud: 0.012
  window: 0.09
  housing: 0.14
  fittings: 12
  box: {wide: 0.1, tall: 0.08, deep: 0.08}
plate:
  across: 2.15
  thick: 0.03
  dish: 0.04
  lip: 0.06
  rim: 0.05
  hub: 0.6
  stay: 0.035
  stays: 12
  seam: 0.012
bolt: 0.008
bolts: {plate: 48, band: 48, cap: 24}
cable: 0.008
pipe: 0.02
booms: {strut: 0.012, head: 0.14, girth: 0.09}
can:
  across: 0.8
  height: 0.7
  core: 0.7
  cap: 0.06
  ribs: 10
  stiffeners: 16
  lugs: 4
