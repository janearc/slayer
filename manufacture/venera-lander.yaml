# The lander of Venera 9 to 14, which Vega 1 and 2 carried again,
# standing on its impact ring, in metres. A number here was read off a
# page, and `read` says which; where it says picked, nobody read it
# anywhere, and it was chosen by eye from a picture `read` names.
#
# From the ground up: a hollow ring that crushed on landing, eighteen
# short legs, the payload module, a round pressure vessel in its
# insulation, a flat drag plate that slowed the fall through the thick
# air, and on top the can that held the parachutes, with the aerial
# wound round it.
shell: 2.4
ring:
  radius: 0.9
  tube: 0.09
  wide: 0.22
  teeth: 90
  tooth: {tall: 0.08, base: 0.06, thick: 0.006}
  holes: 72
  hole: 0.012
skirt:
  across: 0.86
  tall: 0.12
  slat: 0.02
  slats: 36
