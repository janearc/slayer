# Street-level retail, 2026-11-19, detailed 2026-11-20: the shopfronts at
# the foot of a city street, as data. Each unit type below is one
# shopfront. A frontage is a row of them, drawn from the seed with a rule
# that no two of a kind stand side by side. Every value is picked, not
# measured, by eye, from what a person sees from the pavement: awnings with
# valances, roll-down shutters, windows full of goods, lit rooms, sign
# boards, pay stations, pipes and meters.
#
# Places are metres in a unit's own frame. x runs along the front from the
# unit's left edge as a person in the street sees it; y is up from the
# pavement; z is out into the street, so the wall plane is z nought and a
# room lies at negative z. A unit is a whole number of the city's bays
# wide (manufacture/city-choices.yaml, bay-pitch), from bays to bays-most
# as the seed draws, and a storey tall (its storey-max), the height of a
# city building's ground floor. Places are given for the unit at its
# least width.
#
# A part is a box [x0 y0 z0 x1 y1 z1], a prism [x y z radius length], a
# round solid about its middle with its axis y (up) unless axis says x or
# z, or a slab [x0 x1 z0 y0 z1 y1 thick], a plank whose underside runs from
# the height y0 at z0 to the height y1 at z1, thick measured straight up.
# count and step repeat a part. from is the first detail level that draws
# it: hull (the default), quick or demo. At hull a shopfront is a lit
# opening and its biggest things; at quick it has its door, counter,
# awning, sign frame and services; at demo, its stools, goods and
# hardware. sides is how many sides a prism has (ten if not said).
#
# When a unit is wider than its least, along says how a part, a light or a
# module moves: right carries it with the right edge, centre with the
# middle, fill stretches it, or, for a part that repeats along x, adds to
# its count. An opening stretches if the unit says stretch.
#
# A material named "@name" is the one the unit's seed picks from the
# palette of that name. A module is a set of parts that units share, put
# in a unit with uses. An option is a choice the seed makes for a unit:
# with its chance it takes one of its variants, by their weights; wide
# is the fewest bays the unit has to be to be offered it.
#
# A light is a point: its kelvin heat and its luminance at a metre in the
# kit's relative light, as a set's lamp is given. The tracer lights by
# lamps and not by what glows, so every glowing thing that should throw
# light on the pavement has a lamp with it. A lamp's light starts 0.3 m
# from it, and what stands inside that distance does not shade it: so a
# lamp 0.2 m behind a pane of glass lights the pavement through it, and
# one further back does not. Lamps stand at least a metre from the wall
# they would otherwise glare on.
#
# A unit's sign slot [x0 y0 x1 y1] is a named place on its wall plane for a
# lettered sign made by another kind. The frontage draws nothing in it but
# a frame round it, from the sign-frame module, which a sign stands in.
run:
  units: 8
shell:
  # floor is the height of a unit's floor above the pavement: a step.
  floor: 0.15
  # slab is the thickness of the ceiling slab under the storey above.
  slab: 0.25
  # wall is the thickness of the front wall.
  wall: 0.3
  # partition is the thickness of the back and side walls.
  partition: 0.2
grounds:
  # the kinds of building that may stand on a podium of shops, by weight.
  buildings: {tower: 3, terrace-midwest: 1, terrace-san-francisco: 1, terrace-portofino: 1}
  # podium is how far the shops' front stands out from the building's
  # front, metres: the deepest room, and a little over.
  podium: 7.2
  # margin is plain wall at each end of the shops, metres.
  margin: 0.6
  # pool is how many distinct units of each type a block draws from.
  pool: 12
  filler: wall-filler
