  awning: [awning-red, awning-navy, awning-ochre, awning-green, awning-charcoal]
  frame: [aluminium, frame-black, frame-green, frame-red, wood]
  wall: [plaster-dark, wall-teal, wall-maroon, wall-ink, wall-grey]
  brick: [brick-dark, brick-umber, brick-soot]
  shutter: [shutter, shutter-green, shutter-rust, shutter-blue]
