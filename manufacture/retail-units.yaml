modules:
  # An awning on arms, sloping down and out from the wall, with a valance
  # hanging from its edge. Its origin is where its top meets the wall. At
  # demo it is striped.
  awning:
    says: an awning on two arms with a valance and a trim
    width: 3.4
    parts:
      - {says: the rail it hangs from, material: steel, box: [0, -0.04, 0.0, 3.4, 0.08, 0.1], along: fill, from: quick}
      - {says: the slope, material: "@awning", slab: [0, 3.4, 0.03, 0.0, 1.1, -0.42, 0.035], along: fill, from: quick}
      - {says: the valance, material: "@awning", box: [0, -0.68, 1.07, 3.4, -0.37, 1.11], along: fill, from: quick}
      - {says: the valance's trim, material: awning-trim, box: [0, -0.71, 1.065, 3.4, -0.68, 1.115], along: fill, from: quick}
      - {says: the left arm, material: steel, slab: [0.4, 0.44, 0.0, -0.013, 1.06, -0.429, 0.025], from: quick}
      - {says: the right arm, material: steel, slab: [2.96, 3.0, 0.0, -0.013, 1.06, -0.429, 0.025], along: right, from: quick}
      - {says: stripes on the slope, material: awning-trim, slab: [0.0, 0.18, 0.05, 0.0302, 1.08, -0.3741, 0.004], count: 9, step: [0.36, 0, 0], along: fill, from: demo}
  # A flat canopy with a lip, hung from two rods.
  canopy:
    says: a flat canopy over the front with a lip and two rods
    width: 3.4
    parts:
      - {says: the slab, material: "@awning", box: [0, 0.0, 0.0, 3.4, 0.1, 1.0], along: fill, from: quick}
      - {says: the lip, material: "@awning", box: [0, -0.2, 0.96, 3.4, 0.1, 1.04], along: fill, from: quick}
      - {says: the left brace, material: steel, slab: [0.3, 0.34, 0.0, -0.45, 0.95, -0.03, 0.03], from: quick}
      - {says: the right brace, material: steel, slab: [3.06, 3.1, 0.0, -0.45, 0.95, -0.03, 0.03], along: right, from: quick}
  # The frame round a sign slot, which a lettered sign stands in. Its
  # origin is 0.06 m left of and below the slot, which is 0.5 m high.
  sign-frame:
    says: four boards round a blank slot for a sign
    width: 2.6
    parts:
      - {says: the bottom board, material: board-dark, box: [0, 0, 0, 2.6, 0.06, 0.07], along: fill, from: quick}
      - {says: the top board, material: board-dark, box: [0, 0.56, 0, 2.6, 0.62, 0.07], along: fill, from: quick}
      - {says: the left board, material: board-dark, box: [0, 0.05, 0, 0.06, 0.57, 0.07], from: quick}
      - {says: the right board, material: board-dark, box: [2.54, 0.05, 0, 2.6, 0.57, 0.07], along: right, from: quick}
  # A glass door in a frame, its handle, hinges and kick plate, on a step
  # with a mat. Its origin is the door's lower left corner on the pavement.
  door-glass:
    says: a glass door with a frame, a handle, hinges, a kick plate and a step
    width: 1.1
    parts:
      - {says: the left jamb, material: "@frame", box: [0, 0.15, -0.04, 0.07, 2.29, 0.06], from: quick}
      - {says: the right jamb, material: "@frame", box: [1.03, 0.15, -0.04, 1.1, 2.29, 0.06], from: quick}
      - {says: the head, material: "@frame", box: [0, 2.23, -0.04, 1.1, 2.3, 0.06], from: quick}
      - {says: the kick plate, material: steel, box: [0.07, 0.15, -0.04, 1.03, 0.42, 0.065], from: quick}
      - {says: the glass, material: glass, box: [0.06, 0.43, -0.02, 1.04, 2.24, 0.0], from: quick}
      - {says: the middle rail, material: "@frame", box: [0.07, 1.02, -0.04, 1.03, 1.08, 0.05], from: demo}
      - {says: the handle's bar, material: aluminium, box: [0.9, 0.96, 0.1, 0.94, 1.54, 0.14], from: quick}
      - {says: the handle's posts, material: aluminium, box: [0.9, 1.0, 0.06, 0.94, 1.04, 0.1], count: 2, step: [0, 0.46, 0], from: demo}
      - {says: the hinges, material: steel, box: [0.0, 0.5, 0.06, 0.05, 0.62, 0.09], count: 3, step: [0, 0.75, 0], from: demo}
      - {says: the step, material: concrete, box: [-0.08, 0.0, -0.03, 1.18, 0.15, 0.5], from: quick}
      - {says: the mat, material: "@mat", box: [0.1, 0.15, 0.12, 1.0, 0.165, 0.45], from: demo}
  # A sliding door of two leaves, one of them slid open, in a frame on a
  # track. Its origin is the left of the frame on the pavement.
  door-sliding:
    says: a sliding glass door with one leaf open, on a track and a step
    width: 1.8
    parts:
      - {says: the left jamb, material: "@frame", box: [0, 0.15, -0.04, 0.07, 2.29, 0.06], from: quick}
      - {says: the right jamb, material: "@frame", box: [1.73, 0.15, -0.04, 1.8, 2.29, 0.06], from: quick}
      - {says: the head, material: "@frame", box: [0, 2.23, -0.04, 1.8, 2.3, 0.06], from: quick}
      - {says: the track, material: steel, box: [0.07, 0.15, -0.04, 1.73, 0.19, 0.06], from: quick}
      - {says: the shut leaf's glass, material: glass, box: [0.06, 0.2, -0.02, 0.93, 2.23, 0.0], from: quick}
      - {says: the leaf's stiles, material: "@frame", box: [0.07, 0.2, -0.03, 0.13, 2.22, 0.02], count: 2, step: [0.8, 0, 0], from: demo}
      - {says: the leaf's top rail, material: "@frame", box: [0.07, 2.17, -0.03, 0.93, 2.23, 0.02], from: demo}
      - {says: the leaf's bottom rail, material: "@frame", box: [0.07, 0.19, -0.03, 0.93, 0.45, 0.02], from: demo}
      - {says: the leaf's pull, material: aluminium, box: [0.78, 1.0, 0.02, 0.81, 1.5, 0.05], from: demo}
      - {says: the step, material: concrete, box: [-0.08, 0.0, -0.03, 1.88, 0.15, 0.5], from: quick}
      - {says: the mat, material: "@mat", box: [0.1, 0.15, 0.1, 1.7, 0.165, 0.45], from: demo}
  # A heavy steel door with a frame, a bulb beside it on a bracket, a
  # handle, a peephole, hinges and a kick plate, on a step. Its origin is
  # the door's lower left corner on the pavement.
  door-steel:
    says: a heavy steel door, its frame, a bulb on a bracket, a step
    width: 1.1
    parts:
      - {says: the door, material: door-steel, box: [0, 0.15, 0.0, 1.1, 2.3, 0.1], from: quick}
      - {says: the frame's sides, material: "@frame", box: [-0.06, 0.15, -0.02, 0.0, 2.35, 0.12], from: quick}
      - {says: the frame's right side, material: "@frame", box: [1.1, 0.15, -0.02, 1.16, 2.35, 0.12], from: quick}
      - {says: the frame's head, material: "@frame", box: [-0.06, 2.3, -0.02, 1.16, 2.36, 0.12], from: quick}
      - {says: the kick plate, material: steel, box: [0.04, 0.15, 0.1, 1.06, 0.4, 0.115], from: quick}
      - {says: the handle's bar, material: aluminium, box: [0.85, 0.98, 0.14, 0.9, 1.42, 0.18], from: quick}
      - {says: the handle's posts, material: aluminium, box: [0.85, 1.02, 0.1, 0.9, 1.06, 0.14], count: 2, step: [0, 0.32, 0], from: demo}
      - {says: the peephole, material: steel, prism: [0.55, 1.62, 0.1, 0.03, 0.025], axis: z, sides: 6, from: demo}
