  screen-b: [screen-cyan, screen-yellow, screen-magenta]
  mat: [mat-black, mat-red, mat-green]
  machine-a: [vending-red, vending-yellow]
  machine-b: [vending-blue, vending-green]
  machine-c: [vending-green, vending-yellow, vending-blue]
  lantern: [lantern-red, lantern-amber, lantern-white]
