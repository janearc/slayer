    kind: picked
    by: Slayer's recursive-foliage study, 2026-11-03
  - name: redwood-branchlet-maximum
    value: 18
    says: authored branchlet count per main-branch segment, upper endpoint
    kind: picked
    by: Slayer's recursive-foliage study, 2026-11-03
  - name: redwood-branchlet-length
    value: 0.6
    says: maximum branchlet length as a share of the whole primary branch
    kind: picked
    by: Slayer's recursive-foliage study, 2026-11-03
  - name: shoot-orders
    value: 2
    says: two recursive lateral orders below each existing branchlet axis
    kind: picked
    by: Slayer's recursive-foliage study, 2026-11-03
  - name: shoot-first-laterals
    value: 16
    says: lateral buds on a prototype's first axis
    kind: picked
    by: Slayer's recursive-foliage study, 2026-11-03
  - name: shoot-second-laterals
    value: 8
    says: lateral buds on its next branching order
