# The winnebago, 2026-11-19. A motorhome of the common American kind: a
# tall box body, a lower box cab at its front, six wheels (one front axle
# and a rear pair), a windscreen, side windows and an entry door on the kerb
# side. No dimension is measured. Each says in its "by" whether it was picked
# as a round figure or set by eye against what such a vehicle looks like.
# Dimensions are metres, except where a unit says otherwise; counts have no
# unit; colours are shares of light, each channel from zero to one, and
# gloss is how much of a mirror a surface is. The circle side counts, for
# the wheels, are in yurt.yaml: the designs share them.
#
# The vehicle faces along z, front toward positive z. Its kerb side, the
# side of the road the vehicle stops at in traffic that keeps right, is the
# negative x side, and the entry door is there. Places along its length are
# metres from the middle of the body, forward positive.
