# Rows of terraces along the contours of a steep hillside, 2026-11-20. The
# fall line, the way the ground drops fastest, is read from the ground
# itself, never picked. What is picked is how far either side of a place
# it is read, and how flat the ground may be before it has no fall line.
- name: contour-span
  value: 20
  unit: m
  says: the distance either side of a place over which the fall of the ground is read, a few times the finest step a window is cut at, so that the corners of a window's cells do not turn a row
  kind: picked
  by: "cliff terraces study, 2026-11-20, by eye"
- name: least-fall
  value: 0.02
  says: the least rise of the ground over a metre of run at which a place has a fall line; flatter ground has no one way down, and a row cannot follow its contour
  kind: picked
  by: "cliff terraces study, 2026-11-20, by eye"
