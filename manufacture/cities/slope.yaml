# Buildings on a slope, 2026-11-19. A building stands on a plinth that
# reaches the lowest ground under it; the plinth's height is worked out from
# the ground, never picked. What is picked is how finely the ground under a
# footprint is looked at, and the plinth's concrete. Dimensions are metres,
# colours are shares of light, each channel from zero to one, and gloss is
# how much of a mirror a surface is.
numbers:
- name: footing-step
  value: 1
  unit: m
  says: the distance between the places the ground is read under a footprint, which are spread evenly over it with a place at each corner
  kind: picked
  by: "slope study, 2026-11-19"
- name: plinth-red
  value: 0.22
  says: red share of the plinth's concrete
  kind: picked
  by: "slope study, 2026-11-19, by eye"
- name: plinth-green
  value: 0.21
  says: green share of the plinth's concrete
  kind: picked
  by: "slope study, 2026-11-19, by eye"
- name: plinth-blue
  value: 0.2
  says: blue share of the plinth's concrete
  kind: picked
  by: "slope study, 2026-11-19, by eye"
- name: plinth-gloss
  value: 0.05
  says: gloss of the plinth's concrete
  kind: picked
  by: "slope study, 2026-11-19, by eye"
# The room a lattice gives a terrace or a condominium, so that a stand of
# them is laid in streets on a hillside. A terrace's front looks along the
# lane, so its length stands across the lane (the pitch's width) and its
# depth along it. The streets run north and south and the fronts look north,
# down a slope that faces the bay.
