# The bivouac, 2026-11-19. Our lowest-density structure: a one-person bivy
# sack lying on the ground, its guy lines and stakes, a pack and a pair of
# boots beside it, and sometimes a small stove. Every value is picked, not
# measured. Dimensions are metres, except where a unit says otherwise;
# counts have no unit; shares are from nought to one; colours are shares of
# light, each channel from zero to one, and gloss is how much of a mirror a
# surface is. The circle side counts, for the stove's round parts, are in
# yurt.yaml: the designs share them.
#
# The sack lies along z with its head, and the hoop over it, toward positive
# z. Places across are x from its middle, and places along are z from its
# middle.
