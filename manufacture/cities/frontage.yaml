# The room a frontage gives what it lays at a spacing along a line: trees on
# a quay, boats along a wall. Each name is the kind, a hyphen, and what the
# fact is. Every value is picked. Dimensions are metres, turns are degrees.
#
# A boat's bow is toward minus z and a thing's front is plus z, so a boat
# whose front is turned half a turn from the line's direction has its bow
# along the line.
numbers:
- name: alder-frontage-spacing
  value: 9
  unit: m
  says: the room an alder takes along a quay, a crown's width and a little over
  kind: picked
  by: "frontage study, by eye"
