# The condominium, 2026-11-19. Two to four buildings of four or five
# storeys of stacked flats, drawn together round a shared paved court,
# each with a stair core standing a little proud of its front. Flat
# roofs with a parapet. No number is measured; each says whether it was
# picked as a figure or set by eye.
culture: condominium
says: blocks of stacked flats round one shared court
elements:
- element: buildings
  says: buildings round the court
  scope: district
  draw: range
  unit: buildings
  whole: true
  least: 2
  most: 4
  kind: picked
  by: "condominium study, 2026-11-19, picked from the brief"
- element: court-width
  says: width of the court, east to west, which is the length of the north and south buildings
  scope: district
  draw: range
  unit: m
  least: 28
  most: 34
  kind: picked
  by: "condominium study, 2026-11-19, by eye"
- element: court-depth
  says: depth of the court, north to south, which is the length of the east and west buildings
  scope: district
  draw: range
