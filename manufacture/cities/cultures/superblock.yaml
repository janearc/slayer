# The planned block and its accretion: one
# kind, planned at nought and grown over at one. The planned block is a
# podium of shops and parking with slabs of flats round a court; the
# accretion grows the court full and the roofs and walls over.
- {element: gate-power, says: "the power the accretion is raised to when it gates a feature, so that features come late and then fast", scope: district, draw: range, unit: power, least: 1, most: 1, kind: picked, by: "superblock planned study, 2026-11-19, picked so that a share at one is the share of the accreted study"}
- {element: accretion-draw, says: "the accretion of a block that draws its own, from planned to grown over", scope: district, draw: range, unit: accretion, least: 0, most: 1, kind: picked, by: "superblock planned study, 2026-11-19, picked, every degree as likely"}
- {element: default-occupants, says: "the people a block is planned for when a set does not say, which with the default parcel needs the default ceiling", scope: district, draw: range, unit: people, whole: true, least: 800, most: 800, kind: picked, by: "superblock planned study, 2026-11-19, picked: 960 square metres of slab at 7 a person, 6 storeys"}
- {element: default-crowding, says: "the crowding a block's people tolerate when a set does not say: occupancy over design", scope: district, draw: range, unit: crowding, least: 1, most: 1, kind: picked, by: "superblock planned study, 2026-11-19, picked, as designed"}
- {element: floor-per-person, says: "the floor of a flat a person is given at the design occupancy", scope: district, draw: range, unit: square metres a person, least: 7, most: 7, kind: picked, by: "superblock planned study, 2026-11-19, picked after the allocation standard Hong Kong public housing is said to use, 7 square metres a person; not checked against its source here"}
- {element: crush-limit, says: "the most people a square metre of floor holds, standing, which no floor's crowding passes", scope: district, draw: range, unit: people a square metre, least: 6, most: 6, kind: picked, by: "superblock planned study, 2026-11-19, from the city density plan, about six standing; a source is owed"}
