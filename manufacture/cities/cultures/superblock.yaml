# The superblock, 2026-11-19. Many buildings grown one plot at a time on
# one parcel, with no setbacks, fused into one mass: stacked flats with
# many small windows, narrow alleys left between, bridges across the
# alleys, cages and boxes hung on the walls, signs, and clutter on the
# roofs. Nothing here is measured; each number says it was picked, and
# by what. Lengths are metres, colours are shares of light.
culture: superblock
says: a parcel built over plot by plot until it is one mass
