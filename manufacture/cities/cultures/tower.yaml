  says: what a segment of a shaft is used for, which lights its windows at night
  scope: storey
  draw: options
  unit: weight
  options:
  - {name: office, weight: 4}
  - {name: home, weight: 1}
  kind: picked
  by: "skin study, 2026-11-19, picked"
