# Towers, 2026-11-19. Every distribution and threshold the tower
# generator draws from. A tower is drawn from a seed at an irregularity
# from nought to one: a feature that has a share here comes with that
# share at an irregularity of one, taken down by the irregularity raised to
# gate-power; a count that has a range reaches from its least toward its
# most as far as the irregularity takes it. At nought a tower is a plain
# block. Scopes here: a row is the whole tower, a bay is one shaft of it, a
# storey is one segment of a shaft, and an opening is one window or panel.
# No number is measured. Each says whether it was picked as a figure or
# set by eye. Lengths are metres; colours are shares of light, each channel
# from zero to one.
culture: tower
says: the draws of the tower generator, gated by irregularity
elements:
# how irregularity gates and is drawn
- {element: gate-power, says: "the power the irregularity is raised to when it gates a feature, so features come late and then fast", scope: row, draw: range, unit: power, least: 1, most: 1, kind: picked, by: "tower study, 2026-11-19, by eye, from 1.5 to make the strange ones plainer"}
- {element: skyline-draw, says: "the irregularity of a tower of a skyline, drawn; its power below makes most of them low", scope: row, draw: range, unit: irregularity, least: 0, most: 1, kind: picked, by: "tower study, 2026-11-19, picked"}
- {element: skyline-power, says: "the power the skyline's draw is raised to; the higher, the more towers are plain and the fewer strange", scope: row, draw: range, unit: power, least: 3, most: 3, kind: picked, by: "tower study, 2026-11-19, by eye, from 4 so a skyline of thirty has four to six strange towers"}
- {element: stack, says: "whether a shaft is a stack of flared modules", scope: bay, draw: share, unit: chance, share: 0.35, kind: picked, by: "tower study, 2026-11-19, picked"}
- {element: stack-modules, says: "modules in a stack, as far as storeys allow", scope: bay, draw: range, unit: modules, whole: true, least: 3, most: 8, kind: picked, by: "tower study, 2026-11-19, picked from the brief"}
- {element: stack-neck, says: "the foot of a module as a share of its top, which flares out above it", scope: bay, draw: range, unit: share, least: 0.62, most: 0.78, kind: picked, by: "tower study, 2026-11-19, by eye"}
- {element: nest, says: "whether a shaft carries a slim core on above its body, which is wrapped round the core's foot", scope: bay, draw: share, unit: chance, share: 0.35, kind: picked, by: "tower study, 2026-11-19, picked"}
- {element: nest-core-share, says: "the core's plan as a share of the plan of the body's top", scope: bay, draw: range, unit: share, least: 0.4, most: 0.6, kind: picked, by: "tower study, 2026-11-19, by eye"}
- {element: nest-extra-storeys, says: "storeys the core stands over the body", scope: bay, draw: range, unit: storeys, whole: true, least: 10, most: 40, kind: picked, by: "tower study, 2026-11-19, picked"}
- {element: fit-gap, says: "the gap between shafts of a tower that has to fit a room", scope: row, draw: range, unit: m, least: 10, most: 10, kind: picked, by: "tower study, 2026-11-19, by eye"}
