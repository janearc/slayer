# skins, 2026-11-19. A skin is what a tower's faces are made of: the
# curtain is the plain dress above; the others replace its mullions,
# spandrels and panes. The cyber layer and the planting go over any skin.
# Colours are shares of light; gloss scales reflection, one is mirror.
- {element: skin-change, says: "whether a tower wears a skin other than the plain curtain", scope: row, draw: share, unit: chance, share: 0.8, kind: picked, by: "skin study, 2026-11-19, picked"}
- element: skin
  says: the skins a tower may wear, other than the plain curtain
  scope: row
  draw: options
  unit: weight
  options:
  - {name: mirror, weight: 3}
  - {name: granite, weight: 3}
  - {name: concrete, weight: 2}
  - {name: gothic, weight: 1}
  - {name: cantilever, weight: 1}
  - {name: vaporwave, weight: 0.5}
  - {name: stainless, weight: 1}
  kind: picked
  by: "skin study, 2026-11-19, picked"
- {element: cyber, says: "whether a tower wears the cyberpunk layer over its skin", scope: row, draw: share, unit: chance, share: 0.12, kind: picked, by: "skin study, 2026-11-19, picked"}
- {element: planted, says: "whether a tower is planted, with terraces and balconies holding trees", scope: row, draw: share, unit: chance, share: 0.08, kind: picked, by: "skin study, 2026-11-19, picked"}
