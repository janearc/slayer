# The American Midwest, 2026-11-19. A street of two-storey houses in vinyl
# siding, one colour for the whole district, each with its gable to the
# street and a garage beside it, standing apart or as duplexes of two
# houses sharing a wall. No number is measured; each says whether it was
# picked as a figure or set by eye.
culture: midwest
says: a suburban street of sided houses, each with a garage, one colour to a district
elements:
- element: bays
  says: houses on one side of a street; a duplex is two of them
  scope: row
  draw: range
  unit: bays
  whole: true
  least: 6
  most: 6
  kind: picked
  by: "terraces study, 2026-11-19, picked"
- element: bay-width
  says: width of every house of a row, without its garage
  scope: row
  draw: range
  unit: m
  least: 7
  most: 8.5
  kind: picked
  by: "terraces study, 2026-11-19, by eye"
- element: bay-depth
  says: depth of every house of a row, front to back
  scope: row
  draw: range
  unit: m
  least: 9
  most: 11
  kind: picked
  by: "terraces study, 2026-11-19, by eye"
