# The urban village, 2026-11-20: walk-ups of six to ten storeys, each on
# its own small plot, faced in small tiles, an alley apart, with a lane
# every few plots. Nothing here is measured, and nothing was looked up.
# A number marked recalled is the study's memory of such places, to be
# checked against a source before it is cited; one marked picked was
# chosen, by eye or to make the parts fit. Lengths are metres; colours
# are shares of light. Scopes: a row is one house, a bay one wall of it.
culture: village
says: the walk-ups of an urban village, packed on a parcel with alleys between and lanes every few plots
elements:
