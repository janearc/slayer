# The elements every culture starts from, 2026-11-19: sizes of the small
# parts that no culture differs on, and the defaults for an element a
# culture says nothing of, such as a tower that is not there. A culture's
# own file says an element again to change it. Nothing here is measured.
# Each element says its distribution (draw), the scope it is drawn at,
# and a unit that holds for every number it has. A range whose two ends
# are the same is a fixed size. Lengths are metres; colours are shares of
# light, each channel from zero to one; a gloss is how much of a mirror a
# surface is.
culture: common
says: the elements no culture differs on
elements:
- element: rows-per-district
  says: how many seeds make one district, so the rows whose seeds agree but for the last digits draw the same district
  scope: district
  draw: range
  unit: seeds
  least: 256
  most: 256
  kind: picked
  by: "terraces study, 2026-11-19, picked"
