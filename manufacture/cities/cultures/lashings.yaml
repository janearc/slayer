- {element: lantern-drop, says: "how far under the cable a lantern's cord lets it hang, to its top", scope: district, draw: range, unit: m, least: 0.3, most: 0.3, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: cord-radius, says: "half the side of the cord a lantern or a sign hangs by", scope: district, draw: range, unit: m, least: 0.01, most: 0.01, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: spacing-least, says: "the nearest lanterns hang along a cable, at density one", scope: district, draw: range, unit: m, least: 0.9, most: 0.9, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: spacing-most, says: "the farthest apart lanterns hang along a cable, at density nought", scope: district, draw: range, unit: m, least: 2.4, most: 2.4, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: lantern-glow, says: "how brightly a lantern glows, a scale on its colour", scope: district, draw: range, unit: scale, least: 0.5, most: 0.5, kind: picked, by: "lashings study, 2026-11-19, by eye, from the first draw, which washed the colours to white at 2.4"}
- {element: lamp-every, says: "every how many lanterns of a cable is also a light, for the tracer lights by lamps and not by what glows", scope: district, draw: range, unit: lanterns, whole: true, least: 6, most: 6, kind: picked, by: "lashings study, 2026-11-19, picked, so that a thousand lanterns are not a thousand lamps"}
