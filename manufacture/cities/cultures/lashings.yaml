- {element: lantern-luminance, says: "luminance at a metre of a lantern lamp's light, in the kit's relative light", scope: district, draw: range, unit: luminance, least: 6, most: 6, kind: picked, by: "lashings study, 2026-11-19, by eye, from the first draw, whose walls took almost none of it at 1.5"}
