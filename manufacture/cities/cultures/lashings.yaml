# Lashings, 2026-11-19. Cables strung across a street between two walls
# that face each other, holding the buildings of the street together, and
# hung with lanterns, signs, bundles of utility cable and tarpaulins. The
# more there is, the harder it is to see down the street. Also here: the
# plain street of plain blocks the lashings are drawn on when a set asks
# for the kind lashed-street and brings no buildings of its own. Nothing is
# measured; each number says it was picked, and by what. Lengths are
# metres, colours are shares of light.
culture: lashings
says: cables across a street, hung with lanterns and signs, over a group of buildings
elements:
# the plain street
- {element: default-street-width, says: "the width of the street when a set does not say", scope: district, draw: range, unit: m, least: 12, most: 12, kind: picked, by: "lashings study, 2026-11-19, from the brief"}
- {element: default-street-length, says: "the length of the street when a set does not say", scope: district, draw: range, unit: m, least: 96, most: 96, kind: picked, by: "lashings study, 2026-11-19, by eye, eight blocks"}
- {element: default-density, says: "how thickly the street is hung when a set does not say, from nought to one", scope: district, draw: range, unit: share, least: 0.6, most: 0.6, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: block-storeys, says: "storeys of every block of the plain street", scope: district, draw: range, unit: storeys, whole: true, least: 6, most: 6, kind: picked, by: "lashings study, 2026-11-19, from the brief"}
- {element: block-ground, says: "height of the ground storey, the retail one", scope: district, draw: range, unit: m, least: 4.4, most: 4.4, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: block-storey, says: "height of each storey over the ground one", scope: district, draw: range, unit: m, least: 3.2, most: 3.2, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: block-width, says: "how wide a block is along the street", scope: bay, draw: range, unit: m, least: 10, most: 16, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: block-depth, says: "how deep a block is, back from the street", scope: district, draw: range, unit: m, least: 14, most: 14, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: window-width, says: "width of a window pane", scope: district, draw: range, unit: m, least: 1.3, most: 1.3, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: window-height, says: "height of a window pane", scope: district, draw: range, unit: m, least: 1.6, most: 1.6, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: window-pitch, says: "how far one window stands from the next along a block", scope: district, draw: range, unit: m, least: 3, most: 3, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: window-sill, says: "how high a pane's foot is over its storey's floor", scope: district, draw: range, unit: m, least: 0.8, most: 0.8, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: window-proud, says: "how far a pane stands out of the wall", scope: district, draw: range, unit: m, least: 0.05, most: 0.05, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: lit-share, says: "share of windows with a light on at night", scope: opening, draw: share, unit: chance, share: 0.45, kind: picked, by: "lashings study, 2026-11-19, by eye, a street at night"}
- element: block-wall
  says: the colour of a plain block's wall
  scope: bay
  draw: options
  unit: share of light
  options:
  - {name: grey, weight: 3, colour: [0.1, 0.1, 0.11], gloss: 0.15}
  - {name: warm grey, weight: 2, colour: [0.14, 0.12, 0.11], gloss: 0.15}
  - {name: slate, weight: 2, colour: [0.07, 0.08, 0.1], gloss: 0.2}
  kind: picked
  by: "lashings study, 2026-11-19, by eye"
# which walls face
- {element: span-least, says: "the nearest two walls may be and still be a street cables cross", scope: district, draw: range, unit: m, least: 5, most: 5, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: span-most, says: "the farthest two walls may be and still be strung across", scope: district, draw: range, unit: m, least: 40, most: 40, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: run-least, says: "the least stretch two walls must face each other along the street to be strung", scope: district, draw: range, unit: m, least: 3, most: 3, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: edge-margin, says: "how far a cable keeps from the end of the stretch two walls face", scope: district, draw: range, unit: m, least: 0.6, most: 0.6, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: clear-floor, says: "the lowest a cable hangs, which clears the retail level and a lorry", scope: district, draw: range, unit: m, least: 4.6, most: 4.6, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: top-margin, says: "how far under the lower roof an anchor stands", scope: district, draw: range, unit: m, least: 1.5, most: 1.5, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: hang-least, says: "the least height between the lowest cable and the highest for a street to be strung", scope: district, draw: range, unit: m, least: 3, most: 3, kind: picked, by: "lashings study, 2026-11-19, by eye"}
# how many cables
- {element: cable-rate-least, says: "cables in a metre of street at density nought", scope: district, draw: range, unit: per m, least: 0, most: 0, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: cable-rate-most, says: "cables in a metre of street at density one, so many that it is hard to see down the street", scope: district, draw: range, unit: per m, least: 0.7, most: 0.7, kind: picked, by: "lashings study, 2026-11-19, by eye, from the brief"}
- {element: density-power, says: "the power density is raised to before it sets the rate, so that a low density is a few wires", scope: district, draw: range, unit: power, least: 1.6, most: 1.6, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: cable-round, says: "the draw that rounds the number of cables in a stretch up or down", scope: row, draw: range, unit: share, least: 0, most: 1, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: cable-jitter, says: "how far along its slot a cable stands, as a share of the slot", scope: bay, draw: range, unit: share, least: 0.1, most: 0.9, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: height-draw, says: "the draw for how high a cable's anchors stand, before it is bent to favour the upper storeys", scope: bay, draw: range, unit: share, least: 0, most: 1, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: height-bias, says: "the power that favours the upper storeys: above one, there are more cables high up than at the retail level", scope: district, draw: range, unit: power, least: 1.8, most: 1.8, kind: picked, by: "lashings study, 2026-11-19, from the brief"}
- {element: end-offset, says: "how much higher one anchor of a cable stands than the other", scope: bay, draw: range, unit: m, least: -1.4, most: 1.4, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: sag-share, says: "how far a cable hangs at its middle, as a share of its span", scope: bay, draw: range, unit: share, least: 0.03, most: 0.07, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: cable-radius, says: "half the side of a cable's square section", scope: district, draw: range, unit: m, least: 0.03, most: 0.03, kind: picked, by: "lashings study, 2026-11-19, by eye, a steel lashing cable thick enough to show"}
- {element: cable-links, says: "straight links a cable is drawn in", scope: district, draw: range, unit: links, whole: true, least: 14, most: 14, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: plate-width, says: "width of the plate a cable is anchored to", scope: district, draw: range, unit: m, least: 0.4, most: 0.4, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: plate-height, says: "height of the anchor plate", scope: district, draw: range, unit: m, least: 0.3, most: 0.3, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- {element: plate-thick, says: "thickness of the anchor plate", scope: district, draw: range, unit: m, least: 0.08, most: 0.08, kind: picked, by: "lashings study, 2026-11-19, by eye"}
- element: steel-colour
  says: the colour of cables and anchor plates
  scope: district
  draw: options
  unit: share of light
  options:
  - {name: steel, weight: 1, colour: [0.04, 0.04, 0.045], gloss: 0.5}
  kind: picked
  by: "lashings study, 2026-11-19, by eye"
# what is hung on a cable
- {element: dress-share-least, says: "share of cables that carry something at density nought", scope: district, draw: range, unit: share, least: 0.15, most: 0.15, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: dress-share-most, says: "share of cables that carry something at density one", scope: district, draw: range, unit: share, least: 1, most: 1, kind: picked, by: "lashings study, 2026-11-19, picked"}
- {element: dress-draw, says: "the draw for whether a cable carries something", scope: bay, draw: range, unit: share, least: 0, most: 1, kind: picked, by: "lashings study, 2026-11-19, picked"}
- element: dress
  says: what a cable that carries something carries, by weight
  scope: bay
  draw: options
  unit: share
  options:
  - {name: lanterns, weight: 7}
  - {name: banner, weight: 3}
  - {name: bundle, weight: 2}
  - {name: tarpaulin, weight: 1}
  kind: picked
  by: "lashings study, 2026-11-19, by eye, from the brief: dozens of rows of lanterns, signs across the middle"
# lanterns
- {element: lantern-radius, says: "the radius of the smallest lantern", scope: district, draw: range, unit: m, least: 0.25, most: 0.25, kind: picked, by: "lashings study, 2026-11-19, by eye, a paper lantern half a metre across"}
