# Groningen, the Reitdiephaven, 2026-11-19. A row of narrow houses along
# a quay: two or three storeys of timber lap, each bay its own saturated
# colour, a gable to the water on each bay, one terracotta roof colour
# for the whole row, white frames, and a tall square tower at one end. No
# number is measured; each says whether it was picked as a figure or set
# by eye against the photographs a person remembers.
culture: groningen
says: a row of gabled bays on a harbour, each its own colour, with a tower at one end
elements:
- element: bays
  says: bays in the row, the tower's among them
  scope: row
  draw: range
  unit: bays
  whole: true
  least: 12
  most: 12
  kind: picked
  by: "terraces study, 2026-11-19, picked from the brief"
