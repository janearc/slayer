# The pier, 2026-11-19. A deck over water on rows of piles, with a long
# low shed on it, as the piers of a working waterfront are. The deck's top
# stands above the sea by the deck height, and the piles go down below it.
# Nothing is measured; each number says whether it was picked, and by what.
# Lengths are metres, colours are shares of light.
culture: pier
says: a wharf pier, a shed on a deck on piles
elements:
- element: length
  says: how far the pier reaches out from the shore
  scope: district
  draw: range
  unit: m
  least: 120
  most: 260
  kind: picked
  by: "pier study, 2026-11-19, by eye, the piers of a fishing waterfront"
