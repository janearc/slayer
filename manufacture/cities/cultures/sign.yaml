# The signs of a night street, 2026-11-20: what they say, in what colour,
# in what hand, how they are made and how big. A sign hangs as a roof sign,
# big words on a steel frame at a roof's edge; a screen on a wall; a blade,
# letters one under the next on a cabinet that stands out from a wall on a
# bracket; or an awning's valance over a shopfront. Each is made one of a
# few ways: open tube letters bent to the edge of each letter on a backing,
# channel letters lit from their faces, a painted board lit by lamps on
# arms, a lit box with a translucent face, a board with a border of bulbs,
# a screen of lit tiles, a valance painted or lit. The words are of a trade:
# ramen, a dive, a bar, a hotel, a pharmacy, an arcade. Letters are Latin
# capitals, set in go's own fonts, unless a set asks for another script.
# Simplified Chinese, the mainland's, says the elements again under the
# same names ending in -hans: the trades, the words of each, the lines of a
# screen, the fonts, the makes of a roof sign and a blade sign, which leave
# out the open tube, and the sizes that suit square characters. Its fonts
# are named by the key of the source that keeps them on the shelf. Two
# trades, a women's shelter and a dog boutique, are in no script's draw by
# weight: a set that asks for them gets each, once, on every building. A
# sign is a glowing surface and also a
# light, as a lit window is: the tracer lights by lamps, not by glow.
# Lengths are metres unless the unit says a share of an em; colours are
# shares of light, each channel from nought to one; heats are kelvin.
# Nothing here is measured: every number is picked, and says so.
