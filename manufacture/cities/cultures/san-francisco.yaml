# San Francisco, 2026-11-19. Rows of narrow lots on a street, each rebuilt
# when its house was: the Victorian and Edwardian row houses that stood
# first, the stucco houses with garages under of the 1920s and 1930s, the
# plain stucco boxes of mid-century, and modern infill in concrete, metal
# and glass. Every bay draws its era first, from shares that are drawn for
# a district, so one district leans one way and a neighbour another; the
# era's own elements, named for the element and the era, then replace the
# culture's. The base elements are the Victorian ones. No number is
# measured; each says that it was picked, by eye against the streets.
culture: san-francisco
says: "lots of every era side by side on a street: Victorian, stucco, mid-century and modern"
