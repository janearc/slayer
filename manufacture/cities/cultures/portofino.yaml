# Portofino, 2026-11-19. A quay of tall narrow houses in rendered
# plaster, each bay its own saturated colour with no two neighbours
# alike, green shutters beside the windows, roofs flat or low hips that
# hardly show from below, and a roofline that steps because every bay
# has its own number of storeys. No number is measured; each says
# whether it was picked as a figure or set by eye.
culture: portofino
says: a quay of tall painted houses, stepped in height, with shutters
elements:
- element: bays
  says: bays in the row
  scope: row
  draw: range
  unit: bays
  whole: true
  least: 14
  most: 14
  kind: picked
  by: "terraces study, 2026-11-19, picked from the brief"
- element: bay-width
  says: width of every bay of a row
  scope: row
  draw: range
  unit: m
  least: 5.4
  most: 5.8
  kind: picked
  by: "terraces study, 2026-11-19, by eye"
- element: bay-depth
  says: depth of every bay of a row, front to back
  scope: row
  draw: range
  unit: m
  least: 10
  most: 12
  kind: picked
  by: "terraces study, 2026-11-19, by eye"
- element: storeys
