# The creatures a gargoyle may be carved as, 2026-11-19. A gargoyle takes
# only the shape of a creature the manufactory already has, and carves it
# in stone on a corbel. Adding a creature is one entry here: its name, the
# study it is taken from, and how it is posed. A cornice cycles through
# these entries in the order written, so a fifth entry gives a cornice of
# five its fifth creature.
#
# Every creature is in its own frame: the animals that swim or walk face
# along x with y up. The turns are in degrees, in this order: roll about
# the creature's own x, pitch about its z, yaw about the vertical, and
# then lean, how far the whole is tipped about the line along the wall,
# positive out of the wall. The block's frame has the wall's face in the
# plane z is nought, the wall on the side of negative z, and the top of
# the corbel's slab at y is nought. Lengths are metres in the creature's
# own frame, and scale is how large the creature is carved against that.
# Nothing here is measured. Every number was picked by eye, against a
# render of the creature on its corbel, and each entry says so.
#
# study     the name of the creature's study in manufacture
# held      the point of the creature, in its own frame, held in place on
#           the block: where it comes out of the wall, or where it grips
# up, out   how far over the slab that point is held, in metres, and how
#           far from the wall's face, as a share of how far the slab
#           stands out
# mouth     the creature's spout, in its own frame: its mouth, or for a
#           squid its funnel
creatures:
- name: allosaurus
  says: a snarling head and neck out of the wall, the lower jaw the spout
  study: allosaurus
  scale: 2.2
