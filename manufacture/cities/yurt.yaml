# The yurt, 2026-11-19. A typical Mongolian ger, drawn as a lattice wall, a
# roof of poles under felt, a crown ring and a door. Every value is picked,
# not measured. Dimensions are metres, except the door's heading, in
# degrees; sides are counts; colours are shares of light, each channel from
# zero to one, and gloss is how much of a mirror a surface is.
