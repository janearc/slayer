# Giant kelp, in metres. A plant stands on its holdfast at y nought, y up,
# and the sea's surface is `depth` above it. Every figure says where it
# came from in its basis, which begins with one of four words:
#   cited:    a published page that was read, named after the colon
#   derived:  worked from other figures here, the working after the colon
#   recalled: from memory, not read
#   picked:   chosen to look right; nothing measured stands behind it
# A range is where a seed picks from, so no two plants are alike.
#
# The form, described: a holdfast on the bottom; many stipes rising
# together toward the surface; along each stipe blades at intervals, each
# long and narrow with a gas bladder at its base, all streaming the way the
# water moves; at the surface the stipes turning to lie along it as a
# canopy. The pages read give the form in words (the first source) and a
# few numbers; none gives a blade, a bladder or a holdfast of the large
# form in metres, nor a spacing of blades, so those are picked and say so.
species: macrocystis-pyrifera
read: "published pages read in the session that wrote this file, and what each gave"
sources:
  wikipedia-macrocystis: "https://en.wikipedia.org/wiki/Macrocystis_pyrifera, read twice: stipes about 1 cm wide to 30 m long, blades 5 cm wide and 35 cm long on the former integrifolia morph, a single pneumatocyst at the base of each blade, blades at irregular intervals along the stipe, as many as 60 stalks on older protected plants that branch three or four times from near the base, up to 50 to 60 m long and so longer than the water is deep because the plant grows diagonally in a current, growth of 60 cm a day, floating canopies in dense beds"
  monterey-giant-kelp: "https://www.montereybayaquarium.org/animals/animals-a-to-z/giant-kelp, read: up to 30 m typically and 53 m at most, held upright by gas-filled bladders at the base of leaflike blades"
  wikipedia-pneumatocyst: "https://en.wikipedia.org/wiki/Pneumatocyst, read: gas-filled floats that raise the blades toward the light; no size given"
figures:
  depth: {least: 12, most: 12, basis: "picked: a plant well short of the 30 m a stipe may reach (wikipedia-macrocystis); one depth so that a set can put the sea's surface where the canopy is"}
  drop: {least: 0, most: 0.8, basis: "picked: how far short of the surface a plant's top falls"}
  stipes: {least: 14, most: 26, basis: "picked: a young plant; wikipedia-macrocystis gives as many as 60 on an older one"}
  stipe-foot-radius: {least: 0.008, most: 0.014, basis: "cited: wikipedia-macrocystis, stipes about 1 cm wide on the smaller form, so a radius about 0.5 cm; the larger form's picked thicker"}
  stipe-tip-radius: {least: 0.003, most: 0.005, basis: "picked: the stipe narrows toward its top"}
  segment: {least: 0.5, most: 0.5, basis: "picked: the length of one straight run of a stipe"}
  fan: {least: 0.4, most: 1.2, basis: "picked: how far a stipe's top stands from its foot's middle with no current; stipes rise together"}
  spread: {least: 0.05, most: 0.15, basis: "picked: how wide round the holdfast's middle the stipes start; they branch from near the base (wikipedia-macrocystis)"}
  node-spacing: {least: 0.15, most: 0.3, basis: "picked: blades come at irregular intervals (wikipedia-macrocystis), no spacing given"}
  blade-length: {least: 0.4, most: 0.9, basis: "cited: wikipedia-macrocystis, blades 35 cm long on the smaller form; the larger form's picked longer"}
  blade-width: {least: 0.06, most: 0.12, basis: "cited: wikipedia-macrocystis, blades 5 cm wide; the upper end picked"}
  blade-thickness: {least: 0.003, most: 0.003, basis: "picked"}
  ruffle-height: {least: 0.005, most: 0.012, basis: "picked: the height of the ruffle at a blade's edge"}
  ruffle-waves: {least: 8, most: 14, basis: "picked: ruffles along a blade's length"}
  blade-lift: {least: 0.9, most: 1.3, basis: "picked: how far a blade stands from its stipe sideways, in radians"}
  blade-curve: {least: 0.15, most: 0.35, basis: "picked: how far a blade's tip bows from its straight line, over its length"}
  float-length: {least: 0.06, most: 0.1, basis: "picked: a gas bladder at the base of each blade (wikipedia-macrocystis), no size given"}
  holdfast-radius: {least: 0.15, most: 0.3, basis: "picked"}
  holdfast-lobes: {least: 5, most: 9, basis: "picked: a tangle of branching extensions (monterey-giant-kelp), no count given"}
  canopy-reach: {least: 2, most: 5, basis: "picked: how far a stipe runs along the surface; floating canopies (wikipedia-macrocystis), no size given"}
  variants: {least: 6, most: 6, basis: "picked: blade shapes made once and shared by every blade of the kind"}
  spacing: {least: 3, most: 5, basis: "picked: how far apart plants of a forest stand"}
  plants: {least: 144, most: 144, basis: "picked: plants in a forest"}
looks:
  stipe: {colour: [0.1, 0.07, 0.025], basis: "picked: the colour a brown alga reflects"}
  blade: {colour: [0.085, 0.07, 0.02], basis: "picked: an olive brown, the colour a brown alga reflects"}
  float: {colour: [0.16, 0.13, 0.04], basis: "picked: paler than a blade"}
physics:
  gravity: {value: 9.81, unit: "m/s2", basis: "picked: the usual figure for the sea's surface"}
  lean-reference: {value: 0.25, unit: "m/s", basis: "picked: the current at which a plant leans halfway to its greatest lean"}
  lean-share: {value: 0.5, unit: "share of a stipe's length", basis: "picked: the farthest a top can lean; the plant grows diagonally in a current (wikipedia-macrocystis)"}
  # the swell is linear deep-water waves: a wavelength of g T squared over
  # two pi and an orbit that dies as exp(-k z). recalled: not read in the
  # session that wrote this file.
  follow: {value: 0.6, unit: "share", basis: "picked: how much of the water's orbit a plant takes up"}
  tip-width: {value: 0.2, unit: "share", basis: "picked: a blade's width at its ends, over its widest"}
  blade-stream: {value: 1.6, unit: "share of a blade's axis", basis: "picked: how much a blade streams downstream, toward plus x, in the greatest current; less in less"}
  blade-buoy: {value: 0.6, unit: "share of a blade's axis", basis: "picked: how much the bladder at its base lifts a blade (wikipedia-pneumatocyst)"}
  float-aspect: {value: 1.8, unit: "length over radius", basis: "picked"}
  holdfast-cone: {value: 0.18, unit: "m", basis: "picked: the radius at the foot of a holdfast finger one metre long"}
# Named water motions a set may ask for by kind name. The swell is a
# height from trough to crest, its period, and the current at the plant.
conditions:
  slack: {current: 0, swell-height: 0, swell-period: 10, basis: "picked: still water"}
  moderate: {current: 0.15, swell-height: 0.6, swell-period: 10, basis: "picked"}
  surge: {current: 0.4, swell-height: 1.6, swell-period: 12, basis: "picked"}
