# Independent public geometry probes, 2026-11-07.
# Apertures follow the cited reference rows; probe locations are authored.
seed: 5
tolerance: 1.0e-9
maximum-faces: 12000
profiles:
  - design: spitzer
    aperture: 0.85
    primary-axis: x
    probes:
      - material: primary mirror
        ray: {at: {x: 0, y: 6, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: true
      - material: solar array
        # The active cells end at 3.3 m; the upper extension is a shield.
        ray: {at: {x: 0.05, y: 0.03, z: -3}, dir: {x: 0, y: 0, z: 1}}
        hit: true
      - material: solar array
        ray: {at: {x: 0.05, y: 4, z: -3}, dir: {x: 0, y: 0, z: 1}}
        hit: false
  - design: hubble
    aperture: 2.4
    primary-axis: x
    probes:
      - material: primary mirror
        ray: {at: {x: 0, y: 15, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: true
      - material: solar array
        ray: {at: {x: 4, y: 5, z: -3}, dir: {x: 0, y: 0, z: 1}}
        hit: true
  - design: webb
    aperture: 6.6
    primary-axis: y
    probes:
      - material: primary mirror
        ray: {at: {x: 0, y: 6.43, z: -12}, dir: {x: 0, y: 0, z: 1}}
        hit: false
      - material: primary mirror
        ray: {at: {x: 1.15, y: 7.1, z: -12}, dir: {x: 0, y: 0, z: 1}}
        hit: true
      - material: thermal shield
        ray: {at: {x: 5, y: 3, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: true
      # the bus hangs under the shield, on the sun's side: looking up from
      # below the middle, the first thing met is structure
      - material: spacecraft structure
        ray: {at: {x: 1.2, y: -5, z: -1.2}, dir: {x: 0, y: 1, z: 0}}
        hit: true
      # and it is not on the cold side: a look across, between the shield
      # and the telescope and clear of the tower, meets no structure.
      # Before 2026-11-12 the bus sat here.
      - material: spacecraft structure
        ray: {at: {x: 5, y: 2.6, z: 0.8}, dir: {x: -1, y: 0, z: 0}}
        hit: false
      # the solar panels run aft from the bus in a row, off to one side of
      # the aft pallet; and none is on the pallet's other side
      - material: solar array
        ray: {at: {x: 1.5, y: -5, z: 5}, dir: {x: 0, y: 1, z: 0}}
        hit: true
      - material: solar array
        ray: {at: {x: -1.5, y: -5, z: 5}, dir: {x: 0, y: 1, z: 0}}
        hit: false
      # the instrument module is on the primary's back
      - material: spacecraft structure
        ray: {at: {x: 0.8, y: 5, z: 12}, dir: {x: 0, y: 0, z: -1}}
        hit: true
      # the secondary stands 7.169 m in front of the primary's vertex, at
      # z = -8.82 for this aperture: a look across the axis there meets
      # it, and one across the axis where it used to stand, 5.94 m out,
      # at z = -7.59, does not
      - material: secondary mirror
        ray: {at: {x: -3, y: 6.5, z: -8.85}, dir: {x: 1, y: 0, z: 0}}
        hit: true
      - material: secondary mirror
        ray: {at: {x: -3, y: 6.5, z: -7.59}, dir: {x: 1, y: 0, z: 0}}
        hit: false
  - design: prima
    aperture: 1.8
    primary-axis: x
    probes:
      - material: primary mirror
        ray: {at: {x: 0, y: 0, z: 5}, dir: {x: 0, y: 0, z: -1}}
        hit: true
      - material: thermal shield
        ray: {at: {x: 1.5, y: 2.14, z: 5}, dir: {x: 0, y: 0, z: -1}}
        hit: true
  - design: roman
    aperture: 2.4
    primary-axis: x
    probes:
      - material: black aperture shade fabric
        ray: {at: {x: 0.2, y: 5, z: -5.5}, dir: {x: 0, y: -1, z: 0}}
        hit: true
      - material: black aperture shade fabric
        ray: {at: {x: 0, y: 0, z: -7}, dir: {x: 0, y: 0, z: 1}}
        hit: false
      - material: gold thermal blanket
        ray: {at: {x: 2.5, y: 0, z: 5.5}, dir: {x: -1, y: 0, z: 0}}
        hit: true
      - material: primary mirror
        ray: {at: {x: 0, y: 0, z: -2}, dir: {x: 0, y: 0, z: 1}}
        hit: true
      - material: secondary mirror
        ray: {at: {x: 0, y: 0, z: -5}, dir: {x: 0, y: 0, z: 1}}
        hit: true
      # Two panels lie across the craft, each 1.728 m wide with 0.084 m
      # between them, so the +x panel is from 0.042 to 1.770 m. Its sixteen
      # rows of cells, 0.108 m apart, run from the outer edge in: the first
      # eight, 0.910 to 1.766 m, are the first string, and the last eight,
      # 0.046 to 0.902 m, the second.
      - material: solar array
        ray: {at: {x: 1.3, y: 5, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: true
      - material: second solar cell string
        ray: {at: {x: 0.4, y: 5, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: true
      - material: solar array
        ray: {at: {x: 0.4, y: 5, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: false
      - material: solar array
        ray: {at: {x: 0, y: 5, z: 0}, dir: {x: 0, y: -1, z: 0}}
        hit: false
      - material: thermal shield
        ray: {at: {x: 2.4, y: 0, z: 0}, dir: {x: -1, y: 0, z: 0}}
        hit: true
invalid-apertures:
  - {value: 0, message: "invalid spacecraft"}
  - {value: -1, message: "invalid spacecraft"}
  - {value: 1.0e160, message: "non-finite spacecraft envelope"}
