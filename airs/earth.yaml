# A clear day's haze: an exponential layer from the ground, its depth at
# the reference wavelength, the way it changes with colour by Angstrom's
# law, and its albedo and asymmetry by wavelength.
aerosol:
  depth:
    value: 0.1
    unit: ""
    picked: >-
      a clear day. Shettle and Fenn 1979 was not reached. Kaufman and
      others (NTRS 20060013189) Table 1 has the average depth at ten
      AERONET sites, 2001 to 2005, at 0.14 (Rome) to 0.49 (Beijing),
      every one of them a mean over hazy days as well as clear; a
      typical figure, to be pinned.
  reference:
    value: 550
    unit: nm
    picked: >-
      the middle of the visible, where aerosol depths are quoted.
  angstrom:
    value: 1.4
    unit: ""
    low: 1.02
    high: 1.71
    picked: >-
      the Angstrom exponent, 440 to 870 nm, of Rome, 2001 to 2005,
      1.40, Kaufman and others Table 1 (1), "mostly local pollution".
      The ten sites there run from 1.02 (Kashidoo) to 1.71 (Mongu).
      The brief's 1.3 is inside it. To be pinned.
  scale-height:
    value: 1200
    unit: m
    picked: >-
      the height over which a clear day's aerosol falls by e, as
      commonly given, 1 to 2 km; no source for it was reached. To be
      pinned.
  albedo:
    read: >-
      Levy, Remer, Mattoo, Vermote and Kaufman 2007 (NTRS 20070016619),
      p 26, Table 1, the Continental model, "SSA/g (0.47/0.55/0.66/2.1
      um) for tau 0.55 = 0.5": 0.90, 0.89, 0.88, and 0.67 at 2.1 um,
      which is past the range here. Read from the page's image, not
      only its text. Held at the ends. The model is for a depth of 0.5;
      it is held at 0.1.
    points:
      - [470, 0.90]
      - [550, 0.89]
      - [660, 0.88]
  asymmetry:
    read: >-
      The same table and model, second row: 0.64, 0.63, 0.63, and 0.79
      at 2.1 um. Held at the ends.
    points:
      - [470, 0.64]
      - [550, 0.63]
      - [660, 0.63]

ground:
  picked: >-
    a single albedo of 0.15, at every wavelength: the set's to say
    later, as the ground's colour is. A grass and soil mean is about
    that; no source was read. The two points are the ends of the
    ozone's cross sections, 300 and 1000 nm.
  points:
    - [300, 0.15]
    - [1000, 0.15]
