# sources.yaml: the published work slayer cites, as a claim.
#
# each source says what it is, where it is published, what it may be
# used under, and the sha256 of its bytes. cmd/sources fetches them onto
# a shelf in your own scratch, outside any repository, and holds them to
# that hash:
#
#     SLAYER_SHELF=$HOME/slayer/sources go run ./cmd/sources fetch
#
# a source with no sha256 yet is fetched and its hash said; pin it here
# by hand. a source that must never be fetched again keeps its key and
# says why, in never. used, never released: the bytes are not shipped.

