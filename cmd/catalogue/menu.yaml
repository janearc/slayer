    details: [hull, quick, demo]
    view-yaw-deg: 35
    view-elevation-deg: 35
  - kind: city-clustered-10000
    group: City buildings
    about: Ten thousand cluster-weighted lots, continuous parks and an elevated freeway.
    notes: >-
      Finite Poisson district centres drive a Gaussian intensity field. Fixed
      building count, road lots, two large parks, separated carriageways and
      four ground ramps constrain the realization; this is not raw Thomas
      offspring. Authored metre dimensions and native material batches.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 55
  - kind: city-grid-10000
    group: City buildings
    about: Ten thousand individually seeded buildings on a connected street grid.
    notes: >-
      Twenty-five by twenty-five blocks, sixteen lots per block, cross alleys
      and sixteen traffic circles. Metre-scale authored scenery with conservative
      setbacks, a finite shared material palette and bounded baked mesh chunks.
      No traffic simulation, interiors or attached lamps.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 55
  - kind: city-rowhouse
    group: City buildings
    about: A seeded two or three storey house with a gabled roof.
    notes: Authored dimensions and materials; quick adds broad glazing bands.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 25
  - kind: city-apartment
    group: City buildings
    about: A seeded four to eight storey apartment building with a flat roof.
    notes: Authored dimensions and materials; quick adds broad glazing bands.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 25
  - kind: city-tower
    group: City buildings
    about: A seeded twelve to twenty-three storey tower with podium and crown.
    notes: Authored dimensions and materials; quick adds broad glazing bands.
    details: [hull, quick]
    view-yaw-deg: 35
    view-elevation-deg: 25
  - kind: human-scale-2m
    group: Scale references
    about: A standing two-meter human scale mannequin made mathematically.
    notes: >-
      Exactly two metres from the soles to the crown. Authored body proportions
      and neutral stance, with aluminium optics; no measured anatomy or skin.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 0
    view-elevation-deg: 12
  - kind: adult-human-neutral
    group: Human studies
    about: A neutral standing adult human with a short scalp groom.
    notes: >-
      A procedural 1.70 m adult reference with posed eye globes and an authored
      skin diffusion profile.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/adult-human-neutral.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-reaching
    group: Human studies
    about: The standing reference reaching with its left arm.
    notes: >-
      Authored thorax, head, shoulder and arm turns change the upper body while
      the legs retain their neutral pose.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/adult-human-reaching.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-reach-clip
    group: Human studies
    about: The opening pose of a timed left-arm reach.
    notes: >-
      The catalogue samples the neutral start. In a set, the authored clip
      reaches, holds and returns over 3.2 seconds.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/adult-human-reach-clip.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-male-study
    group: Human studies
    about: A standing adult reference with male external forms and cropped scalp fibres.
    notes: >-
      Uses the same 1.70 m stature, with authored pectoral and pelvic forms and a
      separate skin tone.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/adult-human-male.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-details
    group: Human studies
    about: The neutral adult with an ungroomed scalp and procedural skin marks.
    notes: >-
      Rest-space skin marks and authored surface relief are intended for the close
      views in the detail set. Use --renderer cpu.
    details: [quick]
  - kind: adult-human-cheek-scar
    group: Human studies
    about: The bare-scalp adult with healed scratches on the left cheek.
    notes: >-
      A rest-space mark adds local pigment and relief. Compare the matched views
      in sets/bioforms/adult-human-cheek-scar.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-thin-skin
    group: Human studies
    about: The ungroomed adult with a layered thin-tissue material.
    notes: >-
      Illustrative transmission varies with mesh thickness. The hand backlight set
      isolates the effect at the digits. Use --renderer cpu.
    details: [quick]
  - kind: adult-human-auricle
    group: Human studies
    about: The bare-scalp adult with folded outer ears.
    notes: >-
      The head mesh includes the pinna folds and slight authored asymmetry.
      Use --renderer cpu.
    details: [quick]
  - kind: adult-human-auricle-thin-skin
    group: Human studies
    about: The folded-ear study with layered thin-tissue transmission.
    notes: >-
      The illustrative tissue profile uses a shorter cutoff for the pinna.
      Draw sets/bioforms/adult-human-ear-backlight.yaml with the CPU renderer
      to inspect the effect under a local backlight.
    details: [quick]
  - kind: adult-human-wider-stance
    group: Human studies
    about: The ungroomed adult with both thighs turned outward.
    notes: >-
      Each thigh turns five degrees about its hip. The authored pose carries the
      lower legs along with the turn. Use --renderer cpu.
    details: [quick]
  - kind: adult-human-groom-fibre
    group: Human studies
    about: The adult reference with short individual scalp fibres.
    notes: >-
      Authored coverage, a swept part and a rear whorl guide static strands with
      single-fibre scattering.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/groom-study/scalp-fibre.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-groom-medium
    group: Human studies
    about: The adult reference with a medium-length parted fibre groom.
    notes: >-
      Authored roots and shaft guides shape the part and hanging locks. Fibres are
      static.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/groom-study/medium-fibre.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-groom-medium-layered
    group: Human studies
    about: The medium fibre groom with extra lift at the crown.
    notes: >-
      The authored crown lift changes the shaft guidance while the same adult body
      and skin are retained.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/groom-study/medium-layered-fibre.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-groom-medium-field
    group: Human studies
    about: The medium fibre groom guided by the scalp-surface direction field.
    notes: >-
      The authored field guides the static shafts along the scalp before they
      hang.
      The full scalp groom can exceed the catalogue face limit. Draw
      sets/bioforms/groom-study/medium-field-fibre.yaml with the CPU renderer.
    details: [quick]
  - kind: adult-human-groom-medium-field-wisps
    group: Human studies
    about: The medium scalp-field groom with shared wisp shapes.
    notes: >-
      Nearby, similarly directed guides share bend and tip offsets while shafts
      retain individual roots and paths. The full scalp groom can exceed the
      catalogue face limit. Draw sets/bioforms/groom-study/medium-field-wisps.yaml
      with the CPU renderer.
    details: [quick]
  - kind: adult-human-body-hair
    group: Human studies
    about: The bare-scalp adult with added arm and leg fibres.
    notes: >-
      Procedural coverage and authored regional masks place static limb fibres
