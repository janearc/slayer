  - kind: webb
    group: Observatories
    about: A gold segmented primary on a tower above five aluminium sunshield layers, its bus and solar panels on the sun's side.
    notes: Referenced aperture, counts, shield lengths and secondary; gold and aluminium by their optical constants; authored figure, gaps and sizes of the bus, tower and instrument module.
    details: [hull, clumps, quick, demo]
    # Seen from the sun's side, below the shield: the mirror's side is the
    # side Webb keeps in shadow, and from there, with nothing else in space
    # to light it, it drew black (catalogue of 2026-11-15). Authored view.
    view-yaw-deg: 180
    view-elevation-deg: -30
    # In space: nothing behind it, and one sun. Webb may point only 85 to
    # 135 degrees from the sun (STScI, JWST user documentation, "JWST
    # Field of Regard"), and its sky is darkest at 135, so the sun lies
    # 135 degrees from the mirror's line of sight (-z here) on the
    # shield's side (-y): toward (0, -sin 135, -cos 135). The direction
    # is measured; the strength is the studio's key light, authored.
    staging:
      sky:
        horizon: {r: 0, g: 0, b: 0}
        zenith: {r: 0, g: 0, b: 0}
        ground: {r: 0, g: 0, b: 0}
      sources:
        - toward: {x: 0, y: -0.7071067811865476, z: 0.7071067811865476}
          strength: {r: 2.4, g: 2.3, b: 2.1}
    references:
      - title: NASA, Webb telescope overview
        url: https://science.nasa.gov/mission/webb/science-overview/science-explainers/telescope-overview/
      - title: NASA, Webb sunshield
        url: https://science.nasa.gov/mission/webb/webbs-sunshield/
