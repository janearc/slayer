      216 flat secondary panels. Tapered modular space frame, deep mirror
      cell, azimuth rail, altitude cradle and four corrector roles are
      authored scenery. Panel positions are not an ESO segment survey.
      The roll-away shelter is independently placeable as owl-shelter.
