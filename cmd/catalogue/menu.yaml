      - title: Rubin Observatory, summit facility and service building
        url: https://rubinobservatory.org/explore/how-rubin-works/technology/summit-facility
  - kind: palomar
    group: Ground observatories
    about: A long optical tube carried by a tilted horseshoe mount.
    notes: >-
      Nominal 200-inch primary; Caltech's rounded 42 m dome diameter and
      41 m height. The support proportions, slit and pointing are authored.
      This suggests the Hale telescope without an engineering replica.
