# Authored descriptions of the current factory, 2026-11-07.
# Listed detail support is held to actual construction by command tests.
entries:
  - kind: dobsonian-36
    group: Personal telescopes
    about: A 36-inch Newtonian on a timber rocker and large altitude bearings.
    notes: >-
      Requested 36-inch aperture. Mirror box, paired V trusses, upper cage,
      side focuser and a flat folding secondary. All proportions and materials
      are authored scenery; this is not a working optical prescription.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 35
    view-elevation-deg: 25
    references:
      - title: Obsession, mirror box, rocker and bearings
        url: https://www.obsessiontelescopes.com/why_buy/
  - kind: apo-refractor-5
    group: Personal telescopes
    about: A 5-inch apochromatic-refractor scenery on a counterweighted tripod.
    notes: >-
      Requested 5-inch aperture. Long tube, dew shield, rings, focuser,
      diagonal and finder. The objective is an opaque polished proxy;
      no glass prescription or colour-correction calculation is implemented.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 35
    view-elevation-deg: 25
    references:
      - title: Explore Scientific, 127 mm triplet construction reference
        url: https://explorescientific.com/products/127mm-fcd100-apochromatic-refractor
  - kind: sct-24
    group: Personal telescopes
    about: A 24-inch Schmidt-Cassegrain scenery on a fork and pier.
    notes: >-
      Requested 24-inch aperture. Short tube, primary, secondary, corrector
      proxy, finder and rear focuser. Tube and mount proportions are authored;
      the corrector is opaque scenery and does not refract light.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 35
    view-elevation-deg: 25
    references:
      - title: Celestron, Schmidt-Cassegrain construction and corrector
        url: https://www.celestron.com/blogs/knowledgebase/the-ultimate-guide-to-celestron-optical-tubes
  - kind: griffith
    group: Ground observatories
    about: A public observatory with a domed rotunda and two rooftop instruments.
    notes: >-
      The east refractor has the guide's nominal 12-inch objective. Wings,
      rotunda and rear planetarium follow the visitor map's layout in broad
      strokes. All building sizes, tube length and materials are authored.
      The west solar roof is closed; no working coelostat or lens prescription.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 25
    view-elevation-deg: 25
    references:
      - title: Griffith Observatory, student guide, page 17
        url: https://griffithobservatory.org/wp-content/uploads/2023/02/Module1_Student_Guide.pdf
      - title: Griffith Observatory, visitor map, main level
        url: https://griffithobservatory.org/wp-content/uploads/2021/03/GOMap_03112021.pdf
  - kind: elt
    group: Ground observatories
    about: A dense segmented primary and open truss with five mirror roles.
    notes: >-
      Nominal 39 m primary and 798 installed panels from ESO. The central
      opening, panel positions, secondary and relay dimensions, supports and
      96 m by 90 m enclosure are authored approximations. The mirror figures
      do not implement a calibrated optical prescription.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 35
    view-elevation-deg: 55
    references:
      - title: ESO, ELT facts
        url: https://elt.eso.org/about/facts/
      - title: ESO, ELT primary mirror technical concept
        url: https://elt.eso.org/mirror/M1/
  - kind: rubin
    group: Ground observatories
    about: A survey telescope, faceted enclosure and long tiered service wing.
    notes: >-
      Physical 8.4 m primary blank, 3.4 m secondary and 5 m tertiary surface
      from Rubin's mirror descriptions. The enclosure, supports, figures,
      camera housing, tiered service wing and secondary opening are authored
      scenery choices.
      Effective aperture is a different quantity from the physical blank.
    details: [hull, clumps, quick, demo]
    view-yaw-deg: 0
    view-elevation-deg: 55
    references:
      - title: Rubin Observatory, telescope key numbers
        url: https://rubinobservatory.org/for-scientists/rubin-101/key-numbers
