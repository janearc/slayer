    details: [hull, clumps, quick, demo]
    # In space, by one sun from the studio key light's way.
    staging:
      sky:
        horizon: {r: 0, g: 0, b: 0}
        zenith: {r: 0, g: 0, b: 0}
        ground: {r: 0, g: 0, b: 0}
      sources:
