# A crowded summit quality study; all placements and weather are authored.
# Demo detail retains physical needles; the queued preview decides its cost.
# Fictional instruments and introduced forest on pinned USGS Kilauea ground.
# Buildings, yard positions, light tint, cloud deck and beam appearance are picked.
# Main instrument: ELT family, north55deg, zero placement heading.
# Launch exits follow its picked front-rim pose: seat31.5m, axial42.9m;
# peripheral offsets are outside the39m pupil. This is not an ESO layout.
# ESO GALACSI wide-field example:64arcsec off-axis, not a universal pattern.
# https://cdn3.eso.org/sci/facilities/develop/ao/sys/galacsi.html
# Redwood mist context: https://research.fs.usda.gov/treesearch/69118
# Prescribed mist is not transpiration, condensation or sodium return.
# Sun tint is authored linear RGB, not calibrated atmospheric transfer.
