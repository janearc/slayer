# One hour of authored flight in ten seconds at six frames per second.
# Source-grounded starting site, then a climb to a 300 km viewing height.
# This is a camera choreography study, not a physically integrated orbit.
scene: island-observatory-preview.yaml
frames: 60
fps: 6
scene-duration-seconds: 3600
keyframes:
- at-seconds: 0
  at: {longitude-deg: -155.5021, latitude-deg: 19.80315, height-metres: 3740}
  look-at: {longitude-deg: -155.5, latitude-deg: 19.8, height-metres: 3675}
  wide-deg: 35
  ease: smooth
- at-seconds: 900
  at: {longitude-deg: -155.515, latitude-deg: 19.82, height-metres: 5200}
  look-at: {longitude-deg: -155.5, latitude-deg: 19.8, height-metres: 3636}
  wide-deg: 55
  ease: smooth
- at-seconds: 1800
  at: {longitude-deg: -155.57, latitude-deg: 19.87, height-metres: 15000}
  look-at: {longitude-deg: -155.5, latitude-deg: 19.8, height-metres: 2000}
  wide-deg: 65
  ease: smooth
- at-seconds: 2700
  at: {longitude-deg: -155.75, latitude-deg: 20.1, height-metres: 70000}
  look-at: {longitude-deg: -155.47, latitude-deg: 19.65, height-metres: 0}
  wide-deg: 65
  ease: smooth
- at-seconds: 3600
  at: {longitude-deg: -155.85, latitude-deg: 20.3, height-metres: 300000}
  look-at: {longitude-deg: -155.45, latitude-deg: 19.6, height-metres: 0}
  wide-deg: 55
  ease: smooth
