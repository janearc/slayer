# Self-contained camera demonstration. No survey downloads or GPU needed.
# View, dimensions, speed and timing: 2026-11-07.
$schema: https://github.com/janearc/slayer/schemas/sequence-v1.json
smoke: 1
film: {width: 640, height: 360, rays: 1}
output: ../out/camera-smoke
fps: 24
start: {value: 0, unit: s}
duration: {value: 4, unit: s}
print: {knee: 0.7, top: 8, bloom: 0}
camera:
  unit: m
  look-at: {x: 0, y: 0.8, z: 0}
  moves:
    - from: {x: -3, y: 2.2, z: 6}
      to: {x: 3, y: 2.2, z: 6}
      speed: {value: 2, unit: m/s}
    - from: {x: 3, y: 2.2, z: 6}
      to: {x: 3, y: 2.2, z: 6}
      duration: {value: 1, unit: s}
