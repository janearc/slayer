# a fictional grove on the measured Kilauea DEM.
# these are introduced redwoods, not a claim about local vegetation.
# front speed, fade, geometry, temperatures, line strengths and shared smoke
# power/footprint are authored. Na I air wavelengths are from NIST's linked
# strong-line table (R56); powers are not the handbook's relative intensities.
# the Douglas-fir smoke coefficients are a proxy; see fire-recipes.md.
# aggregate smoke follows faded active fuel, without transported burn history.
