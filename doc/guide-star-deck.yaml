# Authored small composition, 2026-11-07.
# This is a sampling and layering study, not the planned mountain flyby.
# Four outgoing guide beams: ESO 4LGSF visual reference.
# https://www.eso.org/public/teles-instr/paranal-observatory/vlt/vlt-instr/4lgsf/
# Width, pointing, reach, display strength and weather are authored.
# Shared target; the 64 arcsec off-axis pattern follows ESO GALACSI WFM.
# https://cdn3.eso.org/sci/facilities/develop/ao/sys/galacsi.html
# No sodium return, water budget or adaptive-optics simulation.
"$schema": https://github.com/janearc/slayer/schemas/ecosystem-v1.json
