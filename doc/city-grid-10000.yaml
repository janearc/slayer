# Authored flat city scenery, metres, seed 31: exactly 10,000 buildings.
# All architecture, materials and traffic organization are visual choices.
# This independent example is not installed into any existing scene.
$schema: https://github.com/janearc/slayer/schemas/ecosystem-v2.json
scene:
  name: ten thousand buildings and sixteen traffic circles
  renderer: gpu-native
  seed: 31
  setting: space
  light: none
  set:
    things:
      city:
        kind: city-grid-10000
        seed: 31
        complexity: quick
        east: 0
        north: 0
        height: {value: 0, unit: m}
  film:
    width: 1280
    height: 720
    rays: 1
    wide: 50
    exposure: 1
  cameras:
    overview:
      location: {at: [2600, -3300, 2800]}
      orientation: {look_at: [0, 0, 0]}
    traffic circle:
      location: {at: [-875, 1060, 100]}
      orientation: {look_at: [-960, 960, 0]}
  world:
    unit: 1
    materials:
      ground:
        colour: {srgb_linear: [0.12, 0.14, 0.1]}
        source: eye
    boxes:
      foundation:
        material: ground
        middle: [0, 0, -0.2]
        size: [3260, 3260, 0.3]
        source: eye
    sky:
      horizon: {srgb_linear: [0.35, 0.43, 0.55]}
      zenith: {srgb_linear: [0.12, 0.22, 0.4]}
      ground: {srgb_linear: [0.08, 0.09, 0.07]}
      source: eye
    suns:
      sun:
        toward: [-4, -5, 7]
        colour: {srgb_linear: [3, 2.8, 2.4]}
        source: eye
